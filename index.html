    function retirarMaterial(id, qtdAtual, mat, ender, validade) {
        itemParaRetirar = { id, qtdAtual, mat, ender, validade };
        document.getElementById('modal-titulo').innerText = `Retirar de: ${mat}`;
        document.getElementById('modal-info').innerHTML = `Endereço: <b>${ender}</b> | Saldo Atual: <b style="color:#fff">${qtdAtual} PL</b>`;
        document.getElementById('modal-input-qtd').value = '';
        document.getElementById('modal-retirada').style.display = 'flex';
        setTimeout(() => document.getElementById('modal-input-qtd').focus(), 150);
        document.getElementById('btn-confirmar-modal').onclick = processarRetirada;
    }

    function fecharModal() {
        document.getElementById('modal-retirada').style.display = 'none';
        itemParaRetirar = null;
    }

    async function processarRetirada() {
        const inputQtd = document.getElementById('modal-input-qtd').value;
        const destinoMov = document.getElementById('modal-destino-mov').value;
        const v = parseInt(inputQtd);

        if (isNaN(v) || v <= 0) return alert("Digite uma quantidade válida!");
        if (v > itemParaRetirar.qtdAtual) return alert("Quantidade solicitada maior que o saldo!");

        const { id, qtdAtual, mat, ender, validade } = itemParaRetirar;
        try {
            if (v === qtdAtual) { db.collection("estoque_blocado").doc(id).delete(); } 
            else { db.collection("estoque_blocado").doc(id).update({ qtd: qtdAtual - v }); }

            registrarMovimentacao(ender, mat, validade, `-${v} PL (Retirada)`, destinoMov);
            fecharModal();

            if(navigator.onLine) {
                alert("Retirada concluída com sucesso!");
            } else {
                alert("Retirada salva localmente (Offline)! Será sincronizada automaticamente ao recuperar o sinal.");
            }
        } catch (e) { alert("Erro ao concluir operação."); }
    }

    async function salvarEntradaBloco() {
        const origen = document.getElementById('eb-origem').value;
        const ender = document.getElementById('eb-ender').value.toUpperCase().trim();
        const mat = document.getElementById('eb-mat').value.trim();
        const qtd = parseInt(document.getElementById('eb-qtd').value);
        const inputVenc = document.getElementById('eb-venc').value;

        if(!ender || !mat || isNaN(qtd) || !inputVenc) return alert("Preencha todos os campos da Entrada!");

        const dataV = inputVenc.split('-').reverse().join('/');
        const ocupante = estoqueCompleto.find(i => i.ender === ender);

        if (ocupante) {
            if (ocupante.mat === mat) {
                if (confirm(`Endereço ocupado pelo mesmo material. Somar +${qtd} PL?`)) {
                    db.collection("estoque_blocado").doc(ocupante.id).update({ qtd: ocupante.qtd + qtd });
                    registrarMovimentacao(ender, mat, dataV, `+${qtd} PL (Soma Manual)`, `ENTRADA VIA ${origen}`);
                    alert(navigator.onLine ? "Atualizado com sucesso!" : "Atualizado localmente (Modo Offline)!");
                    limparFormularioEntrada();
                    navegar('retirar');
                }
                return;
            } else { return alert(`BLOQUEADO! O endereço ${ender} já está ocupado por: ${ocupante.mat}`); }
        }

        const desc = document.getElementById('eb-desc').value;
        db.collection("estoque_blocado").add({ ender, mat, qtd, dias: diasCalculados, valFrente: dataV, desc });
        registrarMovimentacao(ender, mat, dataV, `+${qtd} PL (Entrada)`, `ENTRADA VIA ${origen}`);

        alert(navigator.onLine ? "Entrada registrada!" : "Entrada registrada localmente (Modo Offline)!");
        limparFormularioEntrada();
        navegar('retirar');
    }

    function limparFormularioEntrada() {
        document.getElementById('eb-ender').value = '';
        document.getElementById('eb-mat').value = '';
        document.getElementById('eb-desc').value = '';
        document.getElementById('eb-qtd').value = '';
        document.getElementById('eb-venc').value = '';
        document.getElementById('eb-label-dias').innerText = '';
    }

    function carregarDadosOrigemAbertura(enderOrigem) {
        const item = estoqueCompleto.find(i => i.ender.toLowerCase() === enderOrigem.toLowerCase().trim());
        if (item) {
            itemOrigemAbertura = item;
            document.getElementById('ab-mat').value = item.mat;
            document.getElementById('ab-desc').value = item.desc;
            document.getElementById('ab-qtd').placeholder = `Saldo max disponível: ${item.qtd}`;
        } else {
            itemOrigemAbertura = null;
            document.getElementById('ab-mat').value = '';
            document.getElementById('ab-desc').value = '';
            document.getElementById('ab-qtd').placeholder = 'Posição vazia ou não encontrada';
            alert("Nenhum material ativo localizado nesta posição de origem.");
        }
    }

    async function processarAberturaBlocado() {
        const enderDestino = document.getElementById('ab-destino').value.toUpperCase().trim();
        const qtdTransferir = parseInt(document.getElementById('ab-qtd').value);

        if(!itemOrigemAbertura) return alert("Defina uma posição de origem válida primeiro!");
        if(isNaN(qtdTransferir) || qtdTransferir <= 0) return alert("Insira uma quantidade de pallets válida!");
        if(qtdTransferir > itemOrigemAbertura.qtd) return alert("Quantidade inserida maior do que o saldo atual da posição!");
        if(!enderDestino) return alert("Especifique a posição de destino!");

        try {
            const ocupanteDestino = estoqueCompleto.find(i => i.ender === enderDestino);
            if (ocupanteDestino && ocupanteDestino.mat !== itemOrigemAbertura.mat) {
                return alert(`BLOQUEADO! O destino ${enderDestino} está ocupado por outro material: ${ocupanteDestino.mat}`);
            }

            if (qtdTransferir === itemOrigemAbertura.qtd) {
                db.collection("estoque_blocado").doc(itemOrigemAbertura.id).delete();
            } else {
                db.collection("estoque_blocado").doc(itemOrigemAbertura.id).update({ qtd: itemOrigemAbertura.qtd - qtdTransferir });
            }

            if (ocupanteDestino && ocupanteDestino.mat === itemOrigemAbertura.mat) {
                db.collection("estoque_blocado").doc(ocupanteDestino.id).update({ qtd: ocupanteDestino.qtd + qtdTransferir });
            } else {
                db.collection("estoque_blocado").add({
                    ender: enderDestino,
                    mat: itemOrigemAbertura.mat,
                    desc: itemOrigemAbertura.desc,
                    qtd: qtdTransferir,
                    dias: itemOrigemAbertura.dias,
                    valFrente: itemOrigemAbertura.valFrente
                });
            }

            registrarMovimentacao(itemOrigemAbertura.ender, itemOrigemAbertura.mat, itemOrigemAbertura.valFrente, `-${qtdTransferir} PL`, `TRANSFERIDO PARA ${enderDestino}`);
            registrarMovimentacao(enderDestino, itemOrigemAbertura.mat, itemOrigemAbertura.valFrente, `+${qtdTransferir} PL`, `RECEBIDO DE ${itemOrigemAbertura.ender}`);

            alert(navigator.onLine ? "Transferência de Blocado executada!" : "Transferência salva localmente (Modo Offline)!");
            document.getElementById('ab-origem').value = '';
            document.getElementById('ab-destino').value = '';
            document.getElementById('ab-mat').value = '';
            document.getElementById('ab-desc').value = '';
            document.getElementById('ab-qtd').value = '';
            navegar('retirar');

        } catch (error) { alert("Erro ao processar transferência."); }
    }

    function calcularDias(data, labelId) {
        diasCalculados = Math.ceil((new Date(data) - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById(labelId).innerText = `Vencimento em ${diasCalculados} dias`;

    async function registrarMovimentacao(ender, mat, val, qtd, fluxoInfo) {
        const agora = new Date();
        db.collection("movimentacoes_wms").add({ 
            endereco: ender, 
            material: mat, 
            validade: val, 
            quantidade: qtd, 
            fluxo: fluxoInfo || "N/A",
            login: usuarioLogado.email, 
            data: agora.toLocaleDateString('pt-BR'), 
            hora: agora.toLocaleTimeString('pt-BR'), 
            timestamp: agora 
        });
    }

    async function exportarHistoricoExcel() {
        if(!navigator.onLine) return alert("A exportação de planilhas e relatórios necessita de internet ativa.");
        try {
            const snap = await db.collection("movimentacoes_wms").orderBy("timestamp", "desc").get();
            if (snap.empty) return alert("Nenhum histórico.");
            const dados = snap.docs.map(doc => {
                const d = doc.data();
                return { "Endereço": d.endereco, "Material": d.material, "Validade": d.validade, "Qtd": d.quantidade, "Ação/Fluxo": d.fluxo, "Login": d.login, "Data": d.data, "Hora": d.hora };
            });
            const ws = XLSX.utils.json_to_sheet(dados);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Histórico");
            XLSX.writeFile(wb, `Historico_WMS_${new Date().getTime()}.xlsx`);
        } catch (error) { alert("Erro na exportação."); }
    }

    async function importarCSV(event) {
        if(!navigator.onLine) return alert("A importação de novas planilhas massivas exige conexão ativa com a internet.");
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const texto = e.target.result;
                const linhas = texto.split(/\r?\n/).filter(l => l.trim() !== "");
                if (linhas.length <= 1) return alert("Planilha vazia!");
                const dados = linhas.slice(1);
                if (!confirm(`Apagar estoque atual e carregar ${dados.length} itens?`)) return;

                const snapshot = await db.collection("estoque_blocado").get();
                if (!snapshot.empty) {
                    let deleteBatch = db.batch();
                    let delCount = 0;
                    for (const doc of snapshot.docs) {
                        deleteBatch.delete(doc.ref);
                        delCount++;
                        if (delCount % 400 === 0) { await deleteBatch.commit(); deleteBatch = db.batch(); }
                    }
                    await deleteBatch.commit();
                }

                let batch = db.batch();
                let count = 0;
                for (const linha of dados) {
                    const c = linha.split(";");
                    if (c.length >= 6) {
                        const ender = c[0].trim();
                        const mat = c[1].trim();
                        const desc = c[2].trim();
                        const valFrente = c[3].trim();
                        const qtd = parseInt(c[5].replace(/\D/g, '')) || 0;
                        const dias = parseInt(c[7].replace(/\D/g, '')) || 0;
                        if (ender && mat) {
                            const docRef = db.collection("estoque_blocado").doc();
                            batch.set(docRef, { ender, mat, desc, valFrente, qtd, dias });
                            count++;
                            if (count % 400 === 0) { await batch.commit(); batch = db.batch(); }
                        }
                    }
                }
                await batch.commit();
                alert("Importação concluída com sucesso!");
            } catch (error) { alert("Erro ao importar o arquivo."); }
        };
        reader.readAsText(file);
    }
