<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Sistema de Gestão</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #07090f;
            --card: #111827;
            --border: #1e2d45;
            --primary: #00e5ff;
            --primary-dim: rgba(0,229,255,0.1);
            --critico: #f59e0b;
            --retido: #ef4444;
            --verde: #22c55e;
            --text: #e2e8f0;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); }

        /* Login */
        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #111827 0%, #07090f 100%); }
        .login-box { background: var(--card); border: 1px solid var(--border); padding: 40px; border-radius: 16px; width: 340px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--border); background: #07090f; color: white; outline: none; }
        input:focus { border-color: var(--primary); }

        /* Header */
        .header { height: 60px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 24px; position: sticky; top: 0; z-index: 100; }
        .nav-tabs { display: flex; gap: 10px; }
        .nav-tab { padding: 8px 16px; cursor: pointer; border-radius: 6px; font-weight: 600; transition: 0.3s; color: var(--text-dim); }
        .nav-tab.active { background: var(--primary-dim); color: var(--primary); }

        /* Main View */
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .view { display: none; }
        .view.active { display: block; }

        /* Dashboard */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .kpi-value { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; color: var(--primary); }

        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); height: 300px; }

        /* Itens de Estoque */
        .item-card { background: var(--card); border: 1px solid var(--border); border-left: 5px solid #444; border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .item-card.retido { border-left-color: var(--retido); }
        .item-card.critico { border-left-color: var(--critico); }
        .item-card.ok { border-left-color: var(--verde); }
        .ender-badge { background: var(--primary-dim); color: var(--primary); padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 14px; }
        
        .btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .btn-retirar { background: var(--primary); color: #000; }
        .btn-import { background: var(--verde); color: #000; width: 100%; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 12px; width: 400px; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1 style="color: var(--primary); letter-spacing: 4px; margin-bottom: 20px;">WMS FLOW</h1>
        <input type="text" id="login-email" placeholder="E-mail ou Matrícula">
        <input type="password" id="login-senha" placeholder="Senha">
        <button onclick="tentarLogin()" class="btn btn-retirar" style="width: 100%; margin-top: 15px;">ACESSAR SISTEMA</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <div class="logo-tag">WMS FLOW PRO</div>
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchTab('dash')">DASHBOARD</div>
            <div class="nav-tab" onclick="switchTab('estoque')">ESTOQUE</div>
            <div class="nav-tab" id="admin-tab" style="display:none" onclick="switchTab('admin')">ADMIN</div>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="text-align: right">
                <div id="user-name" style="font-weight: 700;">Usuário</div>
                <div id="user-role" style="font-size: 10px; color: var(--primary); letter-spacing: 1px;">ROLE</div>
            </div>
            <button onclick="logout()" class="btn" style="background: #1e2d45; color: white; padding: 5px 12px;">Sair</button>
        </div>
    </div>

    <div class="container">
        <div id="view-dash" class="view active">
            <div class="kpi-grid">
                <div class="kpi-card"><div>Total Pallets</div><div id="kpi-total" class="kpi-value">0</div></div>
                <div class="kpi-card" style="border-top: 3px solid var(--retido)"><div>Retidos (<30d)</div><div id="kpi-retido" class="kpi-value" style="color: var(--retido)">0</div></div>
                <div class="kpi-card" style="border-top: 3px solid var(--critico)"><div>Críticos (31-60d)</div><div id="kpi-critico" class="kpi-value" style="color: var(--critico)">0</div></div>
            </div>
            <div class="charts-container">
                <div class="chart-card"><canvas id="chartStatus"></canvas></div>
                <div class="chart-card"><canvas id="chartTop"></canvas></div>
            </div>
        </div>

        <div id="view-estoque" class="view">
            <input type="text" id="search-input" placeholder="🔍 Buscar material, endereço ou lote..." oninput="renderEstoque()" style="padding: 15px; margin-bottom: 20px; font-size: 16px;">
            <div id="lista-estoque"></div>
        </div>

        <div id="view-admin" class="view">
            <div class="kpi-card" style="max-width: 500px;">
                <h3>Atualizar Base de Dados</h3>
                <p style="font-size: 12px; color: var(--text-dim); margin-bottom: 15px;">Suba o arquivo CSV (Separador: Ponto e vírgula)</p>
                <input type="file" id="csv-file" accept=".csv" onchange="processarCSV(event)">
                <button onclick="document.getElementById('csv-file').click()" class="btn btn-import">IMPORTAR CSV</button>
            </div>
        </div>
    </div>
</div>

<script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let estoqueGlobal = [];
    let usuario = null;
    let myChart1 = null;
    let myChart2 = null;

    // LOGIN
    async function tentarLogin() {
        const emailInput = document.getElementById('login-email').value.trim();
        const senha = document.getElementById('login-senha').value;
        const email = emailInput.includes('@') ? emailInput : `${emailInput}@alb.com`;

        try {
            const userCred = await auth.signInWithEmailAndPassword(email, senha);
            const doc = await db.collection("usuarios_wms").doc(email).get();
            if (doc.exists) {
                usuario = { email, ...doc.data() };
                localStorage.setItem('wms_session', JSON.stringify(usuario));
                iniciarApp();
            }
        } catch (e) { alert("Falha na autenticação!"); }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuario.nome;
        document.getElementById('user-role').innerText = usuario.perfil.toUpperCase();
        
        if(usuario.perfil === 'admin') document.getElementById('admin-tab').style.display = 'block';

        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueGlobal = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderEstoque();
            atualizarDash();
        });
    }

    function switchTab(tab) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`view-${tab}`).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // DASHBOARD & GRÁFICOS
    function atualizarDash() {
        const total = estoqueGlobal.reduce((acc, i) => acc + (parseInt(i.qtd) || 0), 0);
        const retidos = estoqueGlobal.filter(i => i.dias < 30).length;
        const criticos = estoqueGlobal.filter(i => i.dias >= 30 && i.dias <= 60).length;

        document.getElementById('kpi-total').innerText = total;
        document.getElementById('kpi-retido').innerText = retidos;
        document.getElementById('kpi-critico').innerText = criticos;

        initCharts(retidos, criticos, estoqueGlobal.length - (retidos + criticos));
    }

    function initCharts(r, c, ok) {
        const ctx1 = document.getElementById('chartStatus').getContext('2d');
        if(myChart1) myChart1.destroy();
        myChart1 = new Chart(ctx1, {
            type: 'doughnut',
            data: {
                labels: ['Retidos', 'Críticos', 'Liberados'],
                datasets: [{
                    data: [r, c, ok],
                    backgroundColor: ['#ef4444', '#f59e0b', '#22c55e'],
                    borderWidth: 0
                }]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
        });
    }

    // ESTOQUE
    function renderEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';

        estoqueGlobal
            .filter(i => i.mat.toLowerCase().includes(termo) || i.ender.toLowerCase().includes(termo) || i.desc.toLowerCase().includes(termo))
            .sort((a, b) => a.dias - b.dias) // FEFO: Menor dia primeiro
            .forEach(item => {
                const statusClass = item.dias < 30 ? 'retido' : (item.dias <= 60 ? 'critico' : 'ok');
                const card = document.createElement('div');
                card.className = `item-card ${statusClass}`;
                card.innerHTML = `
                    <div>
                        <span class="ender-badge">${item.ender}</span>
                        <div style="font-weight:700; margin-top:5px;">${item.mat} - ${item.desc}</div>
                        <div style="font-size:12px; color:var(--text-dim)">Vencimento: ${item.valFrente} | <strong>${item.dias} dias restantes</strong></div>
                    </div>
                    <div style="text-align:right">
                        <div style="font-size:20px; font-weight:700; color:var(--primary)">${item.qtd} PL</div>
                        <button class="btn btn-retirar" onclick="retirarPallet('${item.id}', ${item.qtd}, '${item.mat}')">RETIRAR</button>
                    </div>
                `;
                lista.appendChild(card);
            });
    }

    async function retirarPallet(id, qtdAtual, mat) {
        const qtd = prompt(`Retirada de ${mat}. Quantos pallets? (Disponível: ${qtdAtual})`);
        if(!qtd || isNaN(qtd) || qtd > qtdAtual || qtd <= 0) return;

        const novaQtd = qtdAtual - parseInt(qtd);
        try {
            if(novaQtd <= 0) await db.collection("estoque_blocado").doc(id).delete();
            else await db.collection("estoque_blocado").doc(id).update({ qtd: novaQtd });
            
            // Log de movimentação
            await db.collection("historico").add({
                operador: usuario.nome,
                material: mat,
                qtd: qtd,
                data: new Date().toISOString()
            });
        } catch(e) { alert("Erro ao processar"); }
    }

    // IMPORTAÇÃO CSV
    function processarCSV(event) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const linhas = e.target.result.split("\n").slice(1);
            const batch = db.batch();
            
            linhas.forEach(linha => {
                const c = linha.split(";");
                if(c.length >= 8) {
                    const docRef = db.collection("estoque_blocado").doc(`${c[0].trim()}_${c[1].trim()}`);
                    batch.set(docRef, {
                        ender: c[0].trim(), mat: c[1].trim(), desc: c[2].trim(),
                        valFrente: c[3].trim(), qtd: parseInt(c[5]) || 0,
                        dias: parseInt(c[7]) || 0
                    });
                }
            });
            await batch.commit();
            alert("Sincronização concluída!");
        };
        reader.readAsText(event.target.files[0], 'ISO-8859-1');
    }

    function logout() {
        auth.signOut();
        localStorage.clear();
        location.reload();
    }

    window.onload = () => {
        const session = localStorage.getItem('wms_session');
        if(session) {
            usuario = JSON.parse(session);
            iniciarApp();
        }
    };
</script>
</body>
</html>
