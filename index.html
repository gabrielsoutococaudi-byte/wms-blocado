<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Sistema de Gestão de Blocado</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0f1e; --card: #161e31; --primary: #00d2ff; --critico: #fbbf24; --retido: #f87171; --verde: #4ade80; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        
        .admin-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 12px; }
        .stat-box { background: var(--card); padding: 12px; border-radius: 8px; border-top: 3px solid var(--primary); text-align: center; }
        .stat-box h5 { margin: 0; font-size: 10px; opacity: 0.6; text-transform: uppercase; }
        .stat-box p { margin: 8px 0 0; font-size: 20px; font-weight: 900; }

        .header { padding: 15px 20px; background: var(--card); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3748; }
        .container { max-width: 900px; margin: auto; padding: 15px; }
        
        .search-area { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        #search-input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; font-size: 15px; outline: none; box-sizing: border-box; }
        .recent-list { margin-top: 10px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .tag { background: #2d3748; padding: 4px 10px; border-radius: 15px; font-size: 11px; cursor: pointer; white-space: nowrap; border: 1px solid transparent; }
        .tag:hover { border-color: var(--primary); }

        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #444; }
        .item-critico { border-left-color: var(--critico); }
        .item-retido { border-left-color: var(--retido); }
        .item-verde { border-left-color: var(--verde); }
        
        .ender-badge { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; }
        
        .btn { padding: 10px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-retirar { background: var(--primary); color: #000; }
        .admin-section { display: none; margin-top: 25px; border-top: 1px solid #334155; padding-top: 20px; }

        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); }
        .login-box { background: var(--card); padding: 30px; border-radius: 15px; width: 300px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 25px;">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula (Ex: 7857)" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #334155; background:#0a0f1e; color:white; box-sizing: border-box;">
        <input type="password" id="login-senha" placeholder="Senha" style="width:100%; padding:10px; margin-bottom:20px; border-radius:5px; border:1px solid #334155; background:#0a0f1e; color:white; box-sizing: border-box;">
        <button id="btn-login" onclick="tentarLogin()" class="btn-retirar" style="width: 100%; border-radius: 5px; font-size: 16px;">ENTRAR</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <div>
            <div id="user-name" style="font-size: 16px; font-weight: 800;"></div>
            <span id="role-label" style="font-size: 10px; opacity: 0.6; text-transform: uppercase;"></span>
        </div>
        <button onclick="logout()" style="background:transparent; border:1px solid #444; color:white; cursor:pointer; padding:5px 10px; border-radius:5px;">Sair</button>
    </div>

    <div class="container">
        <div id="dash-container" class="admin-dashboard" style="display: none;">
            <div class="stat-box"><h5>Total Pallets</h5><p id="st-total">0</p></div>
            <div class="stat-box" style="border-color: var(--critico);"><h5>Críticos (31-60)</h5><p id="st-critico">0</p></div>
            <div class="stat-box" style="border-color: var(--retido);"><h5>Retidos (<30)</h5><p id="st-retido">0</p></div>
        </div>

        <div class="search-area">
            <input type="text" id="search-input" placeholder="Buscar Material ou Descrição..." oninput="processarBusca()">
            <div id="history-tags" class="recent-list"></div>
        </div>

        <div id="lista-estoque"></div>

        <div id="admin-only-section" class="admin-section">
            <h3 style="font-size: 16px; color: var(--verde); margin-bottom: 15px;">Painel do Administrador</h3>
            <div style="display: flex; gap: 10px;">
                <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="importarCSV(event)">
                <button onclick="document.getElementById('csv-file').click()" class="btn" style="background: var(--verde); color: #000;">Importar CSV (Alimentar)</button>
                <button onclick="exportarRelatorio()" class="btn" style="background: #334155; color: white;">Baixar Movimentações</button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    let estoqueCompleto = [];
    let usuarioLogado = null;
    let historicoBusca = JSON.parse(localStorage.getItem('wms_history_v2') || '[]');

    async function tentarLogin() {
        const btn = document.getElementById('btn-login');
        const mat = document.getElementById('login-mat').value.trim();
        const sen = document.getElementById('login-senha').value.trim();
        
        if(!mat || !sen) return alert("Preencha todos os campos!");

        // Formata o e-mail automaticamente se o usuário digitar só o número
        const email = mat.includes('@') ? mat : `${mat}@alb.com`;

        btn.innerText = "AUTENTICANDO...";
        btn.disabled = true;

        try {
            // 1. Tenta logar no Firebase Auth
            const userCredential = await auth.signInWithEmailAndPassword(email, sen);
            
            // 2. Busca o perfil no Firestore
            const doc = await db.collection("usuarios").doc(email).get();

            if (doc.exists) {
                const dados = doc.data();
                usuarioLogado = { 
                    nome: dados.nome, 
                    role: dados.perfil.toUpperCase(),
                    email: email 
                };
                
                localStorage.setItem('wms_session_v2', JSON.stringify(usuarioLogado));
                iniciarApp();
            } else {
                alert("Erro: Perfil não encontrado no banco de dados.");
                auth.signOut();
            }
        } catch (error) {
            console.error(error);
            alert("Acesso Negado: Matrícula ou senha incorretos.");
        } finally {
            btn.innerText = "ENTRAR";
            btn.disabled = false;
        }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        document.getElementById('role-label').innerText = usuarioLogado.role;

        // Controle de visibilidade Admin
        if (usuarioLogado.role === "ADMIN") {
            document.getElementById('dash-container').style.display = 'grid';
            document.getElementById('admin-only-section').style.display = 'block';
        } else {
            document.getElementById('dash-container').style.display = 'none';
            document.getElementById('admin-only-section').style.display = 'none';
        }
        
        renderizarTags();
        conectarFirebase();
    }

    function conectarFirebase() {
        // Usa a sua coleção original de estoque
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            atualizarDashboard();
            renderizarEstoque();
        });
    }

    function atualizarDashboard() {
        if(!usuarioLogado || usuarioLogado.role !== "ADMIN") return;
        document.getElementById('st-total').innerText = estoqueCompleto.reduce((a, b) => a + (parseInt(b.qtd) || 0), 0);
        document.getElementById('st-critico').innerText = estoqueCompleto.filter(i => i.dias >= 31 && i.dias <= 60).length;
        document.getElementById('st-retido').innerText = estoqueCompleto.filter(i => i.dias < 30).length;
    }

    function processarBusca() {
        const termo = document.getElementById('search-input').value.trim();
        if(termo.length > 2) {
            if(!historicoBusca.includes(termo)) {
                historicoBusca.unshift(termo);
                if(historicoBusca.length > 10) historicoBusca.pop();
                localStorage.setItem('wms_history_v2', JSON.stringify(historicoBusca));
                renderizarTags();
            }
        }
        renderizarEstoque();
    }

    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';

        let filtrados = estoqueCompleto.filter(i => 
            (i.mat && i.mat.toLowerCase().includes(termo)) || (i.desc && i.desc.toLowerCase().includes(termo))
        );

        // Lógica de sorte/validade mantida do seu código
        filtrados.sort((a, b) => a.dias - b.dias);

        filtrados.forEach(item => {
            let cor = "item-verde";
            if(item.dias < 30) cor = "item-retido";
            else if(item.dias <= 60) cor = "item-critico";

            const card = document.createElement('div');
            card.className = `item-card ${cor}`;
            card.innerHTML = `
                <div>
                    <span class="ender-badge">${item.ender}</span>
                    <div style="margin-top:5px; font-weight:bold;">${item.mat} - ${item.desc}</div>
                    <div style="font-size:11px; opacity:0.7;">Validade: ${item.val} | Dias: ${item.dias}</div>
                </div>
                <div style="text-align:right">
                    <div style="font-size:18px; font-weight:900;">${item.qtd} PL</div>
                    <button class="btn btn-retirar" onclick="retirar('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender
