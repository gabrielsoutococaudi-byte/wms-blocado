<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WMS FLOW ELITE">
    
    <title>WMS FLOW PRO - Elite Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #050505; 
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #ff3e3e; 
            --primary-glow: rgba(255, 62, 62, 0.3);
            --accent: #6366f1;
            --critico: #fbbf24; 
            --retido: #f87171; 
            --verde: #10b981; 
            --text: #f8fafc; 
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding-bottom: env(safe-area-inset-bottom, 40px); 
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 100%);
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        #network-status {
            display: none;
            background: var(--critico);
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 11px;
            font-weight: 800;
            position: sticky;
            top: 0;
            z-index: 2000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .sidebar { 
            position: fixed; 
            left: -300px; 
            top: 0; 
            width: 280px; 
            height: 100dvh; 
            background: rgba(10, 10, 10, 0.95); 
            backdrop-filter: blur(20px);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1500; 
            padding-top: calc(60px + env(safe-area-inset-top)); 
            border-right: 1px solid var(--glass-border);
        }
        .sidebar.active { left: 0; }
        .sidebar button { 
            width: 85%; 
            padding: 16px 20px; 
            background: transparent; 
            border: none; 
            color: var(--text-secondary); 
            text-align: left; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin: 8px auto;
            border-radius: 12px;
            transition: 0.3s;
        }
        .sidebar button:hover { 
            background: var(--glass); 
            color: var(--text);
            transform: translateX(5px);
        }

        .header { 
            padding: calc(20px + env(safe-area-inset-top)) 24px 20px 24px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            position: sticky; 
            top: 0; 
            z-index: 900; 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .menu-btn { 
            background: var(--glass); 
            border: 1px solid var(--glass-border); 
            padding: 10px; 
            border-radius: 12px; 
            color: white; 
            font-size: 20px; 
            display: flex; 
            width: 44px; 
            height: 44px; 
            align-items: center;
            justify-content: center;
        }
        
        .container { 
            width: 100%;
            max-width: 1000px; 
            margin: auto; 
            padding: 0 20px; 
        }

        /* Modern Stats Grid */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 16px; 
            margin-bottom: 24px; 
        }
        .stat-card { 
            padding: 20px; 
            position: relative;
            overflow: hidden;
        }
        .stat-card h5 { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-card p { font-size: 28px; font-weight: 800; color: #fff; }
        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary);
            opacity: 0.5;
        }

        /* Search Area */
        .search-wrapper {
            margin-bottom: 24px;
            position: relative;
        }
        .search-wrapper input {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 18px 24px;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            width: 100%;
            transition: 0.3s;
        }
        .search-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Item Cards */
        .item-card { 
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px; 
            margin-bottom: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: 0.3s;
        }
        .item-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.06);
        }
        
        .badge { 
            padding: 6px 10px; 
            border-radius: 8px; 
            font-size: 10px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .badge-ender { background: #fff; color: #000; }

        .btn-action { 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 12px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 13px;
            box-shadow: 0 8px 15px var(--primary-glow);
            transition: 0.3s;
        }
        .btn-action:active { transform: scale(0.95); }

        /* Admin Dashboard Enhancements */
        .dashboard-row {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        @media (max-width: 768px) {
            .dashboard-row { grid-template-columns: 1fr; }
        }

        .chart-box {
            padding: 24px;
        }
        .chart-title {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chart-title i { color: var(--primary); }

        .ranking-list { list-style: none; }
        .ranking-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--glass-border);
        }
        .ranking-item:last-child { border-bottom: none; }
        .ranking-avatar {
            width: 36px;
            height: 36px;
            background: var(--glass);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            margin-right: 12px;
            color: var(--primary);
            border: 1px solid var(--glass-border);
        }
        .ranking-info { flex-grow: 1; }
        .ranking-info span { display: block; font-size: 13px; font-weight: 600; }
        .ranking-info small { font-size: 11px; color: var(--text-secondary); }
        .ranking-value { font-weight: 800; color: var(--primary); }

        /* Forms */
        .form-box {
            padding: 30px;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            font-size: 11px; 
            color: var(--text-secondary); 
            text-transform: uppercase; 
            margin-bottom: 8px; 
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        /* Modal */
        #modal-retirada { 
            display:none; 
            position:fixed; 
            top:0; 
            left:0; 
            width:100%; 
            height:100dvh; 
            background:rgba(0,0,0,0.9); 
            z-index:3000; 
            align-items:center; 
            justify-content:center; 
            backdrop-filter: blur(15px); 
            padding: 20px;
        }
        .modal-content { 
            padding: 32px; 
            width:100%; 
            max-width:420px; 
        }

        #login-screen {
            background-image: radial-gradient(circle at center, #222 0%, #000 100%);
        }
        .login-box {
            border: 1px solid var(--glass-border);
            padding: 40px;
            text-align: center;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    </style>
</head>
<body>

<div id="network-status">⚠️ MODO OFFLINE ATIVO</div>

<div id="sidebar" class="sidebar">
    <div style="padding: 24px; font-weight: 900; color: var(--primary); font-size: 20px; letter-spacing: -1px;">WMS FLOW PRO</div>
    <button id="btn-nav-admin" onclick="navegar('admin')" style="display: none;">📊 DASHBOARD ADMIN</button>
    <button onclick="navegar('retirar')">📦 PESQUISAR / RETIRAR</button>
    <button onclick="navegar('entrada_bloco')">🚙 ENTRADA NO BLOCO</button>
    <button onclick="navegar('abertura_blocado')">🔄 ABERTURA DE BLOCADO</button>
    <button onclick="logout()" style="color: var(--retido); margin-top: 40px; border-top: 1px solid var(--glass-border); border-radius: 0; width: 100%;">🚪 SAIR DO SISTEMA</button>
</div>

<div id="login-screen">
    <div class="login-box glass-card">
        <h2 style="color: var(--primary); margin-bottom: 30px; font-weight: 900; font-size: 28px; letter-spacing: -1px;">WMS FLOW</h2>
        <div class="form-group">
            <input type="text" inputmode="numeric" id="login-mat" placeholder="Matrícula" style="margin-bottom:15px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 16px; border-radius: 12px; width: 100%; color: #fff;">
            <input type="password" id="login-senha" placeholder="Senha" style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 16px; border-radius: 12px; width: 100%; color: #fff;">
        </div>
        <button onclick="tentarLogin()" class="btn-action" style="width: 100%; padding: 18px; font-size: 16px;">ACESSAR PLATAFORMA</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div style="flex-grow: 1;">
            <div id="user-name" style="font-weight: 800; font-size: 18px; letter-spacing: -0.5px;"></div>
            <div id="role-label" style="font-size: 10px; color: var(--primary); font-weight: 800; letter-spacing: 1px; text-transform: uppercase;"></div>
        </div>
    </div>

    <div class="container">
        <!-- View Admin Elite -->
        <div id="view-admin" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card glass-card"><h5>ESTOQUE TOTAL</h5><p id="st-total">0</p></div>
                <div class="stat-card glass-card" style="border-bottom: 4px solid var(--critico);"><h5>ALERTA CRÍTICO</h5><p id="st-critico">0</p></div>
                <div class="stat-card glass-card" style="border-bottom: 4px solid var(--retido);"><h5>BLOQUEADOS</h5><p id="st-retido">0</p></div>
            </div>

            <div class="dashboard-row">
                <div class="chart-box glass-card">
                    <div class="chart-title">📊 INVENTÁRIO RETIDO (TOP 10)</div>
                    <canvas id="chart-retidos" style="max-height: 280px;"></canvas>
                </div>
                <div class="chart-box glass-card">
                    <div class="chart-title">⏱️ STATUS DE VALIDADE</div>
                    <canvas id="chart-status" style="max-height: 280px;"></canvas>
                </div>
            </div>

            <div class="dashboard-row">
                <div class="chart-box glass-card">
                    <div class="chart-title">🏆 PERFORMANCE OPERACIONAL</div>
                    <div id="ranking-operadores" class="ranking-list"></div>
                </div>
                <div class="chart-box glass-card">
                    <div class="chart-title">🔥 MATERIAIS EM ALTA</div>
                    <div id="ranking-materiais" class="ranking-list"></div>
                </div>
            </div>

            <div class="glass-card" style="padding: 30px; margin-bottom: 30px;">
                <h3 style="font-size: 14px; color: var(--primary); margin-bottom: 20px; font-weight: 800;">CONTROLE DE DADOS</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="importarCSV(event)">
                    <button class="btn-action" onclick="document.getElementById('csv-file').click()" style="background: var(--glass); border: 1px solid var(--glass-border); box-shadow: none;">IMPORTAR CSV</button>
                    <button class="btn-action" onclick="exportarHistoricoExcel()" style="background: #107c41; box-shadow: 0 8px 15px rgba(16, 124, 65, 0.2);">EXPORTAR EXCEL</button>
                </div>
                <button class="btn-action" onclick="sincronizarBaseMateriais()" style="width: 100%; margin-top: 12px; background: #6366f1; box-shadow: 0 8px 15px rgba(99, 102, 241, 0.2);">SINCRONIZAR BASE DE MATERIAIS (EXCEL)</button>
            </div>
        </div>

        <!-- View Retirar -->
        <div id="view-retirar">
            <div class="search-wrapper">
                <input type="text" inputmode="tel" id="search-input" placeholder="Pesquisar Material ou Posição..." oninput="renderizarEstoque()">
            </div>
            <div id="lista-estoque"></div>
        </div>

        <!-- View Entrada -->
        <div id="view-entrada_bloco" style="display: none;">
            <div class="form-box glass-card">
                <h3 style="color: var(--primary); margin-bottom: 25px; font-weight: 800; font-size: 20px;">Entrada no Bloco</h3>
                <div class="form-group">
                    <label>Origem</label>
                    <select id="eb-origem" style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 16px; border-radius: 12px; color: #fff;">
                        <option value="DRIVE IN">DRIVE IN</option>
                        <option value="RECEBIMENTO">RECEBIMENTO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Destino</label>
                    <input type="text" inputmode="tel" id="eb-ender" placeholder="Ex: 205-14">
                </div>
                <div class="form-group" style="position: relative;">
                    <label>Código Material</label>
                    <input type="text" inputmode="numeric" id="eb-mat" placeholder="Código..." oninput="puxarDescricaoAutocomplete(this.value, 'eb-desc', 'eb-mat-list')">
                    <div id="eb-mat-list" class="autocomplete-items glass-card"></div>
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="eb-desc" readonly style="opacity: 0.5;" placeholder="Auto-preenchimento...">
                </div>
                <div class="form-group">
                    <label>Quantidade (Pallets)</label>
                    <input type="text" inputmode="decimal" id="eb-qtd" placeholder="0">
                </div>
                <div class="form-group">
                    <label>Vencimento</label>
                    <input type="date" id="eb-venc" onchange="calcularDias(this.value, 'eb-label-dias')" style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 16px; border-radius: 12px; color: #fff; width: 100%;">
                    <p id="eb-label-dias" style="color: var(--critico); font-size: 12px; margin-top: 10px; font-weight: 700;"></p>
                </div>
                <button class="btn-action" style="width: 100%; padding: 18px;" onclick="salvarEntradaBloco()">REGISTRAR ENTRADA</button>
            </div>
        </div>

        <!-- View Abertura -->
        <div id="view-abertura_blocado" style="display: none;">
            <div class="form-box glass-card">
                <h3 style="color: var(--primary); margin-bottom: 25px; font-weight: 800; font-size: 20px;">Transferência Interna</h3>
                <div class="form-group">
                    <label>Posição Origem</label>
                    <input type="text" inputmode="tel" id="ab-origem" placeholder="Ex: 201-14" onchange="carregarDadosOrigemAbertura(this.value)">
                </div>
                <div class="form-group">
                    <label>Material</label>
                    <input type="text" id="ab-mat" readonly style="opacity: 0.5;">
                </div>
                <div class="form-group">
                    <label>Posição Destino</label>
                    <input type="text" inputmode="tel" id="ab-destino" placeholder="Ex: 205-20">
                </div>
                <div class="form-group">
                    <label>Quantidade (Pallets)</label>
                    <input type="text" inputmode="decimal" id="ab-qtd" placeholder="Saldo disponível: 0">
                </div>
                <button class="btn-action" style="width: 100%; padding: 18px;" onclick="processarAberturaBlocado()">CONFIRMAR MOVIMENTAÇÃO</button>
            </div>
        </div>
    </div>
</div>

<div id="modal-retirada">
    <div class="modal-content glass-card">
        <h3 id="modal-titulo" style="margin-top:0; color:var(--primary); font-weight: 900; font-size: 22px;">Retirada</h3>
        <p id="modal-info" style="font-size:14px; color: var(--text-secondary); margin: 15px 0 25px; line-height: 1.6;"></p>
        
        <div class="form-group">
            <label>Qtd Pallets:</label>
            <input type="text" id="modal-input-qtd" inputmode="decimal" placeholder="0" style="font-size:36px; text-align:center; background: rgba(255,255,255,0.05); border: 2px solid var(--primary); border-radius: 16px; height: 80px; font-weight: 900; color: #fff; width: 100%;">
        </div>
        
        <div class="form-group">
            <label>Destino:</label>
            <select id="modal-destino-mov" style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 16px; border-radius: 12px; color: #fff; width: 100%;">
                <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                <option value="APANHA">APANHA</option>
                <option value="SEPARAÇÃO">SEPARAÇÃO</option>
            </select>
        </div>

        <div style="display:flex; gap:12px; margin-top:30px;">
            <button onclick="fecharModal()" style="flex:1; padding:16px; background:var(--glass); color:white; border:1px solid var(--glass-border); border-radius:12px; font-weight:bold; cursor:pointer;">VOLTAR</button>
            <button id="btn-confirmar-modal" class="btn-action" style="flex:1;">CONFIRMAR</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });
    db.enablePersistence({ synchronizeTabs: true });

    const auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    let estoqueCompleto = [];
    let baseMateriais = [];
    let usuarioLogado = null;
    let diasCalculados = 0;
    let itemParaRetirar = null;
    let itemOrigemAbertura = null;
    let chartRetidos = null;
    let chartStatus = null;

    window.addEventListener('online', () => document.getElementById('network-status').style.display = 'none');
    window.addEventListener('offline', () => document.getElementById('network-status').style.display = 'block');

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }

    function logout() {
        auth.signOut().then(() => {
            localStorage.removeItem('wms_session');
            location.reload();
        });
    }

    async function tentarLogin() {
        const mat = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        const email = mat.toLowerCase() + "@alb.com";
        try {
            await auth.signInWithEmailAndPassword(email, senha);
            const doc = await db.collection("usuarios_wms").doc(email).get();
            usuarioLogado = doc.exists ? { ...doc.data(), email } : { nome: mat, perfil: "OPERADOR", email };
            localStorage.setItem('wms_session', JSON.stringify(usuarioLogado));
            iniciarApp();
        } catch (e) { alert("Credenciais Inválidas"); }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        const isAdmin = usuarioLogado.perfil?.toUpperCase() === "ADMIN";
        document.getElementById('role-label').innerText = isAdmin ? "ADMINISTRADOR" : "OPERADOR";
        document.getElementById('btn-nav-admin').style.display = isAdmin ? 'block' : 'none';
        conectarFirebase();
        carregarBaseMateriais();
        navegar(isAdmin ? 'admin' : 'retirar');
    }

    function navegar(tela) {
        ['admin', 'retirar', 'entrada_bloco', 'abertura_blocado'].forEach(t => document.getElementById('view-' + t).style.display = 'none');
        document.getElementById('view-' + tela).style.display = 'block';
        document.getElementById('sidebar').classList.remove('active');
        if(tela === 'admin') carregarDadosDashboard();
    }

    function conectarFirebase() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if(usuarioLogado?.perfil?.toUpperCase() === "ADMIN") {
                atualizarEstatisticas();
                carregarDadosDashboard();
            }
            renderizarEstoque();
        });
    }

    async function carregarBaseMateriais() {
        const cache = localStorage.getItem('base_materiais');
        if (cache) baseMateriais = JSON.parse(cache);
        if (navigator.onLine) {
            const snap = await db.collection("base_materiais").get();
            if (!snap.empty) {
                baseMateriais = snap.docs.map(doc => doc.data());
                localStorage.setItem('base_materiais', JSON.stringify(baseMateriais));
            }
        }
    }

    function atualizarEstatisticas() {
        document.getElementById('st-total').innerText = estoqueCompleto.reduce((a, b) => a + (parseInt(b.qtd) || 0), 0);
        document.getElementById('st-critico').innerText = estoqueCompleto.filter(i => i.dias > 30 && i.dias <= 60).length;
        document.getElementById('st-retido').innerText = estoqueCompleto.filter(i => i.dias <= 30).length;
    }

    async function carregarDadosDashboard() {
        if(!navigator.onLine) return;

        // Gráfico de Barras - Retidos
        const agrupadoRetidos = {};
        estoqueCompleto.filter(i => i.dias <= 30).forEach(r => agrupadoRetidos[r.mat] = (agrupadoRetidos[r.mat] || 0) + (parseInt(r.qtd) || 0));
        const sortedRetidos = Object.entries(agrupadoRetidos).sort((a, b) => b[1] - a[1]).slice(0, 10);
        
        const ctxB = document.getElementById('chart-retidos').getContext('2d');
        if (chartRetidos) chartRetidos.destroy();
        chartRetidos = new Chart(ctxB, {
            type: 'bar',
            data: {
                labels: sortedRetidos.map(d => d[0]),
                datasets: [{ label: 'Pallets', data: sortedRetidos.map(d => d[1]), backgroundColor: '#ff3e3e', borderRadius: 8 }]
            },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } } }
        });

        // Gráfico de Rosca - Status
        const statusData = [
            estoqueCompleto.filter(i => i.dias > 60).length,
            estoqueCompleto.filter(i => i.dias > 30 && i.dias <= 60).length,
            estoqueCompleto.filter(i => i.dias <= 30).length
        ];
        const ctxR = document.getElementById('chart-status').getContext('2d');
        if (chartStatus) chartStatus.destroy();
        chartStatus = new Chart(ctxR, {
            type: 'doughnut',
            data: {
                labels: ['Data Boa', 'Crítico', 'Retido'],
                datasets: [{ data: statusData, backgroundColor: ['#10b981', '#fbbf24', '#f87171'], borderWidth: 0, hoverOffset: 10 }]
            },
            options: { responsive: true, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 20, font: { size: 10 } } } } }
        });

        // Rankings
        const hoje = new Date().toLocaleDateString('pt-BR');
        const movSnap = await db.collection("movimentacoes_wms").where("data", "==", hoje).get();
        const ops = {}, mats = {};
        movSnap.docs.forEach(doc => {
            const d = doc.data();
            const login = d.login ? d.login.split('@')[0] : 'N/A';
            ops[login] = (ops[login] || 0) + 1;
            mats[d.material] = (mats[d.material] || 0) + 1;
        });

        renderRanking('ranking-operadores', ops);
        renderRanking('ranking-materiais', mats);
    }

    function renderRanking(id, obj) {
        const el = document.getElementById(id);
        const sorted = Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, 5);
        el.innerHTML = sorted.map(s => `
            <div class="ranking-item">
                <div class="ranking-avatar">${s[0].charAt(0).toUpperCase()}</div>
                <div class="ranking-info"><span>${s[0]}</span><small>Movimentações</small></div>
                <div class="ranking-value">${s[1]}</div>
            </div>`).join('') || '<p style="font-size:12px; color:var(--text-secondary); padding:20px; text-align:center;">Nenhuma atividade registrada hoje.</p>';
    }

    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase().trim();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';
        if (!termo) return;

        const isAdmin = usuarioLogado?.perfil?.toUpperCase() === "ADMIN";
        let filtrados = estoqueCompleto.filter(i => {
            const mat = i.mat?.toString().toLowerCase() || "";
            const ender = i.ender?.toString().toLowerCase() || "";
            return /^\d+$/.test(termo) ? mat === termo : ender.includes(termo);
        });

        if (!isAdmin) filtrados = filtrados.filter(item => item.dias > 30);
        if (filtrados.length === 0) return;

        filtrados.sort((a, b) => (parseInt(a.dias) || 0) - (parseInt(b.dias) || 0));
        if (/^\d+$/.test(termo)) filtrados = [filtrados[0]]; // FEFO Estrito

        filtrados.forEach(item => {
            let status = item.dias <= 30 ? "RETIDO" : (item.dias <= 60 ? "CRÍTICO" : "DATA BOA");
            let cor = item.dias <= 30 ? "var(--retido)" : (item.dias <= 60 ? "var(--critico)" : "var(--verde)");

            const card = document.createElement('div');
            card.className = `item-card`;
            card.style.borderLeft = `6px solid ${cor}`;
            card.innerHTML = `
                <div>
                    <span class="badge badge-ender">${item.ender}</span>
                    <span class="badge" style="background: ${cor}20; color: ${cor}; border: 1px solid ${cor}40; margin-left: 5px;">${status}</span>
                    <div style="font-weight:800; font-size:22px; margin-top:12px; letter-spacing:-1px;">${item.mat}</div>
                    <div style="font-size:12px; color:var(--text-secondary); margin-top:4px; font-weight:500;">${item.desc || "---"}</div>
                    <div style="font-size:11px; margin-top:12px; color: var(--text-secondary);">VAL: <b style="color: ${cor}">${item.dias} DIAS</b></div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size:28px; font-weight:800; margin-bottom:12px;">${item.qtd}<span style="font-size:12px; color:var(--text-secondary); margin-left:4px;">PL</span></div>
                    <button class="btn-action" onclick="retirarMaterial('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender}', '${item.valFrente}')">RETIRAR</button>
                </div>`;
            lista.appendChild(card);
        });
    }

    function puxarDescricaoAutocomplete(val, inputDescId, listId) {
        const list = document.getElementById(listId);
        list.innerHTML = '';
        if (!val) return;
        const matches = baseMateriais.filter(m => m.mat.toString().startsWith(val)).slice(0, 5);
        matches.forEach(m => {
            const div = document.createElement('div');
            div.className = 'autocomplete-item';
            div.innerHTML = `<strong>${m.mat}</strong> - ${m.desc}`;
            div.onclick = () => {
                document.getElementById('eb-mat').value = m.mat;
                document.getElementById(inputDescId).value = m.desc;
                list.innerHTML = '';
            };
            list.appendChild(div);
        });
        const exact = baseMateriais.find(m => m.mat.toString() === val.trim());
        document.getElementById(inputDescId).value = exact ? exact.desc : "NOVO MATERIAL";
    }

    document.addEventListener('click', e => { if (e.target.id !== 'eb-mat') { const l = document.getElementById('eb-mat-list'); if(l) l.innerHTML = ''; } });

    function retirarMaterial(id, qtdAtual, mat, ender, val) {
        itemParaRetirar = { id, qtdAtual, mat, ender, val };
        document.getElementById('modal-titulo').innerText = mat;
        document.getElementById('modal-info').innerHTML = `Posição: <b>${ender}</b><br>Saldo Atual: <b>${qtdAtual} Pallets</b>`;
        document.getElementById('modal-input-qtd').value = '';
        document.getElementById('modal-retirada').style.display = 'flex';
        setTimeout(() => document.getElementById('modal-input-qtd').focus(), 150);
        document.getElementById('btn-confirmar-modal').onclick = processarRetirada;
    }

    function fecharModal() { document.getElementById('modal-retirada').style.display = 'none'; }

    async function processarRetirada() {
        const v = parseInt(document.getElementById('modal-input-qtd').value);
        if (isNaN(v) || v <= 0 || v > itemParaRetirar.qtdAtual) return alert("Qtd Inválida");
        try {
            if (v === itemParaRetirar.qtdAtual) { db.collection("estoque_blocado").doc(itemParaRetirar.id).delete(); } 
            else { db.collection("estoque_blocado").doc(itemParaRetirar.id).update({ qtd: itemParaRetirar.qtdAtual - v }); }
            registrarMovimentacao(itemParaRetirar.ender, itemParaRetirar.mat, itemParaRetirar.val, `-${v} PL`, document.getElementById('modal-destino-mov').value);
            fecharModal();
        } catch (e) { alert("Erro na Retirada"); }
    }

    async function salvarEntradaBloco() {
        const ender = document.getElementById('eb-ender').value.toUpperCase().trim();
        const mat = document.getElementById('eb-mat').value.trim();
        const qtd = parseInt(document.getElementById('eb-qtd').value);
        const inputVenc = document.getElementById('eb-venc').value;
        if(!ender || !mat || isNaN(qtd) || !inputVenc) return alert("Preencha tudo");
        const val = inputVenc.split('-').reverse().join('/');
        const ocupante = estoqueCompleto.find(i => i.ender === ender);
        if (ocupante && ocupante.mat !== mat) return alert("Posição Ocupada");
        if (ocupante) {
            db.collection("estoque_blocado").doc(ocupante.id).update({ qtd: ocupante.qtd + qtd });
        } else {
            db.collection("estoque_blocado").add({ ender, mat, qtd, dias: diasCalculados, valFrente: val, desc: document.getElementById('eb-desc').value });
        }
        registrarMovimentacao(ender, mat, val, `+${qtd} PL`, `ENTRADA VIA ${document.getElementById('eb-origem').value}`);
        ['eb-ender', 'eb-mat', 'eb-desc', 'eb-qtd', 'eb-venc'].forEach(id => document.getElementById(id).value = '');
        navegar('retirar');
    }

    function carregarDadosOrigemAbertura(ender) {
        const item = estoqueCompleto.find(i => i.ender.toLowerCase() === ender.toLowerCase().trim());
        if (item) {
            itemOrigemAbertura = item;
            document.getElementById('ab-mat').value = item.mat;
            document.getElementById('ab-qtd').placeholder = `Max: ${item.qtd}`;
        } else {
            itemOrigemAbertura = null;
            document.getElementById('ab-mat').value = '';
        }
    }

    async function processarAberturaBlocado() {
        const dest = document.getElementById('ab-destino').value.toUpperCase().trim();
        const qtd = parseInt(document.getElementById('ab-qtd').value);
        if(!itemOrigemAbertura || isNaN(qtd) || qtd <= 0 || qtd > itemOrigemAbertura.qtd || !dest) return alert("Erro nos dados");
        const ocup = estoqueCompleto.find(i => i.ender === dest);
        if (ocup && ocup.mat !== itemOrigemAbertura.mat) return alert("Destino Ocupado");
        if (qtd === itemOrigemAbertura.qtd) { db.collection("estoque_blocado").doc(itemOrigemAbertura.id).delete(); } 
        else { db.collection("estoque_blocado").doc(itemOrigemAbertura.id).update({ qtd: itemOrigemAbertura.qtd - qtd }); }
        if (ocup) { db.collection("estoque_blocado").doc(ocup.id).update({ qtd: ocup.qtd + qtd }); } 
        else { db.collection("estoque_blocado").add({ ender: dest, mat: itemOrigemAbertura.mat, desc: itemOrigemAbertura.desc, qtd, dias: itemOrigemAbertura.dias, valFrente: itemOrigemAbertura.valFrente }); }
        registrarMovimentacao(itemOrigemAbertura.ender, itemOrigemAbertura.mat, itemOrigemAbertura.valFrente, `-${qtd} PL`, `PARA ${dest}`);
        registrarMovimentacao(dest, itemOrigemAbertura.mat, itemOrigemAbertura.valFrente, `+${qtd} PL`, `DE ${itemOrigemAbertura.ender}`);
        navegar('retirar');
    }

    function calcularDias(data, labelId) {
        diasCalculados = Math.ceil((new Date(data) - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById(labelId).innerText = `VENCIMENTO EM ${diasCalculados} DIAS`;
    }

    async function registrarMovimentacao(ender, mat, val, qtd, fluxo) {
        const agora = new Date();
        db.collection("movimentacoes_wms").add({ endereco: ender, material: mat, validade: val, quantidade: qtd, fluxo, login: usuarioLogado.email, data: agora.toLocaleDateString('pt-BR'), hora: agora.toLocaleTimeString('pt-BR'), timestamp: agora });
    }

    async function exportarHistoricoExcel() {
        const snap = await db.collection("movimentacoes_wms").orderBy("timestamp", "desc").get();
        const dados = snap.docs.map(doc => { const d = doc.data(); return { "Endereço": d.endereco, "Material": d.material, "Validade": d.validade, "Qtd": d.quantidade, "Ação": d.fluxo, "Login": d.login, "Data": d.data, "Hora": d.hora }; });
        const ws = XLSX.utils.json_to_sheet(dados);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Histórico");
        XLSX.writeFile(wb, `Historico_Elite_${new Date().getTime()}.xlsx`);
    }

    async function importarCSV(event) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const linhas = e.target.result.split(/\r?\n/).filter(l => l.trim() !== "").slice(1);
            let batch = db.batch();
            linhas.forEach((linha, i) => {
                const c = linha.split(";");
                if (c.length >= 6) {
                    batch.set(db.collection("estoque_blocado").doc(), { ender: c[0].trim(), mat: c[1].trim(), desc: c[2].trim(), valFrente: c[3].trim(), qtd: parseInt(c[5].replace(/\D/g, '')) || 0, dias: parseInt(c[7].replace(/\D/g, '')) || 0 });
                    if((i+1)%400===0) { batch.commit(); batch = db.batch(); }
                }
            });
            await batch.commit();
            alert("Sucesso!");
        };
        reader.readAsText(event.target.files[0]);
    }

    async function sincronizarBaseMateriais() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xlsx, .xls';
        input.onchange = async (e) => {
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const data = new Uint8Array(ev.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                let batch = db.batch();
                let count = 0;
                for(const item of json) {
                    const mat = item['Cód. Material'];
                    if(mat) {
                        batch.set(db.collection("base_materiais").doc(mat.toString()), { mat, desc: item['Descrição'] || '', qtd_base: item['Quantidade'] || 0, categoria: item['Categoria'] || '', vasilhame: item['Vasilhame'] || '', lastro: item['Lastro'] || null, camada: item['Camada'] || null });
                        count++;
                        if(count % 400 === 0) { await batch.commit(); batch = db.batch(); }
                    }
                }
                await batch.commit();
                alert("Base Sincronizada!");
                carregarBaseMateriais();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };
        input.click();
    }

    window.onload = () => {
        const session = localStorage.getItem('wms_session');
        if (session) { usuarioLogado = JSON.parse(session); iniciarApp(); }
    };
</script>
