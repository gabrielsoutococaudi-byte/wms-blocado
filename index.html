<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-title" content="WMS FLOW PRO">

    <title>WMS FLOW PRO - Sistema Integrado de Gestão de Estoque</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #DC143C;
            --primary-dark: #E31937;
            --bg-dark: #1A1A1A;
            --bg-light: #F8F9FA;
            --text-dark: #1A1A1A;
            --text-light: #FFFFFF;
            --border-color: #E8EAED;
            --success: #27AE60;
            --warning: #F39C12;
            --danger: #E74C3C;
            --gray-light: #636E72;
            --gray-dark: #2D3436;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }

        .animate-float {
            animation: float 8s ease-in-out infinite;
        }

        .animate-float-delay {
            animation: float 10s ease-in-out infinite 2s;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-light);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gray-light);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-dark);
        }

        /* LOGIN STYLES */
        .login-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d3436 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .login-bg-float {
            position: absolute;
            width: 384px;
            height: 384px;
            background: var(--primary);
            opacity: 0.1;
            border-radius: 50%;
            filter: blur(80px);
        }

        .login-bg-float:nth-child(1) {
            top: -80px;
            right: -80px;
            animation: float 8s ease-in-out infinite;
        }

        .login-bg-float:nth-child(2) {
            bottom: -80px;
            left: -80px;
            animation: float 10s ease-in-out infinite 2s;
        }

        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 448px;
            padding: 16px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 40px;
            text-align: center;
            color: white;
        }

        .login-header-icon {
            width: 64px;
            height: 64px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }

        .login-header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .login-form {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            color: #666;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(220, 20, 60, 0.1);
        }

        .form-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-button:hover {
            box-shadow: 0 8px 20px rgba(220, 20, 60, 0.3);
            transform: translateY(-2px);
        }

        .form-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-error {
            margin-bottom: 24px;
            padding: 16px;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            color: #c33;
            font-size: 13px;
        }

        .login-footer {
            padding: 24px 40px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 11px;
            color: #999;
        }

        /* DASHBOARD STYLES */
        .dashboard-container {
            display: flex;
            height: 100vh;
            background: #f8f9fa;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 256px;
            height: 100vh;
            background: linear-gradient(180deg, #1a1a1a 0%, #2d3436 100%);
            color: white;
            padding: 24px;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .sidebar-logo-text h3 {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .sidebar-logo-text p {
            font-size: 11px;
            color: #999;
        }

        .sidebar-user {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .sidebar-user-label {
            font-size: 10px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .sidebar-user-name {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .sidebar-user-role {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
        }

        .sidebar-menu {
            margin-bottom: 24px;
        }

        .sidebar-menu-item {
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: none;
            color: #ccc;
            margin-bottom: 8px;
        }

        .sidebar-menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .sidebar-menu-item.active {
            background: var(--primary);
            color: white;
        }

        .sidebar-logout {
            width: 100%;
            padding: 12px 16px;
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .sidebar-logout:hover {
            background: rgba(231, 76, 60, 0.3);
        }

        .main-content {
            margin-left: 256px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .header {
            position: fixed;
            top: 0;
            left: 256px;
            right: 0;
            background: white;
            border-bottom: 1px solid #eee;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .header-left h2 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .header-left p {
            font-size: 12px;
            color: #999;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .header-time {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 24px;
            border-left: 1px solid #eee;
        }

        .header-user-info {
            text-align: right;
        }

        .header-user-info p:first-child {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .header-user-info p:last-child {
            font-size: 11px;
            color: #999;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        .content {
            margin-top: 80px;
            padding: 32px;
            flex: 1;
            overflow-y: auto;
        }

        .content-title {
            font-size: 24px;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            border-left: 4px solid var(--primary);
        }

        .card-title {
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 4px solid var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
        }

        .search-box {
            position: relative;
            margin-bottom: 24px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .item-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #27ae60;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            flex: 1;
        }

        .item-badges {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-address {
            background: #333;
            color: white;
        }

        .badge-status {
            background: #fee;
            color: #c33;
        }

        .item-code {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .item-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }

        .item-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            font-size: 12px;
        }

        .item-detail-label {
            color: #999;
            text-transform: uppercase;
            font-size: 10px;
        }

        .item-detail-value {
            font-weight: 600;
            color: #333;
        }

        .item-action {
            text-align: right;
        }

        .item-qty {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 0 8px 20px rgba(220, 20, 60, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .modal-info {
            background: #e3f2fd;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
            font-family: 'Inter', sans-serif;
        }

        .modal-select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-buttons button {
            flex: 1;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .header {
                left: 0;
            }

            .header-right {
                gap: 12px;
            }

            .header-time {
                display: none;
            }

            .item-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .item-action {
                width: 100%;
                text-align: left;
                margin-top: 16px;
            }

            .item-qty {
                font-size: 24px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
            authDomain: "sistema-fefo.firebaseapp.com",
            projectId: "sistema-fefo",
            storageBucket: "sistema-fefo.firebasestorage.app",
            messagingSenderId: "755801777693",
            appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Global State
        let currentUser = null;
        let currentView = 'retirar';
        let estoque = [];
        let sidebarOpen = false;

        // Initialize App
        function init() {
            const session = localStorage.getItem('wms_session');
            if (session) {
                try {
                    currentUser = JSON.parse(session);
                    showDashboard();
                } catch {
                    localStorage.removeItem('wms_session');
                    showLogin();
                }
            } else {
                showLogin();
            }
        }

        // Show Login
        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="login-container">
                    <div class="login-bg-float"></div>
                    <div class="login-bg-float"></div>
                    <div class="login-card">
                        <div class="login-header">
                            <div class="login-header-icon">📦</div>
                            <h1>WMS FLOW PRO</h1>
                            <p>Uberlândia Refresco</p>
                        </div>
                        <form class="login-form" onsubmit="handleLogin(event)">
                            <div id="loginError" class="login-error hidden"></div>
                            <div class="form-group">
                                <label class="form-label">Matrícula</label>
                                <input type="text" id="matricula" class="form-input" placeholder="Digite sua matrícula" inputmode="numeric" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Senha</label>
                                <input type="password" id="senha" class="form-input" placeholder="Digite sua senha" required>
                            </div>
                            <button type="submit" class="form-button">ENTRAR</button>
                        </form>
                        <div class="login-footer">
                            <p>© 2026 Uberlândia Refrescos - Coca-Cola Company</p>
                            <p style="margin-top: 8px;">Sistema de Gestão de Estoque Integrado</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Handle Login
        async function handleLogin(event) {
            event.preventDefault();
            const matricula = document.getElementById('matricula').value;
            const senha = document.getElementById('senha').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const email = `${matricula}@alb.com`;
                await auth.signInWithEmailAndPassword(email, senha);

                const userDoc = await db.collection('usuarios_wms').doc(email).get();
                if (userDoc.exists()) {
                    currentUser = {
                        email,
                        nome: userDoc.data().nome,
                        perfil: userDoc.data().perfil,
                    };
                    localStorage.setItem('wms_session', JSON.stringify(currentUser));
                    showDashboard();
                } else {
                    errorDiv.textContent = 'Usuário não encontrado no banco de dados';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Erro ao fazer login. Verifique suas credenciais.';
                errorDiv.classList.remove('hidden');
            }
        }

        // Show Dashboard
        function showDashboard() {
            loadEstoque();
            renderDashboard();
            updateTime();
            setInterval(updateTime, 1000);
        }

        // Load Estoque
        function loadEstoque() {
            db.collection('estoque_blocado').onSnapshot(snap => {
                estoque = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderContent();
            });
        }

        // Render Dashboard
        function renderDashboard() {
            const isAdmin = currentUser.perfil?.toUpperCase() === 'ADMIN';
            document.getElementById('app').innerHTML = `
                <div class="dashboard-container">
                    <div class="sidebar" id="sidebar">
                        <div class="sidebar-logo">
                            <div class="sidebar-logo-icon">📦</div>
                            <div class="sidebar-logo-text">
                                <h3>WMS FLOW</h3>
                                <p>Pro Edition</p>
                            </div>
                        </div>

                        <div class="sidebar-user">
                            <div class="sidebar-user-label">Usuário</div>
                            <div class="sidebar-user-name">${currentUser.nome}</div>
                            <div class="sidebar-user-role">${isAdmin ? '👨‍💼 ADMINISTRADOR' : '👤 OPERADOR'}</div>
                        </div>

                        <div class="sidebar-menu">
                            ${isAdmin ? '<button class="sidebar-menu-item" onclick="switchView(\'admin\')">📊 Dashboard Admin</button>' : ''}
                            <button class="sidebar-menu-item active" onclick="switchView(\'retirar\')">📦 Pesquisar / Retirar</button>
                            <button class="sidebar-menu-item" onclick="switchView(\'entrada_bloco\')">🚙 Entrada no Bloco</button>
                            <button class="sidebar-menu-item" onclick="switchView(\'abertura_blocado\')">🔄 Abertura de Blocado</button>
                        </div>

                        <button class="sidebar-logout" onclick="handleLogout()">🚪 SAIR</button>
                    </div>

                    <div class="main-content">
                        <div class="header">
                            <div class="header-left">
                                <h2>WMS FLOW PRO</h2>
                                <p>Uberlândia Refresco - Coca-Cola</p>
                            </div>
                            <div class="header-right">
                                <div class="header-time">
                                    <span>🕐</span>
                                    <span id="time">--:--</span>
                                </div>
                                <div class="header-user">
                                    <div class="header-user-info">
                                        <p>${currentUser.nome}</p>
                                        <p>${isAdmin ? 'ADMINISTRADOR' : 'OPERADOR'}</p>
                                    </div>
                                    <div class="header-avatar">${currentUser.nome.charAt(0).toUpperCase()}</div>
                                </div>
                            </div>
                        </div>

                        <div class="content" id="content"></div>
                    </div>
                </div>

                <div class="modal" id="modal">
                    <div class="modal-content">
                        <div class="modal-title" id="modalTitle"></div>
                        <div class="modal-info" id="modalInfo"></div>
                        <input type="number" class="modal-input" id="modalQtd" placeholder="0" inputmode="numeric">
                        <select class="modal-select" id="modalDestino">
                            <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                            <option value="APANHA">APANHA</option>
                            <option value="SEPARAÇÃO">SEPARAÇÃO</option>
                        </select>
                        <div class="modal-buttons">
                            <button class="btn btn-secondary" onclick="closeModal()">CANCELAR</button>
                            <button class="btn btn-primary" onclick="confirmRetirada()">CONFIRMAR</button>
                        </div>
                    </div>
                </div>
            `;
            renderContent();
        }

        // Switch View
        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.sidebar-menu-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            renderContent();
        }

        // Render Content
        function renderContent() {
            const isAdmin = currentUser.perfil?.toUpperCase() === 'ADMIN';
            let html = '';

            if (currentView === 'admin' && isAdmin) {
                html = renderAdminDashboard();
            } else if (currentView === 'retirar') {
                html = renderRetirada();
            } else if (currentView === 'entrada_bloco') {
                html = renderEntradaBloco();
            } else if (currentView === 'abertura_blocado') {
                html = renderAberturaBlocado();
            }

            document.getElementById('content').innerHTML = html;
        }

        // Render Admin Dashboard
        function renderAdminDashboard() {
            const total = estoque.reduce((a, b) => a + (parseInt(b.qtd) || 0), 0);
            const critico = estoque.filter(i => i.dias > 30 && i.dias <= 60).length;
            const retido = estoque.filter(i => i.dias <= 30).length;

            return `
                <h2 class="content-title">Dashboard Administrativo</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total de Pallets</div>
                        <div class="stat-value">${total}</div>
                    </div>
                    <div class="stat-card" style="border-left-color: var(--warning);">
                        <div class="stat-label">Críticos</div>
                        <div class="stat-value">${critico}</div>
                    </div>
                    <div class="stat-card" style="border-left-color: var(--danger);">
                        <div class="stat-label">Retidos</div>
                        <div class="stat-value">${retido}</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">Gerenciamento Administrativo</div>
                    <div style="display: flex; gap: 12px; flex-direction: column;">
                        <input type="file" id="csvFile" accept=".csv" style="display: none;">
                        <button class="btn btn-primary" onclick="document.getElementById('csvFile').click()" style="width: 100%;">📤 ALIMENTAR NOVO ESTOQUE (CSV)</button>
                        <button class="btn btn-primary" onclick="exportarHistorico()" style="width: 100%; background: #27ae60; background-image: linear-gradient(135deg, #27ae60 0%, #229954 100%);">📥 SOLICITAR HISTÓRICO (EXCEL)</button>
                    </div>
                </div>
            `;
        }

        // Render Retirada
        function renderRetirada() {
            const searchTerm = document.getElementById('searchTerm')?.value || '';
            const filtered = estoque
                .filter(item => {
                    if (!searchTerm) return false;
                    const termo = searchTerm.toLowerCase().trim();
                    if (/^\d+$/.test(termo)) {
                        return item.mat.toString().toLowerCase() === termo;
                    }
                    return item.ender.toLowerCase().includes(termo);
                })
                .filter(item => currentUser.perfil?.toUpperCase() === 'ADMIN' || item.dias > 30)
                .sort((a, b) => parseInt(a.dias) - parseInt(b.dias));

            let html = `
                <h2 class="content-title">Pesquisar / Retirar Material</h2>
                <div class="card">
                    <input type="text" id="searchTerm" class="form-input" placeholder="Pesquisar por código ou endereço..." 
                        style="width: 100%; padding: 12px 16px 12px 40px;" 
                        oninput="renderContent()">
                </div>
            `;

            if (filtered.length === 0 && searchTerm) {
                html += '<div style="text-align: center; padding: 40px; color: #999;"><p>Nenhum material encontrado</p></div>';
            }

            filtered.forEach(item => {
                let statusTexto = '', statusClass = '', borderClass = '';
                if (item.dias <= 30) {
                    statusTexto = item.dias < 0 ? 'VENCIDO / RETIDO' : 'RETIDO';
                    statusClass = 'background: #fee; color: #c33;';
                    borderClass = 'border-left-color: #e74c3c;';
                } else if (item.dias <= 60) {
                    statusTexto = 'CRÍTICO';
                    statusClass = 'background: #fef3cd; color: #856404;';
                    borderClass = 'border-left-color: var(--warning);';
                } else {
                    statusTexto = 'DATA BOA';
                    statusClass = 'background: #d4edda; color: #155724;';
                    borderClass = 'border-left-color: var(--success);';
                }

                html += `
                    <div class="item-card" style="${borderClass}">
                        <div class="item-info">
                            <div class="item-badges">
                                <span class="badge badge-address">${item.ender}</span>
                                <span class="badge" style="${statusClass}">${statusTexto}</span>
                            </div>
                            <div class="item-code">${item.mat}</div>
                            <div class="item-desc">${item.desc || 'Sem descrição'}</div>
                            <div class="item-details">
                                <div>
                                    <div class="item-detail-label">Vencimento</div>
                                    <div class="item-detail-value">${item.dias} dias</div>
                                </div>
                                <div>
                                    <div class="item-detail-label">Data Frente</div>
                                    <div class="item-detail-value">${item.valFrente}</div>
                                </div>
                            </div>
                        </div>
                        <div class="item-action">
                            <div class="item-qty">${item.qtd} PL</div>
                            <button class="btn btn-primary" onclick="openRetiradaModal('${item.id}', '${item.mat}', ${item.qtd}, '${item.ender}', '${item.valFrente}')">RETIRAR</button>
                        </div>
                    </div>
                `;
            });

            return html;
        }

        // Render Entrada Bloco
        function renderEntradaBloco() {
            return `
                <h2 class="content-title">Entrada no Bloco</h2>
                <div class="card">
                    <div class="card-title">Registrar Nova Entrada</div>
                    <form onsubmit="handleEntradaBloco(event)" style="display: flex; flex-direction: column; gap: 16px;">
                        <div>
                            <label class="form-label">Origem da Carga</label>
                            <select id="origem" class="form-input" style="padding: 8px;">
                                <option value="STAGE">STAGE</option>
                                <option value="RECEBIMENTO">RECEBIMENTO</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">Endereço Destino (Ex: 205-14)</label>
                            <input type="text" id="enderDestino" class="form-input" placeholder="Digite o endereço..." required>
                        </div>
                        <div>
                            <label class="form-label">Código Material</label>
                            <input type="text" id="matEntrada" class="form-input" placeholder="Código..." inputmode="numeric" required>
                        </div>
                        <div>
                            <label class="form-label">Descrição</label>
                            <input type="text" id="descEntrada" class="form-input" placeholder="Descrição..." readonly style="background: #f0f0f0;">
                        </div>
                        <div>
                            <label class="form-label">Quantidade (Pallets)</label>
                            <input type="number" id="qtdEntrada" class="form-input" placeholder="0" inputmode="numeric" required>
                        </div>
                        <div>
                            <label class="form-label">Data de Vencimento</label>
                            <input type="date" id="vencEntrada" class="form-input" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">✅ SALVAR ENTRADA</button>
                    </form>
                </div>
            `;
        }

        // Render Abertura Blocado
        function renderAberturaBlocado() {
            return `
                <h2 class="content-title">Abertura de Blocado</h2>
                <div class="card">
                    <div class="card-title">Transferir Material</div>
                    <form onsubmit="handleAberturaBlocado(event)" style="display: flex; flex-direction: column; gap: 16px;">
                        <div style="display: flex; gap: 12px;">
                            <div style="flex: 1;">
                                <label class="form-label">Endereço Origem (Ex: 201-14)</label>
                                <input type="text" id="enderOrigem" class="form-input" placeholder="Digite a posição..." required>
                            </div>
                            <div style="display: flex; align-items: flex-end;">
                                <button type="button" class="btn btn-secondary" onclick="carregarOrigem()">CARREGAR</button>
                            </div>
                        </div>
                        <div>
                            <label class="form-label">Código Material</label>
                            <input type="text" id="matOrigem" class="form-input" readonly style="background: #f0f0f0;">
                        </div>
                        <div>
                            <label class="form-label">Descrição</label>
                            <input type="text" id="descOrigem" class="form-input" readonly style="background: #f0f0f0;">
                        </div>
                        <div>
                            <label class="form-label">Endereço Destino (Ex: 205-20)</label>
                            <input type="text" id="enderDestino2" class="form-input" placeholder="Digite a nova posição..." required>
                        </div>
                        <div>
                            <label class="form-label">Quantidade a Transferir (Pallets)</label>
                            <input type="number" id="qtdTransf" class="form-input" placeholder="0" inputmode="numeric" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">🔄 CONFIRMAR TRANSFERÊNCIA</button>
                    </form>
                </div>
            `;
        }

        // Open Retirada Modal
        let modalData = {};
        function openRetiradaModal(id, mat, qtd, ender, val) {
            modalData = { id, mat, qtd, ender, val };
            document.getElementById('modalTitle').textContent = `Retirar de: ${mat}`;
            document.getElementById('modalInfo').innerHTML = `
                <p><strong>Endereço:</strong> ${ender}</p>
                <p style="margin-top: 8px;"><strong>Saldo Atual:</strong> ${qtd} PL</p>
            `;
            document.getElementById('modalQtd').value = '';
            document.getElementById('modal').classList.add('active');
            document.getElementById('modalQtd').focus();
        }

        // Close Modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Confirm Retirada
        async function confirmRetirada() {
            const qtd = parseInt(document.getElementById('modalQtd').value);
            const destino = document.getElementById('modalDestino').value;

            if (isNaN(qtd) || qtd <= 0) {
                alert('Digite uma quantidade válida!');
                return;
            }

            if (qtd > modalData.qtd) {
                alert('Quantidade solicitada maior que o saldo!');
                return;
            }

            try {
                if (qtd === modalData.qtd) {
                    await db.collection('estoque_blocado').doc(modalData.id).delete();
                } else {
                    await db.collection('estoque_blocado').doc(modalData.id).update({
                        qtd: modalData.qtd - qtd
                    });
                }

                await registrarMovimentacao(
                    modalData.ender,
                    modalData.mat,
                    modalData.val,
                    `-${qtd} PL (Retirada)`,
                    destino
                );

                closeModal();
                alert('Retirada processada com sucesso!');
            } catch (error) {
                alert('Erro ao processar retirada');
            }
        }

        // Handle Entrada Bloco
        async function handleEntradaBloco(event) {
            event.preventDefault();
            const origem = document.getElementById('origem').value;
            const ender = document.getElementById('enderDestino').value.toUpperCase();
            const mat = document.getElementById('matEntrada').value;
            const desc = document.getElementById('descEntrada').value;
            const qtd = parseInt(document.getElementById('qtdEntrada').value);
            const venc = document.getElementById('vencEntrada').value;

            if (!ender || !mat || !qtd || !venc) {
                alert('Preencha todos os campos!');
                return;
            }

            try {
                const dataV = venc.split('-').reverse().join('/');
                const ocupante = estoque.find(i => i.ender === ender);

                if (ocupante) {
                    if (ocupante.mat === mat) {
                        if (confirm(`Endereço ocupado pelo mesmo material. Somar +${qtd} PL?`)) {
                            await db.collection('estoque_blocado').doc(ocupante.id).update({
                                qtd: ocupante.qtd + qtd
                            });
                            await registrarMovimentacao(ender, mat, dataV, `+${qtd} PL (Soma Manual)`, `ENTRADA VIA ${origem}`);
                            alert('Atualizado com sucesso!');
                            event.target.reset();
                        }
                    } else {
                        alert(`BLOQUEADO! Endereço ${ender} já ocupado por: ${ocupante.mat}`);
                    }
                    return;
                }

                const diasCalculados = Math.ceil((new Date(venc) - new Date()) / (1000 * 60 * 60 * 24));

                await db.collection('estoque_blocado').add({
                    ender,
                    mat,
                    qtd,
                    dias: diasCalculados,
                    valFrente: dataV,
                    desc: desc || 'NOVO MATERIAL'
                });

                await registrarMovimentacao(ender, mat, dataV, `+${qtd} PL (Entrada)`, `ENTRADA VIA ${origem}`);
                alert('Entrada registrada com sucesso!');
                event.target.reset();
            } catch (error) {
                alert('Erro ao salvar entrada');
            }
        }

        // Handle Abertura Blocado
        let itemOrigemData = null;
        async function carregarOrigem() {
            const ender = document.getElementById('enderOrigem').value.toLowerCase().trim();
            const item = estoque.find(i => i.ender.toLowerCase() === ender);

            if (item) {
                itemOrigemData = item;
                document.getElementById('matOrigem').value = item.mat;
                document.getElementById('descOrigem').value = item.desc;
            } else {
                alert('Nenhum material ativo localizado nesta posição');
                itemOrigemData = null;
                document.getElementById('matOrigem').value = '';
                document.getElementById('descOrigem').value = '';
            }
        }

        async function handleAberturaBlocado(event) {
            event.preventDefault();

            if (!itemOrigemData) {
                alert('Defina uma posição de origem válida!');
                return;
            }

            const qtd = parseInt(document.getElementById('qtdTransf').value);
            const enderDestino = document.getElementById('enderDestino2').value.toUpperCase().trim();

            if (isNaN(qtd) || qtd <= 0) {
                alert('Insira uma quantidade válida!');
                return;
            }

            if (qtd > itemOrigemData.qtd) {
                alert('Quantidade maior que o saldo!');
                return;
            }

            if (!enderDestino) {
                alert('Especifique o endereço de destino!');
                return;
            }

            try {
                const ocupanteDestino = estoque.find(i => i.ender === enderDestino);

                if (ocupanteDestino && ocupanteDestino.mat !== itemOrigemData.mat) {
                    alert(`BLOQUEADO! Destino ${enderDestino} ocupado por: ${ocupanteDestino.mat}`);
                    return;
                }

                if (qtd === itemOrigemData.qtd) {
                    await db.collection('estoque_blocado').doc(itemOrigemData.id).delete();
                } else {
                    await db.collection('estoque_blocado').doc(itemOrigemData.id).update({
                        qtd: itemOrigemData.qtd - qtd
                    });
                }

                if (ocupanteDestino && ocupanteDestino.mat === itemOrigemData.mat) {
                    await db.collection('estoque_blocado').doc(ocupanteDestino.id).update({
                        qtd: ocupanteDestino.qtd + qtd
                    });
                } else {
                    await db.collection('estoque_blocado').add({
                        ender: enderDestino,
                        mat: itemOrigemData.mat,
                        desc: itemOrigemData.desc,
                        qtd,
                        dias: itemOrigemData.dias,
                        valFrente: itemOrigemData.valFrente
                    });
                }

                await registrarMovimentacao(
                    itemOrigemData.ender,
                    itemOrigemData.mat,
                    itemOrigemData.valFrente,
                    `-${qtd} PL`,
                    `TRANSFERIDO PARA ${enderDestino}`
                );

                await registrarMovimentacao(
                    enderDestino,
                    itemOrigemData.mat,
                    itemOrigemData.valFrente,
                    `+${qtd} PL`,
                    `RECEBIDO DE ${itemOrigemData.ender}`
                );

                alert('Transferência executada com sucesso!');
                event.target.reset();
                itemOrigemData = null;
            } catch (error) {
                alert('Erro ao processar transferência');
            }
        }

        // Registrar Movimentação
        async function registrarMovimentacao(endereco, material, validade, quantidade, fluxo) {
            const agora = new Date();
            await db.collection('movimentacoes_wms').add({
                endereco,
                material,
                validade,
                quantidade,
                fluxo,
                login: currentUser.email,
                data: agora.toLocaleDateString('pt-BR'),
                hora: agora.toLocaleTimeString('pt-BR'),
                timestamp: agora
            });
        }

        // Exportar Histórico
        async function exportarHistorico() {
            try {
                const snap = await db.collection('movimentacoes_wms').orderBy('timestamp', 'desc').get();

                if (snap.empty) {
                    alert('Nenhum histórico disponível');
                    return;
                }

                const dados = snap.docs.map(doc => {
                    const d = doc.data();
                    return {
                        'Endereço': d.endereco,
                        'Material': d.material,
                        'Validade': d.validade,
                        'Qtd': d.quantidade,
                        'Ação/Fluxo': d.fluxo,
                        'Login': d.login,
                        'Data': d.data,
                        'Hora': d.hora
                    };
                });

                const ws = XLSX.utils.json_to_sheet(dados);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Histórico');
                XLSX.writeFile(wb, `Historico_WMS_${new Date().getTime()}.xlsx`);
            } catch (error) {
                alert('Erro ao exportar histórico');
            }
        }

        // Update Time
        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        // Handle Logout
        function handleLogout() {
            if (confirm('Tem certeza que deseja sair?')) {
                localStorage.removeItem('wms_session');
                currentUser = null;
                showLogin();
            }
        }

        // Initialize
        init();
    </script>
</body>
</html>
