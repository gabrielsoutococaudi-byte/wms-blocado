<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Sistema Integrado</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #0a0f1e; --card: #161e31; --primary: #00d2ff; --critico: #fbbf24; --retido: #f87171; --verde: #4ade80; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1000; padding-top: 60px; border-right: 1px solid #2d3748; box-shadow: 10px 0 20px rgba(0,0,0,0.5); }
        .sidebar.active { left: 0; }
        .sidebar button { width: 100%; padding: 15px; background: transparent; border: none; color: white; text-align: left; cursor: pointer; border-bottom: 1px solid #2d3748; font-weight: bold; font-size: 14px; }
        .sidebar button:hover { background: rgba(255,255,255,0.05); }

        .header { padding: 15px 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 900; }
        .menu-btn { background: none; border: 1px solid #444; padding: 8px; border-radius: 5px; cursor: pointer; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        .admin-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 8px; border-top: 3px solid var(--primary); text-align: center; }
        .stat-box h5 { margin: 0; font-size: 10px; opacity: 0.6; text-transform: uppercase; }
        .stat-box p { margin: 8px 0 0; font-size: 24px; font-weight: 900; }

        .search-area { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; outline: none; }
        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid var(--critico); }
        
        .badge-ender { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        .badge-status { background: var(--critico); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-left: 8px; }

        .btn-retirar { background: var(--primary); color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: 900; cursor: pointer; }
        .btn-admin { background: var(--verde); color: #000; padding: 15px; width: 100%; border-radius: 8px; font-weight: 900; margin-top: 10px; border: none; cursor: pointer; text-transform: uppercase; }
        
        #offline-badge { display: none; background: var(--retido); color: white; text-align: center; font-size: 11px; padding: 5px; font-weight: bold; position: fixed; bottom: 0; width: 100%; z-index: 2000; }
    </style>
</head>
<body>

<div id="offline-badge">MODO OFFLINE ATIVO - DADOS SERÃO SINCRONIZADOS AO RECONECTAR</div>

<div id="sidebar" class="sidebar">
    <button id="btn-nav-admin" onclick="navegar('admin')" style="display: none;">📊 DASHBOARD ADMIN</button>
    <button onclick="navegar('retirar')">📦 RETIRAR / PESQUISAR</button>
    <button onclick="navegar('abastecer')">📥 ABASTECER BLOCO</button>
    <button onclick="logout()" style="color: var(--retido); margin-top: 20px;">🚪 DESLOGAR</button>
</div>

<div id="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 25px;">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula" style="margin-bottom:10px;">
        <input type="password" id="login-senha" placeholder="Senha" style="margin-bottom:20px;">
        <button onclick="tentarLogin()" class="btn-retirar" style="width: 100%; font-size: 16px;">ENTRAR</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div style="flex-grow: 1;">
            <div id="user-name" style="font-weight: 800; font-size: 16px;"></div>
            <div id="role-label" style="font-size: 10px; color: var(--primary); font-weight: bold; letter-spacing: 1px;"></div>
        </div>
    </div>

    <div class="container">
        <div id="view-admin" style="display: none;">
            <div id="dash-container" class="admin-dashboard">
                <div class="stat-box"><h5>TOTAL PALLETS</h5><p id="st-total">0</p></div>
                <div class="stat-box" style="border-color: var(--critico);"><h5>CRÍTICOS (≤60d)</h5><p id="st-critico">0</p></div>
                <div class="stat-box" style="border-color: var(--retido);"><h5>RETIDOS (≤30d)</h5><p id="st-retido">0</p></div>
            </div>

            <div id="admin-tools-section" style="background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #2d3748;">
                <h3 style="font-size: 12px; color: var(--primary); margin-top: 0;">GERENCIAMENTO ADMINISTRATIVO</h3>
                <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="importarCSV(event)">
                <button class="btn-admin" onclick="document.getElementById('csv-file').click()">ALIMENTAR NOVO ESTOQUE (CSV)</button>
                <button class="btn-admin" style="background: #107c41; color: white;" onclick="exportarHistoricoExcel()">SOLICITAR HISTÓRICO (EXCEL)</button>
            </div>
        </div>

        <div id="view-retirar">
            <div class="search-area">
                <h4 style="margin: 0 0 10px 0; font-size: 12px; color: var(--critico);">FILTRO DE SEGURANÇA: APENAS LOTES CRÍTICOS</h4>
                <input type="text" id="search-input" placeholder="Pesquisar material ou endereço..." oninput="renderizarEstoque()">
            </div>
            <div id="lista-estoque"></div>
        </div>

        <div id="view-abastecer" style="display: none;">
            <div style="background: var(--card); padding: 25px; border-radius: 12px;">
                <h3 style="color: var(--primary); margin-top: 0;">ABASTECER BLOCO</h3>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 11px; color: #94a3b8;">Endereço (Ex: A-01-01)</label>
                    <input type="text" id="in-ender" placeholder="Endereço...">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 11px; color: #94a3b8;">Código Material</label>
                    <input type="text" id="in-mat" placeholder="Código..." oninput="puxarDescricao(this.value)">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 11px; color: #94a3b8;">Descrição do Produto</label>
                    <input type="text" id="in-desc" readonly style="opacity: 0.5;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 11px; color: #94a3b8;">Quantidade de Pallets</label>
                    <input type="number" id="in-qtd">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 11px; color: #94a3b8;">Data de Vencimento</label>
                    <input type="date" id="in-venc" onchange="calcularDias(this.value)">
                    <p id="label-dias" style="color: var(--critico); font-size: 12px; margin-top: 5px; font-weight: bold;"></p>
                </div>
                <button class="btn-admin" style="background: #7c3aed; color: white;" onclick="salvarAbastecimentoManual()">SALVAR ENTRADA</button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    db.enablePersistence().catch(() => {});
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    let estoqueCompleto = [];
    let usuarioLogado = null;
    let diasCalculados = 0;

    // Monitor Online/Offline
    window.addEventListener('online', () => document.getElementById('offline-badge').style.display = 'none');
    window.addEventListener('offline', () => document.getElementById('offline-badge').style.display = 'block');

    async function tentarLogin() {
        const mat = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        try {
            await auth.signInWithEmailAndPassword(mat + "@alb.com", senha);
            const doc = await db.collection("usuarios_wms").doc(mat + "@alb.com").get();
            if (doc.exists) {
                usuarioLogado = doc.data();
                usuarioLogado.email = mat + "@alb.com";
                localStorage.setItem('wms_session', JSON.stringify(usuarioLogado));
                iniciarApp();
            }
        } catch (e) { 
            const session = localStorage.getItem('wms_session');
            if(session) { usuarioLogado = JSON.parse(session); iniciarApp(); }
            else alert("Erro de Login."); 
        }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        const isAdmin = usuarioLogado.perfil.toUpperCase() === "ADMIN";
        document.getElementById('btn-nav-admin').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('admin-tools-section').style.display = isAdmin ? 'block' : 'none';
        conectarFirebase();
        navegar(isAdmin ? 'admin' : 'retirar');
    }

    function conectarFirebase() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            atualizarEstatisticas();
            renderizarEstoque();
        });
    }

    function atualizarEstatisticas() {
        if(usuarioLogado.perfil.toUpperCase() !== "ADMIN") return;
        document.getElementById('st-total').innerText = estoqueCompleto.reduce((a, b) => a + (parseInt(b.qtd) || 0), 0);
        document.getElementById('st-critico').innerText = estoqueCompleto.filter(i => i.dias <= 60).length;
        document.getElementById('st-retido').innerText = estoqueCompleto.filter(i => i.dias <= 30).length;
    }

    // --- FUNÇÃO DE BUSCA COM REGRA DE SEGURANÇA (APENAS CRÍTICOS) ---
    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase().trim();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';
        if (termo.length === 0) return;

        // FILTRO: Só mostra se bater o nome E se for CRÍTICO (<= 60 dias)
        let filtrados = estoqueCompleto.filter(i => {
            const match = i.mat.toLowerCase().includes(termo) || i.ender.toLowerCase().includes(termo);
            const critico = i.dias <= 60; 
            return match && critico;
        });
        
        filtrados.sort((a, b) => a.dias - b.dias);

        if (filtrados.length === 0) {
            lista.innerHTML = '<p style="text-align:center; color: var(--verde); padding: 20px;">Nenhum lote crítico (≤60 dias) encontrado.</p>';
            return;
        }

        filtrados.forEach(item => {
            const card = document.createElement('div');
            card.className = `item-card`;
            card.innerHTML = `
                <div>
                    <span class="badge-ender">${item.ender}</span>
                    <span class="badge-status">CRÍTICO</span>
                    <div style="font-weight:900; font-size:18px; margin-top:5px;">${item.mat}</div>
                    <div style="font-size:11px; opacity:0.7;">${item.desc}</div>
                    <div style="font-size:12px; margin-top:5px;">Vence em: <b>${item.dias} dias</b></div>
                </div>
                <div style="text-align:right">
                    <div style="font-size:22px; font-weight:900;">${item.qtd} PL</div>
                    <button class="btn-retirar" onclick="retirarMaterial('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender}', '${item.valFrente}')">RETIRAR</button>
                </div>`;
            lista.appendChild(card);
        });
    }

    // --- IMPORTAÇÃO CSV COM LIMPEZA DE BANCO ---
    async function importarCSV(event) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const linhas = e.target.result.split(/\r?\n/).filter(l => l.trim() !== "").slice(1);
            if(!confirm(`ATENÇÃO: Isso apagará o estoque antigo para carregar ${linhas.length} novos registros. Confirma?`)) return;

            try {
                // Passo 1: Limpa Tudo
                const snap = await db.collection("estoque_blocado").get();
                const batchDel = db.batch();
                snap.forEach(doc => batchDel.delete(doc.ref));
                await batchDel.commit();

                // Passo 2: Sobe Planilha
                const batchAdd = db.batch();
                linhas.forEach(l => {
                    const c = l.split(";");
                    if(c.length >= 6) {
                        const id = c[0].trim() + "_" + c[1].trim();
                        batchAdd.set(db.collection("estoque_blocado").doc(id), { 
                            ender: c[0].trim(), mat: c[1].trim(), desc: c[2].trim(), 
                            valFrente: c[3].trim(), qtd: parseInt(c[5]) || 0, dias: parseInt(c[7]) || 0 
                        });
                    }
                });
                await batchAdd.commit();
                alert("Base de Dados Sincronizada com Sucesso!");
                location.reload();
            } catch (err) { alert("Erro ao sincronizar."); }
        };
        reader.readAsText(event.target.files[0], 'ISO-8859-1');
    }

    async function salvarAbastecimentoManual() {
        const ender = document.getElementById('in-ender').value.toUpperCase().trim();
        const mat = document.getElementById('in-mat').value.trim();
        const qtd = parseInt(document.getElementById('in-qtd').value);
        const dataV = document.getElementById('in-venc').value.split('-').reverse().join('/');
        if(!ender || !mat || isNaN(qtd) || !document.getElementById('in-venc').value) return alert("Preencha tudo!");

        try {
            const id = ender + "_" + mat;
            await db.collection("estoque_blocado").doc(id).set({ 
                ender, mat, qtd, dias: diasCalculados, valFrente: dataV, 
                desc: document.getElementById('in-desc').value 
            }, { merge: true });

            registrarMovimentacao(ender, mat, dataV, `+${qtd} PL (Abastecimento)`);
            alert("Entrada Registrada!"); 
            navegar('retirar');
        } catch(e) { alert("Erro ao salvar."); }
    }

    async function retirarMaterial(id, qtdAtual, mat, ender, validade) {
        const n = prompt(`Quantos pallets retirar de ${mat}? (Saldo: ${qtdAtual})`);
        if(!n || isNaN(n) || n > qtdAtual) return alert("Valor inválido!");
        const v = parseInt(n);
        try {
            if(v === qtdAtual) await db.collection("estoque_blocado").doc(id).delete();
            else await db.collection("estoque_blocado").doc(id).update({ qtd: qtdAtual - v });
            
            registrarMovimentacao(ender, mat, validade, `-${v} PL (Retirada)`);
            alert("Baixa concluída!");
        } catch(e) { alert("Erro na retirada."); }
    }

    async function registrarMovimentacao(e, m, v, q) {
        const agora = new Date();
        await db.collection("movimentacoes_wms").add({ 
            endereco: e, material: m, validade: v, quantidade: q, 
            login: usuarioLogado.email, data: agora.toLocaleDateString('pt-BR'), 
            hora: agora.toLocaleTimeString('pt-BR'), timestamp: agora 
        });
    }

    function puxarDescricao(cod) {
        const p = estoqueCompleto.find(i => i.mat === cod);
        document.getElementById('in-desc').value = p ? p.desc : "NOVO MATERIAL";
    }

    function calcularDias(data) {
        diasCalculados = Math.ceil((new Date(data) - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById('label-dias').innerText = `Vencimento em ${diasCalculados} dias`;
    }

    function navegar(tela) {
        ['admin', 'retirar', 'abastecer'].forEach(t => document.getElementById('view-' + t).style.display = 'none');
        document.getElementById('view-' + tela).style.display = 'block';
        document.getElementById('sidebar').classList.remove('active');
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    function logout() { auth.signOut(); localStorage.removeItem('wms_session'); location.reload(); }

    window.onload = () => {
        const s = localStorage.getItem('wms_session');
        if(s) { usuarioLogado = JSON.parse(s); iniciarApp(); }
    };
</script>
</body>
</html>
