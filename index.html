<div id="sidebar" class="sidebar">
    <button onclick="navegar('remanejar')" style="border-left: 4px solid var(--critico);">🔄 REMANEJAR PALLETS</button>
    <button onclick="logout()" style="color: var(--retido); margin-top: 20px;">🚪 DESLOGAR</button>
</div>

<div id="view-remanejar" style="display: none;">
    <div style="background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid var(--critico);">
        <h3 style="color: var(--critico); margin-top: 0;">REMANEJAMENTO DE BLOCO</h3>
        
        <div style="margin-bottom: 15px;">
            <label style="font-size: 11px; color: #94a3b8;">Endereço de Origem</label>
            <input type="text" id="rem-origem" placeholder="Ex: 201-03" onchange="buscarDadosOrigem(this.value)">
        </div>

        <div id="dados-origem-preview" style="display:none; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 13px;">
            Material: <b id="txt-rem-mat">---</b> | Saldo: <b id="txt-rem-qtd">0</b> PL
        </div>

        <div style="margin-bottom: 15px;">
            <label style="font-size: 11px; color: #94a3b8;">Endereço de Destino</label>
            <input type="text" id="rem-destino" placeholder="Ex: 205-14">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="font-size: 11px; color: #94a3b8;">Quantidade (PL)</label>
            <input type="number" id="rem-qtd" placeholder="0">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="font-size: 11px; color: #94a3b8;">Data da Movimentação</label>
            <input type="date" id="rem-data-mov">
        </div>

        <button class="btn-admin" style="background: var(--critico); color: black;" onclick="processarRemanejamentoDireto()">CONFIRMAR MOVIMENTAÇÃO</button>
    </div>
</div>

<script>
    // --- LÓGICA DE DATA AUTOMÁTICA ---
    // Define a data de hoje como padrão ao carregar
    function configurarDatas() {
        const hoje = new Date().toISOString().split('T')[0];
        if(document.getElementById('rem-data-mov')) document.getElementById('rem-data-mov').value = hoje;
        if(document.getElementById('in-venc')) document.getElementById('in-venc').min = hoje;
    }

    // --- BUSCA RÁPIDA PARA REMANEJAMENTO ---
    function buscarDadosOrigem(ender) {
        const item = estoqueCompleto.find(i => i.ender.toUpperCase() === ender.toUpperCase());
        const preview = document.getElementById('dados-origem-preview');
        if (item) {
            document.getElementById('txt-rem-mat').innerText = item.mat;
            document.getElementById('txt-rem-qtd').innerText = item.qtd;
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
            alert("Endereço de origem não encontrado no estoque!");
        }
    }

    // --- PROCESSAR MOVIMENTAÇÃO PELO MENU ---
    async function processarRemanejamentoDireto() {
        const origem = document.getElementById('rem-origem').value.toUpperCase().trim();
        const destino = document.getElementById('rem-destino').value.toUpperCase().trim();
        const qtd = parseInt(document.getElementById('rem-qtd').value);
        const dataMov = document.getElementById('rem-data-mov').value;

        if (!origem || !destino || isNaN(qtd) || !dataMov) {
            return alert("Preencha todos os campos, incluindo a data!");
        }

        const itemOrigem = estoqueCompleto.find(i => i.ender === origem);
        if (!itemOrigem || qtd > itemOrigem.qtd) {
            return alert("Saldo insuficiente ou origem inválida!");
        }

        try {
            // 1. Atualiza/Remove Origem
            if (qtd === itemOrigem.qtd) {
                await db.collection("estoque_blocado").doc(itemOrigem.id).delete();
            } else {
                await db.collection("estoque_blocado").doc(itemOrigem.id).update({ qtd: itemOrigem.qtd - qtd });
            }

            // 2. Adiciona ao Destino
            const itemDestino = estoqueCompleto.find(i => i.ender === destino);
            if (itemDestino && itemDestino.mat === itemOrigem.mat) {
                await db.collection("estoque_blocado").doc(itemDestino.id).update({ qtd: itemDestino.qtd + qtd });
            } else if (itemDestino) {
                return alert("Destino ocupado por outro material!");
            } else {
                await db.collection("estoque_blocado").add({
                    ender: destino,
                    mat: itemOrigem.mat,
                    qtd: qtd,
                    desc: itemOrigem.desc,
                    valFrente: itemOrigem.valFrente,
                    dias: itemOrigem.dias
                });
            }

            // 3. Registrar Log com a Data escolhida
            await db.collection("movimentacoes_wms").add({
                tipo: "REMANEJAMENTO",
                origem: origem,
                destino: destino,
                material: itemOrigem.mat,
                quantidade: qtd,
                data_mov: dataMov, // Data informada pelo usuário
                operador: usuarioLogado.email,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Movimentação concluída!");
            location.reload(); 
        } catch (e) {
            alert("Erro: " + e.message);
        }
    }

    // Atualize sua função navegar para incluir a nova tela
    function navegar(tela) {
        ['admin', 'retirar', 'abastecer', 'remanejar'].forEach(t => {
            const el = document.getElementById('view-' + t);
            if(el) el.style.display = 'none';
        });
        document.getElementById('view-' + tela).style.display = 'block';
        document.getElementById('sidebar').classList.remove('active');
        if(tela === 'remanejar') configurarDatas();
    }
</script>
