<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WMS FLOW PRO">
    <meta name="description" content="WMS FLOW PRO - Sistema Integrado de Gestão de Estoque">
    <meta name="theme-color" content="#DC143C">
    
    <title>WMS FLOW PRO - Sistema Integrado de Gestão de Estoque</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #DC143C;
            --primary-dark: #E31937;
            --bg-dark: #1A1A1A;
            --bg-light: #F8F9FA;
            --card: #FFFFFF;
            --text-dark: #1A1A1A;
            --text-light: #FFFFFF;
            --border-color: #E8EAED;
            --verde: #27AE60;
            --critico: #F39C12;
            --retido: #E74C3C;
            --gray-light: #636E72;
            --gray-dark: #2D3436;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(15px); }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-light); }
        ::-webkit-scrollbar-thumb { background: var(--gray-light); border-radius: 4px; }

        /* LOGIN RESPONSIVO */
        .login-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d3436 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 16px;
        }

        .login-bg-float {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            opacity: 0.1;
            border-radius: 50%;
            filter: blur(80px);
        }

        .login-bg-float:nth-child(1) { top: -80px; right: -80px; animation: float 8s ease-in-out infinite; }
        .login-bg-float:nth-child(2) { bottom: -80px; left: -80px; animation: float 10s ease-in-out infinite 2s; }

        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 32px 20px;
            text-align: center;
            color: white;
        }

        .login-header h1 { font-size: 24px; }

        .login-header-icon {
            width: 56px;
            height: 56px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
        }

        .login-form { padding: 24px 20px; }
        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            color: #666;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px; /* Tamanho 16 evita zoom automático no iOS */
            background-color: #fff;
            color: #000;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(220, 20, 60, 0.1);
        }

        .form-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-error {
            margin-bottom: 24px;
            padding: 16px;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            color: #c33;
            font-size: 13px;
        }

        /* LAYOUT DASHBOARD RESPONSIVO */
        .dashboard-container { display: flex; min-height: 100vh; background: #f8f9fa; position: relative; }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #1a1a1a 0%, #2d3436 100%);
            color: white;
            padding: 24px;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.1);
            z-index: 200;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .sidebar-user { background: rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 8px; margin-bottom: 24px; }
        .sidebar-user-label { font-size: 10px; color: #999; text-transform: uppercase; margin-bottom: 4px; }
        .sidebar-user-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
        .sidebar-user-role { font-size: 11px; font-weight: 600; color: var(--primary); }

        .sidebar-menu-item {
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: none;
            color: #ccc;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-menu-item:hover, .sidebar-menu-item.active { background: var(--primary); color: white; }

        .sidebar-logout {
            width: 100%;
            padding: 14px 16px;
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        /* CONTEÚDO PRINCIPAL AJUSTÁVEL */
        .main-content { 
            margin-left: 260px; 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            width: calc(100% - 260px); 
            min-width: 0;
        }

        .header {
            position: fixed;
            top: 0;
            left: 260px;
            right: 0;
            background: white;
            border-bottom: 1px solid #eee;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 150;
            height: 70px;
            transition: left 0.3s ease;
        }

        .header-left h2 { font-size: 16px; }
        .header-left p { font-size: 11px; color: #999; }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .header-user { display: flex; align-items: center; gap: 12px; }
        .header-avatar { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }

        .content { margin-top: 70px; padding: 24px; flex: 1; overflow-y: auto; }
        .content-title { font-size: 20px; margin-bottom: 20px; text-transform: uppercase; color: var(--gray-dark); }

        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); margin-bottom: 20px; }
        .card-title { font-size: 13px; color: var(--primary); margin-bottom: 16px; text-transform: uppercase; font-weight: bold; }

        /* GRIDS COMPATÍVEIS COM TELAS PEQUENAS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); border-top: 4px solid var(--primary); }
        .stat-label { font-size: 11px; color: #999; text-transform: uppercase; margin-bottom: 6px; font-weight: bold; }
        .stat-value { font-size: 28px; font-weight: 800; color: #333; }

        .search-box { position: relative; margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 14px 16px 14px 45px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .search-box::before { content: '🔍'; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 16px; }

        /* CARDS DO ESTOQUE */
        .item-card { 
            background: white; 
            border-radius: 12px; 
            padding: 16px; 
            margin-bottom: 12px; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); 
            border-left: 6px solid #444; 
            display: flex; 
            flex-direction: column;
            gap: 14px;
        }
        
        @media(min-width: 576px) {
            .item-card { flex-direction: row; justify-content: space-between; align-items: center; }
        }

        .item-info { flex: 1; }
        .item-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .badge-address { background: #333; color: white; }
        .badge-status { color: white; }

        .item-code { font-size: 22px; font-weight: 800; margin-bottom: 2px; line-height: 1.2; }
        .item-desc { font-size: 13px; color: #555; margin-bottom: 4px; }
        
        .btn { padding: 14px 20px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; text-transform: uppercase; transition: 0.2s; text-align: center; display: inline-block; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: #64748b; color: white; }

        /* MODAL RESPONSIVO */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 16px; padding: 24px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 12px; }
        .modal-info { background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; line-height: 1.5; color: #334155; }
        .modal-input { width: 100%; padding: 12px; border: 2px solid var(--primary); border-radius: 8px; font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 16px; }
        .modal-select { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; font-size: 16px; background: #fff; }
        
        .modal-buttons { display: flex; flex-direction: column; gap: 10px; }
        @media(min-width: 400px) {
            .modal-buttons { flex-direction: row; }
            .modal-buttons button { flex: 1; }
        }

        .menu-toggle-btn { display: none; background: none; border: 1px solid #ddd; padding: 10px; border-radius: 8px; font-size: 20px; cursor: pointer; color: var(--gray-dark); align-items: center; justify-content: center; }

        select {
            cursor: pointer; appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='black' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat; background-position: right 12px center; padding-right: 30px !important;
        }

        /* --- MEDIA QUERIES PARA ADAPTAÇÃO MOBILE --- */
        @media (max-width: 992px) {
            .sidebar { transform: translateX(-270px); }
            .sidebar.active { transform: translateX(0); }
            
            /* Overlay de fundo quando o menu mobile abre */
            .sidebar.active::after {
                content: '';
                position: fixed;
                left: 260px; top: 0; width: calc(100vw - 260px); height: 100vh;
                background: rgba(0,0,0,0.4); z-index: 199;
            }

            .main-content { margin-left: 0; width: 100%; }
            .header { left: 0; padding: 12px 16px; }
            .menu-toggle-btn { display: flex; }
            .content { padding: 16px; }
            .header-user-info { display: none; } /* Oculta nome extenso no topo mobile para salvar espaço */
            
            .item-action { width: 100%; }
            .item-action .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
            authDomain: "sistema-fefo.firebaseapp.com",
            projectId: "sistema-fefo",
            storageBucket: "sistema-fefo.firebasestorage.app",
            messagingSenderId: "755801777693",
            appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        // Estados Globais
        let currentUser = null;
        let currentView = 'retirar';
        let estoqueCompleto = [];
        let wakeLock = null;
        let itemParaRetirar = null;
        let itemOrigemAbertura = null;
        let diasCalculados = 0;

        // Inicialização Segura
        function init() {
            const session = localStorage.getItem('wms_session');
            if (session) {
                try {
                    currentUser = JSON.parse(session);
                    showDashboard();
                } catch {
                    localStorage.removeItem('wms_session');
                    showLogin();
                }
            } else {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="login-container">
                    <div class="login-bg-float"></div>
                    <div class="login-bg-float"></div>
                    <div class="login-card">
                        <div class="login-header">
                            <div class="login-header-icon">📦</div>
                            <h1>WMS FLOW PRO</h1>
                            <p>Uberlândia Refrescos</p>
                        </div>
                        <div class="login-form">
                            <div id="loginError" class="login-error" style="display:none;"></div>
                            <div class="form-group">
                                <label class="form-label">Matrícula</label>
                                <input type="text" id="login-mat" class="form-input" placeholder="Digite sua matrícula" inputmode="numeric" pattern="[0-9]*">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Senha</label>
                                <input type="password" id="login-senha" class="form-input" placeholder="Digite sua senha">
                            </div>
                            <button onclick="tentarLogin()" class="form-button">ENTRAR</button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function tentarLogin() {
            const mat = document.getElementById('login-mat').value.trim();
            const senha = document.getElementById('login-senha').value.trim();
            const errorDiv = document.getElementById('loginError');

            if(!mat || !senha) {
                errorDiv.innerText = "Preencha todos os campos!";
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const email = mat + "@alb.com";
                await auth.signInWithEmailAndPassword(email, senha);
                const doc = await db.collection("usuarios_wms").doc(email).get();
                
                if (doc.exists) {
                    currentUser = doc.data();
                    currentUser.email = email;
                    localStorage.setItem('wms_session', JSON.stringify(currentUser));
                    showDashboard();
                } else {
                    errorDiv.innerText = "Usuário não localizado.";
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.innerText = "Erro ao autenticar. Verifique seus dados.";
                errorDiv.style.display = 'block';
            }
        }

        function showDashboard() {
            renderBaseLayout();
            conectarFirebase();
            ativarWakeLock();
        }

        async function ativarWakeLock() {
            try { 
                if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } 
            } catch (e) {}
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && currentUser) { ativarWakeLock(); }
        });

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // Fecha o menu lateral se clicar fora dele no mobile
        document.addEventListener('click', function(e) {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.querySelector('.menu-toggle-btn');
            if(sidebar && sidebar.classList.contains('active') && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        });

        function renderBaseLayout() {
            const isAdmin = currentUser.perfil?.toUpperCase() === 'ADMIN';
            document.getElementById('app').innerHTML = `
                <div class="dashboard-container">
                    <div class="sidebar" id="sidebar">
                        <div class="sidebar-logo">
                            <div class="sidebar-logo-icon">📦</div>
                            <div>
                                <h3 style="font-size:15px;">WMS FLOW</h3>
                                <p style="font-size:11px; opacity:0.6;">Pro Edition</p>
                            </div>
                        </div>
                        <div class="sidebar-user">
                            <div class="sidebar-user-label">Colaborador</div>
                            <div class="sidebar-user-name">${currentUser.nome}</div>
                            <div class="sidebar-user-role">${isAdmin ? '📊 ADMINISTRADOR' : '⚙️ OPERADOR'}</div>
                        </div>
                        <div class="sidebar-menu">
                            ${isAdmin ? '<button class="sidebar-menu-item" id="nav-admin" onclick="navegar(\'admin\')">📊 Dashboard Admin</button>' : ''}
                            <button class="sidebar-menu-item active" id="nav-retirar" onclick="navegar(\'retirar\')">📦 Pesquisar / Retirar</button>
                            <button class="sidebar-menu-item" id="nav-entrada_bloco" onclick="navegar(\'entrada_bloco\')">🚙 Entrada no Bloco</button>
                            <button class="sidebar-menu-item" id="nav-abertura_blocado" onclick="navegar(\'abertura_blocado\')">🔄 Abertura de Blocado</button>
                        </div>
                        <button class="sidebar-logout" onclick="handleLogout()">🚪 SAIR OPERAÇÃO</button>
                    </div>

                    <div class="main-content">
                        <div class="header">
                            <div style="display:flex; align-items:center; gap:12px;">
                                <button class="menu-toggle-btn" onclick="toggleMenu()">☰</button>
                                <div class="header-left">
                                    <h2 style="font-size:15px; line-height:1.2;">WMS FLOW PRO</h2>
                                    <p style="font-size:11px;">Uberlândia Refrescos</p>
                                </div>
                            </div>
                            <div class="header-right">
                                <div class="header-user">
                                    <div class="header-user-info" style="text-align:right;">
                                        <p style="font-size:13px; font-weight:700;">${currentUser.nome}</p>
                                        <p style="font-size:10px; color:var(--primary); font-weight:700;">${currentUser.perfil.toUpperCase()}</p>
                                    </div>
                                    <div class="header-avatar">${currentUser.nome.charAt(0).toUpperCase()}</div>
                                </div>
                            </div>
                        </div>
                        <div class="content" id="content-view"></div>
                    </div>
                </div>

                <div class="modal" id="modal-retirada">
                    <div class="modal-content">
                        <div class="modal-title" id="modal-titulo">Retirar Lote</div>
                        <div class="modal-info" id="modal-info"></div>
                        <div class="form-group">
                            <label class="form-label">Quantidade de Pallets</label>
                            <input type="number" class="modal-input" id="modal-input-qtd" placeholder="0" inputmode="numeric" pattern="[0-9]*">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Fluxo / Destino</label>
                            <select class="modal-select" id="modal-destino-mov">
                                <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                                <option value="APANHA">APANHA</option>
                                <option value="SEPARAÇÃO">SEPARAÇÃO</option>
                            </select>
                        </div>
                        <div class="modal-buttons">
                            <button class="btn btn-secondary" onclick="fecharModal()">CANCELAR</button>
                            <button class="btn btn-primary" onclick="processarRetirada()">CONFIRMAR</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function navegar(tela) {
            currentView = tela;
            document.querySelectorAll('.sidebar-menu-item').forEach(b => b.classList.remove('active'));
            const btnAtivo = document.getElementById('nav-' + tela);
            if(btnAtivo) btnAtivo.classList.add('active');
            
            const sidebar = document.getElementById('sidebar');
            if(sidebar) sidebar.classList.remove('active');

            renderizarTelaAtual();
        }

        function conectarFirebase() {
            db.collection("estoque_blocado").onSnapshot(snap => {
                estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderizarTelaAtual();
            });
        }

        function renderizarTelaAtual() {
            const container = document.getElementById('content-view');
            if(!container) return;

            if (currentView === 'admin') {
                container.innerHTML = viewAdmin();
            } else if (currentView === 'retirar') {
                container.innerHTML = viewRetirar();
                renderizarListaEstoque();
            } else if (currentView === 'entrada_bloco') {
                container.innerHTML = viewEntradaBloco();
            } else if (currentView === 'abertura_blocado') {
                container.innerHTML = viewAberturaBlocado();
            }
        }

        // Views Layout
        function viewAdmin() {
            const total = estoqueCompleto.reduce((a, b) => a + (parseInt(b.qtd) || 0), 0);
            const critico = estoqueCompleto.filter(i => i.dias > 30 && i.dias <= 60).length;
            const retido = estoqueCompleto.filter(i => i.dias <= 30).length;

            return `
                <h2 class="content-title">Dashboard Admin</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Pallets</div>
                        <div class="stat-value">${total}</div>
                    </div>
                    <div class="stat-card" style="border-top-color: var(--critico);">
                        <div class="stat-label">Lotes Críticos</div>
                        <div class="stat-value">${critico}</div>
                    </div>
                    <div class="stat-card" style="border-top-color: var(--retido);">
                        <div class="stat-label">Lotes Retidos</div>
                        <div class="stat-value">${retido}</div>
                    </div>
                </div>
                <div class="card" style="border-top: 3px solid var(--primary);">
                    <div class="card-title">Alimentação e Dados</div>
                    <div style="display:flex; flex-direction:column; gap:12px;">
                        <input type="file" id="csv-file" accept=".csv" style="display:none;" onchange="importarCSV(event)">
                        <button class="btn btn-primary" onclick="document.getElementById('csv-file').click()">ALIMENTAR NOVO ESTOQUE (CSV)</button>
                        <button class="btn" style="background:#107c41; color:white;" onclick="exportarHistoricoExcel()">SOLICITAR HISTÓRICO (EXCEL)</button>
                    </div>
                </div>
            `;
        }

        function viewRetirar() {
            return `
                <h2 class="content-title">Pesquisar e Retirar Material</h2>
                <div class="search-box">
                    <input type="text" id="search-input" inputmode="numeric" pattern="[0-9]*" placeholder="Digite o código ou endereço..." oninput="renderizarListaEstoque()">
                </div>
                <div id="lista-estoque-dinamica"></div>
            `;
        }

        function viewEntradaBloco() {
            return `
                <h2 class="content-title">Entrada no Bloco</h2>
                <div class="card">
                    <div class="form-group">
                        <label class="form-label">Origem do Fluxo</label>
                        <select id="eb-origem" class="modal-select" style="margin-bottom:0;">
                            <option value="STAGE">STAGE</option>
                            <option value="RECEBIMENTO">RECEBIMENTO</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Endereço Destino (Ex: 205-14)</label>
                        <input type="text" id="eb-ender" class="form-input" placeholder="Digite a posição">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Código Material</label>
                        <input type="text" id="eb-mat" class="form-input" inputmode="numeric" placeholder="Código..." oninput="puxarDescricao(this.value, 'eb-desc')">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Descrição</label>
                        <input type="text" id="eb-desc" class="form-input" readonly style="opacity:0.6;" placeholder="Descrição automática...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Quantidade (Pallets)</label>
                        <input type="number" id="eb-qtd" class="form-input" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Data de Vencimento</label>
                        <input type="date" id="eb-venc" class="form-input" onchange="calcularDias(this.value, 'eb-label-dias')">
                        <p id="eb-label-dias" style="color:var(--critico); font-size:12px; font-weight:bold; margin-top:5px;"></p>
                    </div>
                    <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="salvarEntradaBloco()">SALVAR ENTRADA NO BANCO</button>
                </div>
            `;
        }

        function viewAberturaBlocado() {
            return `
                <h2 class="content-title">Abertura de Blocado</h2>
                <div class="card">
                    <div class="form-group">
                        <label class="form-label">Endereço Origem (Ex: 201-14)</label>
                        <input type="text" id="ab-origem" class="form-input" placeholder="Digite a posição de origem..." onchange="carregarDadosOrigemAbertura(this.value)">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Código Material</label>
                        <input type="text" id="ab-mat" class="form-input" readonly style="opacity:0.6;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Descrição</label>
                        <input type="text" id="ab-desc" class="form-input" readonly style="opacity:0.6;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Endereço Destino (Ex: 205-20)</label>
                        <input type="text" id="ab-destino" class="form-input" placeholder="Digite a nova posição...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Quantidade a Transferir (Pallets)</label>
                        <input type="number" id="ab-qtd" class="form-input" placeholder="Saldo max disponível: 0">
                    </div>
                    <button class="btn" style="background:#e11d48; color:white; width:100%; margin-top:10px;" onclick="processarAberturaBlocado()">CONFIRMAR TRANSFERÊNCIA</button>
                </div>
            `;
        }

        window.onload = init;
    </script>
</body>
</html>
