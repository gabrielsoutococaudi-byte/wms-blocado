<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Gestão de Blocado</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0f1e; --card: #161e31; --primary: #00d2ff; --critico: #fbbf24; --retido: #f87171; --verde: #4ade80; --text: #f8fafc; --accent: #7c3aed; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        /* Menu Lateral */
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1000; padding-top: 60px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        .sidebar.active { left: 0; }
        .sidebar button { width: 100%; padding: 15px; background: transparent; border: none; color: white; text-align: left; font-size: 16px; cursor: pointer; border-bottom: 1px solid #2d3748; }
        .sidebar button:hover { background: #1e293b; }

        .header { padding: 15px 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 900; }
        .menu-btn { background: #eee; border: none; padding: 10px; border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
        .menu-btn div { width: 20px; height: 3px; background: #333; }

        .container { max-width: 900px; margin: auto; padding: 15px; }
        
        /* Formulário de Abastecer */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; opacity: 0.8; }
        .form-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; }
        
        .btn-save { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; margin-top: 10px; }
        .btn-cancel { width: 100%; padding: 10px; background: #334155; color: white; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; }

        /* Estilos de Lista */
        .search-area { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        #search-input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; }

        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #444; position: relative; }
        .badge-critico { background: var(--critico); color: #000; font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: 900; position: absolute; top: 10px; left: 75px; }
        .item-critico { border-left-color: var(--critico); }
        .item-retido { border-left-color: var(--retido); }
        
        .ender-badge { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; }
        .btn-retirar { background: var(--primary); color: #000; padding: 8px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }

        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <button onclick="mudarTela('retirar')">📦 RETIRAR (Estoque)</button>
    <button onclick="mudarTela('abastecer')">📥 ABASTECER (Entrada)</button>
    <button onclick="logout()" style="color: #f87171;">🚪 Sair</button>
</div>

<div id="login-screen">
    <div style="background: var(--card); padding: 30px; border-radius: 15px; width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
        <h2 style="text-align: center; color: var(--primary);">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula ou E-mail" style="width:100%; padding:12px; margin-bottom:10px; border-radius:5px; border:1px solid #334155; background:#0a0f1e; color:white; box-sizing: border-box;">
        <input type="password" id="login-senha" placeholder="Senha" style="width:100%; padding:12px; margin-bottom:20px; border-radius:5px; border:1px solid #334155; background:#0a0f1e; color:white; box-sizing: border-box;">
        <button onclick="tentarLogin()" style="width:100%; padding:12px; background:var(--primary); border:none; font-weight:bold; cursor:pointer;">ENTRAR</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()"><div></div><div></div><div></div></button>
        <div style="flex-grow: 1;">
            <div id="user-name" style="font-size: 14px; font-weight: 800;"></div>
            <div id="role-label" style="font-size: 9px; opacity: 0.6;"></div>
        </div>
        <div id="page-title" style="font-weight: 900; color: var(--primary);">ESTOQUE</div>
    </div>

    <div class="container">
        <div id="tela-retirar">
            <div class="search-area">
                <input type="text" id="search-input" placeholder="Buscar Material ou Endereço..." oninput="renderizarEstoque()">
            </div>
            <div id="lista-estoque"></div>
        </div>

        <div id="tela-abastecer" style="display: none;">
            <h3 style="color: var(--primary);">Abastecer Blocado</h3>
            <div class="form-group">
                <label>Endereço (Ex: A-01-01)</label>
                <input type="text" id="in-ender" placeholder="Digite o endereço">
            </div>
            <div class="form-group">
                <label>Código Material</label>
                <input type="text" id="in-mat" placeholder="Ex: 1807" oninput="buscarDescricao(this.value)">
            </div>
            <div class="form-group">
                <label>Descrição do Produto</label>
                <input type="text" id="in-desc" readonly style="opacity: 0.6;" placeholder="Preenchimento automático">
            </div>
            <div class="form-group">
                <label>Quantidade de Pallets</label>
                <input type="number" id="in-qtd" placeholder="Quantidade">
            </div>
            <div class="form-group">
                <label>Data de Vencimento</label>
                <input type="date" id="in-venc" onchange="calcularDiasVencimento(this.value)">
                <p id="label-dias" style="font-size: 11px; margin-top: 5px; color: var(--critico);"></p>
            </div>
            
            <button class="btn-save" onclick="salvarAbastecimento()">SALVAR ENTRADA</button>
            <button class="btn-cancel" onclick="mudarTela('retirar')">CANCELAR</button>
        </div>
    </div>
</div>

<script>
    // --- Configuração Firebase ---
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let estoqueCompleto = [];
    let usuarioLogado = null;
    let diasCalculados = 0;

    // --- Autenticação ---
    async function tentarLogin() {
        const loginInput = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        const email = loginInput.includes('@') ? loginInput : `${loginInput}@alb.com`;

        try {
            await auth.signInWithEmailAndPassword(email, senha);
            const doc = await db.collection("usuarios_wms").doc(email).get();
            if (doc.exists) {
                usuarioLogado = { nome: doc.data().nome, role: doc.data().perfil.toUpperCase(), email: email };
                localStorage.setItem('wms_session_v2', JSON.stringify(usuarioLogado));
                iniciarApp();
            }
        } catch (error) { alert("Acesso Negado."); }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        document.getElementById('role-label').innerText = usuarioLogado.role;
        conectarFirebase();
    }

    function conectarFirebase() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderizarEstoque();
        });
    }

    // --- Navegação e UI ---
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }

    function mudarTela(tela) {
        toggleMenu();
        document.getElementById('tela-retirar').style.display = tela === 'retirar' ? 'block' : 'none';
        document.getElementById('tela-abastecer').style.display = tela === 'abastecer' ? 'block' : 'none';
        document.getElementById('page-title').innerText = tela.toUpperCase();
    }

    // --- Lógica de Abastecimento ---
    function buscarDescricao(codigo) {
        // Busca no estoque existente para sugerir a descrição
        const item = estoqueCompleto.find(i => i.mat === codigo);
        if(item) document.getElementById('in-desc').value = item.desc;
        else document.getElementById('in-desc').value = "";
    }

    function calcularDiasVencimento(dataString) {
        if(!dataString) return;
        const hoje = new Date();
        const venc = new Date(dataString);
        const diff = Math.ceil((venc - hoje) / (1000 * 60 * 60 * 24));
        diasCalculados = diff;
        document.getElementById('label-dias').innerText = `O sistema calculou ${diff} dias para vencer`;
    }

    async function salvarAbastecimento() {
        const dados = {
            ender: document.getElementById('in-ender').value.toUpperCase(),
            mat: document.getElementById('in-mat').value,
            desc: document.getElementById('in-desc').value || "PRODUTO NOVO",
            qtd: parseInt(document.getElementById('in-qtd').value),
            dias: diasCalculados,
            valFrente: document.getElementById('in-venc').value.split('-').reverse().join('/'),
            dataContagem: new Date().toLocaleDateString()
        };

        if(!dados.ender || !dados.mat || !dados.qtd) return alert("Preencha tudo!");

        try {
            await db.collection("estoque_blocado").add(dados);
            alert("Abastecimento concluído!");
            mudarTela('retirar');
            // Limpar form
            document.querySelectorAll('#tela-abastecer input').forEach(i => i.value = "");
        } catch(e) { alert("Erro ao salvar."); }
    }

    // --- Renderização com Prioridade Crítica ---
    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';

        const filtrados = estoqueCompleto.filter(i => 
            i.mat.toLowerCase().includes(termo) || i.desc.toLowerCase().includes(termo) || i.ender.toLowerCase().includes(termo)
        );

        // REGRA: Materiais críticos primeiro (entre 31 e 60 dias) e Retidos (menos de 30)
        filtrados.sort((a, b) => a.dias - b.dias);

        filtrados.forEach(item => {
            const isCritico = item.dias <= 60;
            let corClasse = item.dias < 30 ? "item-retido" : (item.dias <= 60 ? "item-critico" : "");
            
            const card = document.createElement('div');
            card.className = `item-card ${corClasse}`;
            card.innerHTML = `
                <div>
                    <span class="ender-badge">${item.ender}</span>
                    ${isCritico ? '<span class="badge-critico">DATA CRÍTICA</span>' : ''}
                    <div style="font-weight:bold; margin-top:12px;">${item.mat}</div>
                    <div style="font-size:11px; opacity:0.8;">${item.desc}</div>
                    <div style="font-size:10px; margin-top:5px;">Vencimento: ${item.dias} dias | Ref: ${item.valFrente}</div>
                </div>
                <div style="text-align:right">
                    <div style="font-size:18px; font-weight:900;">${item.qtd} PL</div>
                    <button class="btn-retirar" onclick="retirar('${item.id}', ${item.qtd}, '${item.mat}')">RETIRAR</button>
                </div>
            `;
            lista.appendChild(card);
        });
    }

    async function retirar(id, qtdAtual, mat) {
        const n = prompt(`Retirada: ${mat}\nQuantos pallets deseja retirar? (Disponível: ${qtdAtual})`);
        if(!n || isNaN(n) || n > qtdAtual || n <= 0) return;
        const novaQtd = qtdAtual - parseInt(n);
        if(novaQtd <= 0) await db.collection("estoque_blocado").doc(id).delete();
        else await db.collection("estoque_blocado").doc(id).update({ qtd: novaQtd });
    }

    function logout() { localStorage.clear(); location.reload(); }

    window.onload = () => {
        const s = localStorage.getItem('wms_session_v2');
        if(s) { usuarioLogado = JSON.parse(s); iniciarApp(); }
    };
</script>
</body>
</html>
