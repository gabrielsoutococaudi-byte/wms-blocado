<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - ALB</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <style>
        :root { --primary: #2563eb; --dark: #1e293b; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: var(--dark); text-align: center; margin-bottom: 1.5rem; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #1d4ed8; }
        .hidden { display: none; }
        .card { border: 1px solid #eee; padding: 1rem; margin: 10px 0; border-radius: 8px; background: #fff; }
        .admin-only { border: 2px dashed #fbbf24; padding: 10px; margin-top: 20px; border-radius: 8px; background: #fffbeb; }
        #user-info { text-align: right; font-size: 12px; color: #64748b; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="tela-login">
        <h2>WMS FLOW ALB <br><small style="font-size: 0.6em; color: #666;">Controle de Acesso</small></h2>
        <input type="text" id="login-mat" placeholder="Matrícula (Ex: 7857)">
        <input type="password" id="login-senha" placeholder="Senha">
        <button onclick="tentarLogin()">ENTRAR NO SISTEMA</button>
    </div>

    <div id="app-content" class="hidden">
        <div id="user-info"></div>
        <h2>Operação de Saída</h2>
        
        <input type="text" id="filtro-material" placeholder="Buscar Material..." onkeyup="filtrarEstoque()">
        <div id="lista-estoque">Carregando estoque...</div>

        <div id="area-admin" class="admin-only hidden">
            <p style="margin: 0; font-weight: bold; color: #92400e;">PAINEL DO GESTOR</p>
            <input type="file" id="csvFile" accept=".csv" style="font-size: 12px;">
            <button onclick="importarCSV()" style="background: #92400e;">ATUALIZAR ESTOQUE (CSV)</button>
        </div>
        
        <button onclick="logout()" style="background: #ef4444; margin-top: 20px;">SAIR</button>
    </div>
</div>

<script>
    // CONFIGURAÇÃO FORNECIDA PELO GABRIEL
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4",
        measurementId: "G-5J50N5FC2Z"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let usuarioAtual = null;

    async function tentarLogin() {
        const login = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        const email = login.includes('@') ? login : `${login}@alb.com`;

        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, senha);
            const userDoc = await db.collection("usuarios").doc(email).get();

            if (userDoc.exists) {
                usuarioAtual = { email, ...userDoc.data() };
                iniciarApp();
            } else {
                alert("Usuário sem permissões no banco de dados!");
            }
        } catch (error) {
            alert("Erro: Matrícula ou senha inválidos.");
        }
    }

    function iniciarApp() {
        document.getElementById('tela-login').classList.add('hidden');
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('user-info').innerText = `Logado como: ${usuarioAtual.nome}`;

        if (usuarioAtual.perfil === 'admin') {
            document.getElementById('area-admin').classList.remove('hidden');
        }
        carregarEstoque();
    }

    async function carregarEstoque() {
        const snapshot = await db.collection("estoque").get();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = "";
        
        snapshot.forEach(doc => {
            const item = doc.data();
            lista.innerHTML += `
                <div class="card" data-nome="${item.material}">
                    <strong>Mat: ${item.material}</strong><br>
                    End: ${item.endereco} | Qtd: ${item.quantidade}<br>
                    <input type="number" id="ret-${doc.id}" placeholder="Qtd Retirada" style="width: 100px;">
                    <button onclick="retirar('${doc.id}', '${item.material}', '${item.endereco}', ${item.quantidade})">OK</button>
                </div>
            `;
        });
    }

    async function retirar(id, mat, end, qtdAtual) {
        const qtdRetirar = parseInt(document.getElementById(`ret-${id}`).value);
        if (!qtdRetirar || qtdRetirar > qtdAtual) return alert("Quantidade inválida!");

        const novaQtd = qtdAtual - qtdRetirar;
        await db.collection("estoque").doc(id).update({ quantidade: novaQtd });
        
        await db.collection("movimentacoes_wms").add({
            material: mat,
            endereco: end,
            quantidade: qtdRetirar,
            operador: usuarioAtual.nome,
            email: usuarioAtual.email,
            data: new Date().toLocaleString(),
            ts: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Retirada registrada!");
        carregarEstoque();
    }

    function filtrarEstoque() {
        const busca = document.getElementById('filtro-material').value.toLowerCase();
        const itens = document.querySelectorAll('.card');
        itens.forEach(i => {
            i.style.display = i.getAttribute('data-nome').toLowerCase().includes(busca) ? 'block' : 'none';
        });
    }

    function logout() {
        auth.signOut();
        location.reload();
    }

    async function importarCSV() {
        const fileInput = document.getElementById('csvFile');
        if (!fileInput.files[0]) return alert("Selecione o arquivo!");

        const reader = new FileReader();
        reader.onload = async (e) => {
            const linhas = e.target.result.split('\n').slice(1);
            const batch = db.batch();
            
            // Limpa estoque antigo antes (opcional)
            linhas.forEach(linha => {
                const [material, endereco, quantidade] = linha.split(',');
                if (material) {
                    const ref = db.collection("estoque").doc();
                    batch.set(ref, { material, endereco, quantidade: parseInt(quantidade) });
                }
            });
            await batch.commit();
            alert("Estoque atualizado com sucesso!");
            carregarEstoque();
        };
        reader.readAsText(fileInput.files[0]);
    }
</script>
</body>
</html>
