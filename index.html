<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Gestão de Blocado</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0f1e; --card: #161e31; --primary: #00d2ff; --critico: #fbbf24; --retido: #f87171; --verde: #4ade80; --text: #f8fafc; --accent: #7c3aed; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1000; padding-top: 60px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        .sidebar.active { left: 0; }
        .sidebar button { width: 100%; padding: 15px; background: transparent; border: none; color: white; text-align: left; font-size: 16px; cursor: pointer; border-bottom: 1px solid #2d3748; }

        .header { padding: 15px 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 900; }
        .menu-btn { background: #eee; border: none; padding: 10px; border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
        .menu-btn div { width: 20px; height: 3px; background: #333; }

        .container { max-width: 900px; margin: auto; padding: 15px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; opacity: 0.8; }
        .form-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; outline: none; }
        
        .btn-save { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; }

        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid var(--verde); position: relative; }
        .item-critico { border-left-color: var(--critico); }
        .item-retido { border-left-color: var(--retido); }
        .badge-critico { background: var(--critico); color: #000; font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: 900; margin-left: 10px; }
        
        .ender-badge { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 800; }
        .btn-retirar { background: var(--primary); color: #000; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <button onclick="mudarTela('retirar')">📦 ESTOQUE / RETIRAR</button>
    <button onclick="mudarTela('abastecer')">📥 ABASTECER POSIÇÃO</button>
    <button onclick="logout()" style="color: var(--retido);">🚪 SAIR</button>
</div>

<div id="login-screen">
    <div style="background: var(--card); padding: 30px; border-radius: 15px; width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 25px;">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula ou E-mail" style="width:100%; padding:12px; margin-bottom:10px; border-radius:5px; border:1px solid #334155; background:#0a0f1e; color:white; box-sizing: border-box;">
        <input type="password" id="login-senha" placeholder="Senha" style="width:100%; padding:12px; margin-bottom:20px; border-radius:5px; border:1px solid #334155; background:#0a0f1e; color:white; box-sizing: border-box;">
        <button onclick="tentarLogin()" style="width: 100%; padding: 12px; background: var(--primary); border: none; font-weight: bold; cursor: pointer; border-radius: 5px;">ENTRAR</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()"><div></div><div></div><div></div></button>
        <div style="flex-grow: 1;">
            <div id="user-name" style="font-size: 14px; font-weight: 800;"></div>
            <div id="page-title" style="font-size: 10px; color: var(--primary); font-weight: bold; text-transform: uppercase;">ESTOQUE</div>
        </div>
    </div>

    <div class="container">
        <div id="tela-retirar">
            <div style="background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px;">
                <input type="text" id="search-input" placeholder="Buscar material ou endereço..." oninput="renderizarEstoque()" style="width:100%; padding:12px; border-radius:6px; border:1px solid #2d3748; background:#0a0f1e; color:white; box-sizing: border-box;">
            </div>
            <div id="lista-estoque"></div>
        </div>

        <div id="tela-abastecer" style="display: none;">
            <h3 style="color: var(--primary);">Abastecer Blocado</h3>
            <div class="form-group">
                <label>Endereço (Ex: A-01-01)</label>
                <input type="text" id="in-ender" placeholder="Digite a posição">
            </div>
            <div class="form-group">
                <label>Código Material</label>
                <input type="text" id="in-mat" oninput="buscarDescricao(this.value)">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="in-desc" readonly style="background: #0f172a; opacity: 0.7;">
            </div>
            <div class="form-group">
                <label>Quantidade Pallets</label>
                <input type="number" id="in-qtd">
            </div>
            <div class="form-group">
                <label>Data de Vencimento</label>
                <input type="date" id="in-venc" onchange="calcularDias(this.value)">
                <p id="label-dias" style="color: var(--critico); font-size: 11px; margin-top: 5px;"></p>
            </div>
            <button class="btn-save" onclick="salvarAbastecimento()">SALVAR ENTRADA</button>
            <button onclick="mudarTela('retirar')" style="width: 100%; background: transparent; border: 1px solid #444; color: white; padding: 10px; margin-top: 10px; border-radius: 8px; cursor: pointer;">CANCELAR</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let estoqueCompleto = [];
    let usuarioLogado = null;
    let diasCalculados = 0;

    async function tentarLogin() {
        const loginInput = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        const email = loginInput.includes('@') ? loginInput : `${loginInput}@alb.com`;
        try {
            await auth.signInWithEmailAndPassword(email, senha);
            const doc = await db.collection("usuarios_wms").doc(email).get();
            if (doc.exists) {
                usuarioLogado = { nome: doc.data().nome, role: doc.data().perfil.toUpperCase() };
                localStorage.setItem('wms_session_v2', JSON.stringify(usuarioLogado));
                iniciarApp();
            }
        } catch (error) { alert("Erro no login."); }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        conectarFirebase();
    }

    function conectarFirebase() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderizarEstoque();
        });
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    function mudarTela(tela) {
        if(document.getElementById('sidebar').classList.contains('active')) toggleMenu();
        document.getElementById('tela-retirar').style.display = tela === 'retirar' ? 'block' : 'none';
        document.getElementById('tela-abastecer').style.display = tela === 'abastecer' ? 'block' : 'none';
        document.getElementById('page-title').innerText = tela === 'retirar' ? 'ESTOQUE' : 'ABASTECER';
    }

    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';
        let itens = estoqueCompleto.filter(i => i.mat.toLowerCase().includes(termo) || i.ender.toLowerCase().includes(termo) || i.desc.toLowerCase().includes(termo));
        
        itens.sort((a, b) => {
            const aPrior = a.dias <= 60 ? 0 : 1;
            const bPrior = b.dias <= 60 ? 0 : 1;
            if (aPrior !== bPrior) return aPrior - bPrior;
            return a.dias - b.dias;
        });

        itens.forEach(item => {
            let corClasse = item.dias < 30 ? "item-retido" : (item.dias <= 60 ? "item-critico" : "");
            const card = document.createElement('div');
            card.className = `item-card ${corClasse}`;
            card.innerHTML = `
                <div style="flex-grow: 1;">
                    <span class="ender-badge">${item.ender}</span>
                    ${item.dias <= 60 ? '<span class="badge-critico">DATA CRÍTICA</span>' : ''}
                    <div style="font-weight:900; margin-top:8px; font-size:15px;">${item.mat}</div>
                    <div style="font-size:12px; opacity:0.8;">${item.desc}</div>
                    <div style="font-size:11px; margin-top:5px;">Vence em: ${item.dias} dias (${item.valFrente})</div>
                </div>
                <div style="text-align:right;">
                    <div style="font-size:20px; font-weight:900; color:var(--primary);">${item.qtd} PL</div>
                    <button class="btn-retirar" onclick="executarRetirada('${item.id}', ${item.qtd}, '${item.mat}')">RETIRAR</button>
                </div>`;
            lista.appendChild(card);
        });
    }

    async function executarRetirada(id, qtdAtual, mat) {
        const n = prompt(`Retirada: ${mat}\nQuantos pallets? (Saldo: ${qtdAtual})`);
        if (!n) return;
        const v = parseInt(n);
        if (isNaN(v) || v <= 0 || v > qtdAtual) return alert("Inválido.");
        if (v === qtdAtual) await db.collection("estoque_blocado").doc(id).delete();
        else await db.collection("estoque_blocado").doc(id).update({ qtd: qtdAtual - v });
    }

    // --- ABASTECIMENTO COM ALTERAÇÃO DE DATA ---
    async function salvarAbastecimento() {
        const ender = document.getElementById('in-ender').value.toUpperCase().trim();
        const mat = document.getElementById('in-mat').value.trim();
        const qtd = parseInt(document.getElementById('in-qtd').value);
        const novaDataStr = document.getElementById('in-venc').value.split('-').reverse().join('/');

        if(!ender || !mat || isNaN(qtd)) return alert("Preencha os campos!");

        const itemExistente = estoqueCompleto.find(i => i.ender === ender);
        
        if(itemExistente) {
            if(itemExistente.mat === mat) {
                const atualizarData = confirm(`A posição ${ender} já tem este material.\nDeseja ATUALIZAR A DATA DE VALIDADE para ${novaDataStr}?\n(Clique em Cancelar para manter a data atual: ${itemExistente.valFrente})`);
                
                let camposUpdate = { qtd: itemExistente.qtd + qtd };
                if(atualizarData) {
                    camposUpdate.valFrente = novaDataStr;
                    camposUpdate.dias = diasCalculados;
                }

                await db.collection("estoque_blocado").doc(itemExistente.id).update(camposUpdate);
                alert("Saldo " + (atualizarData ? "e Data atualizados!" : "atualizado!"));
                finalizarAcao();
                return;
            } else {
                return alert(`BLOQUEADO: Endereço ocupado por ${itemExistente.mat}`);
            }
        }

        try {
            await db.collection("estoque_blocado").add({
                ender, mat, qtd, dias: diasCalculados,
                desc: document.getElementById('in-desc').value || "PRODUTO",
                valFrente: novaDataStr,
                dataContagem: new Date().toLocaleDateString()
            });
            alert("Sucesso!");
            finalizarAcao();
        } catch(e) { alert("Erro."); }
    }

    function buscarDescricao(cod) {
        const item = estoqueCompleto.find(i => i.mat === cod);
        document.getElementById('in-desc').value = item ? item.desc : "";
    }

    function calcularDias(data) {
        const diff = Math.ceil((new Date(data) - new Date()) / (1000 * 60 * 60 * 24));
        diasCalculados = diff;
        document.getElementById('label-dias').innerText = `Vencimento em ${diff} dias`;
    }

    function finalizarAcao() {
        mudarTela('retirar');
        document.querySelectorAll('#tela-abastecer input').forEach(i => i.value = "");
        document.getElementById('label-dias').innerText = "";
    }

    function logout() { localStorage.clear(); location.reload(); }

    window.onload = () => {
        const s = localStorage.getItem('wms_session_v2');
        if(s) { usuarioLogado = JSON.parse(s); iniciarApp(); }
    };
</script>
</body>
</html>
