<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Gestão de Blocado</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0f1e; --card: #161e31; --primary: #00d2ff; --critico: #fbbf24; --retido: #f87171; --verde: #22c55e; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 50px; }
        
        .header { padding: 15px 20px; background: var(--card); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3748; }
        .container { max-width: 1100px; margin: auto; padding: 15px; }
        
        .admin-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 12px; border-radius: 8px; border-top: 3px solid var(--primary); text-align: center; }
        .stat-box p { margin: 8px 0 0; font-size: 20px; font-weight: 800; }

        .history-section { margin-top: 40px; background: rgba(22, 30, 49, 0.7); border-radius: 12px; padding: 20px; border: 1px solid #2d3748; }
        .table-container { overflow-x: auto; border-radius: 8px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; color: #cbd5e1; min-width: 800px; }
        th { background: #0f172a; color: var(--primary); text-transform: uppercase; padding: 12px; text-align: left; border: 1px solid #2d3748; }
        td { padding: 10px; border: 1px solid #2d3748; }
        tr:hover { background: rgba(255,255,255,0.03); }

        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-export { background: var(--verde); color: white; display: flex; align-items: center; gap: 8px; }
        .btn-retirar { background: var(--primary); color: #000; }
        
        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #444; }
        .item-retido { border-left-color: var(--retido); }
        .item-critico { border-left-color: var(--critico); }
        .item-verde { border-left-color: var(--verde); }

        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); }
        .login-box { background: var(--card); padding: 35px; border-radius: 15px; width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #334155; background: #0a0f1e; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 25px;">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula ou E-mail">
        <input type="password" id="login-senha" placeholder="Senha">
        <button onclick="tentarLogin()" class="btn btn-retirar" style="width: 100%;">ENTRAR NO SISTEMA</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <div>
            <div id="user-name" style="font-weight: 800;"></div>
            <span id="role-label" style="font-size: 11px; opacity: 0.6; text-transform: uppercase;"></span>
        </div>
        <button onclick="logout()" class="btn" style="background:transparent; border:1px solid #444; color:white;">Sair</button>
    </div>

    <div class="container">
        <div id="dash-container" class="admin-dashboard" style="display: none;">
            <div class="stat-box"><h5>TOTAL PALLETS</h5><p id="st-total">0</p></div>
            <div class="stat-box" style="border-color: var(--critico);"><h5>CRÍTICOS</h5><p id="st-critico">0</p></div>
            <div class="stat-box" style="border-color: var(--retido);"><h5>RETIDOS</h5><p id="st-retido">0</p></div>
        </div>

        <input type="text" id="search-input" placeholder="🔍 Buscar Material ou Endereço..." oninput="renderizarEstoque()">
        <div id="lista-estoque"></div>

        <div id="admin-only" style="display: none;">
            <div class="history-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0; color: var(--primary); font-size: 16px;">HISTÓRICO DE MOVIMENTAÇÕES</h3>
                    <button onclick="exportarExcel()" class="btn btn-export">📄 EXPORTAR EXCEL</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Endereço</th>
                                <th>Material</th>
                                <th>Validade</th>
                                <th>Qtd</th>
                                <th>Operador (Login)</th>
                                <th>Data/Hora</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-historico"></tbody>
                    </table>
                </div>
                <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="importarCSV(event)">
                <button onclick="document.getElementById('csv-file').click()" class="btn" style="background: var(--verde); color: white; width: 100%; margin-top: 25px;">+ ALIMENTAR NOVO ESTOQUE (CSV)</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuração do seu Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    let estoqueCompleto = [];
    let historicoCompleto = []; // Esta variável alimentará o Excel
    let usuarioLogado = null;

    async function tentarLogin() {
        const input = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        const email = input.includes('@') ? input : `${input}@alb.com`;

        try {
            await auth.signInWithEmailAndPassword(email, senha);
            const doc = await db.collection("usuarios_wms").doc(email).get();
            if (doc.exists) {
                usuarioLogado = { nome: doc.data().nome, role: doc.data().perfil.toUpperCase(), email: email };
                localStorage.setItem('wms_session_v5', JSON.stringify(usuarioLogado));
                iniciarApp();
            }
        } catch (e) { alert("Acesso Negado!"); }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        document.getElementById('role-label').innerText = usuarioLogado.role;

        if (usuarioLogado.role === "ADMIN") {
            document.getElementById('dash-container').style.display = 'grid';
            document.getElementById('admin-only').style.display = 'block';
            ouvirHistorico();
        }
        conectarEstoque();
    }

    function conectarEstoque() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            atualizarDashboard();
            renderizarEstoque();
        });
    }

    function atualizarDashboard() {
        if(usuarioLogado.role !== "ADMIN") return;
        document.getElementById('st-total').innerText = estoqueCompleto.reduce((a, b) => a + (parseInt(b.qtd) || 0), 0);
        document.getElementById('st-critico').innerText = estoqueCompleto.filter(i => i.dias >= 31 && i.dias <= 60).length;
        document.getElementById('st-retido').innerText = estoqueCompleto.filter(i => i.dias < 30).length;
    }

    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';

        estoqueCompleto.filter(i => 
            i.mat.toLowerCase().includes(termo) || i.desc.toLowerCase().includes(termo) || i.ender.toLowerCase().includes(termo)
        ).sort((a, b) => a.dias - b.dias).forEach(item => {
            let cor = item.dias < 30 ? "item-retido" : (item.dias <= 60 ? "item-critico" : "item-verde");
            lista.innerHTML += `
                <div class="item-card ${cor}">
                    <div>
                        <span style="background:var(--primary); color:#000; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:800;">${item.ender}</span>
                        <div style="font-weight:bold; margin-top:5px;">${item.mat} - ${item.desc}</div>
                        <div style="font-size:11px; opacity:0.7;">Venc: ${item.dias} dias | Val: ${item.valFrente}</div>
                    </div>
                    <div style="text-align:right">
                        <div style="font-size:18px; font-weight:800;">${item.qtd} PL</div>
                        <button class="btn btn-retirar" onclick="retirar('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender}')">RETIRAR</button>
                    </div>
                </div>`;
        });
    }

    async function retirar(id, qtdAtual, mat, ender) {
        const item = estoqueCompleto.find(i => i.id === id);
        const val = item ? item.valFrente : "---";
        const n = prompt(`Material: ${mat}\nQuantos pallets retirar?`);
        if(!n || isNaN(n) || n > qtdAtual || n <= 0) return;

        try {
            const novaQtd = qtdAtual - parseInt(n);
            if(novaQtd <= 0) await db.collection("estoque_blocado").doc(id).delete();
            else await db.collection("estoque_blocado").doc(id).update({ qtd: novaQtd });

            await db.collection("movimentacoes_wms").add({
                endereco: ender,
                material: mat,
                validade: val,
                quantidade: parseInt(n),
                operador: usuarioLogado.nome,
                login: usuarioLogado.email.split('@')[0],
                data: new Date().toLocaleDateString('pt-BR'),
                hora: new Date().toLocaleTimeString('pt-BR'),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Sucesso!");
        } catch(e) { alert("Erro na operação."); }
    }

    function ouvirHistorico() {
        db.collection("movimentacoes_wms").orderBy("timestamp", "desc").limit(150).onSnapshot(snap => {
            historicoCompleto = snap.docs.map(doc => doc.data()); // Preenche o array global
            const corpo = document.getElementById('corpo-historico');
            corpo.innerHTML = historicoCompleto.map(m => `
                <tr>
                    <td style="font-weight:bold;">${m.endereco || '---'}</td>
                    <td>${m.material || '---'}</td>
                    <td style="color:var(--primary); font-weight:600;">${m.validade || '---'}</td>
                    <td style="color:var(--retido); font-weight:800;">-${m.quantidade || 0} PL</td>
                    <td>${m.operador || 'Sistema'} (${m.login || '---'})</td>
                    <td>${m.data || ''} às ${m.hora || ''}</td>
                </tr>
            `).join('');
        });
    }

    function exportarExcel() {
        if (!historicoCompleto || historicoCompleto.length === 0) {
            alert("Aguarde o carregamento dos dados...");
            return;
        }

        const dadosParaExcel = historicoCompleto.map(m => ({
            "ENDEREÇO": m.endereco || "---",
            "MATERIAL": m.material || "---",
            "VALIDADE": m.validade || "---",
            "QTD RETIRADA": m.quantidade || 0,
            "OPERADOR": m.operador || "---",
            "LOGIN": m.login || "---",
            "DATA": m.data || "---",
            "HORA": m.hora || "---"
        }));

        const worksheet = XLSX.utils.json_to_sheet(dadosParaExcel);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Log_Movimentacoes");
        XLSX.writeFile(workbook, `WMS_Historico_${new Date().toLocaleDateString().replace(/\//g, '-')}.xlsx`);
    }

    function importarCSV(event) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const linhas = e.target.result.split("\n").slice(1);
            const batch = db.batch();
            linhas.forEach(l => {
                const c = l.split(";");
                if(c.length >= 8) {
                    const id = c[0].trim() + "_" + c[1].trim();
                    batch.set(db.collection("estoque_blocado").doc(id), {
                        ender: c[0].trim(), mat: c[1].trim(), desc: c[2].trim(),
                        valFrente: c[3].trim(), valFundos: c[4].trim(),
                        qtd: parseInt(c[5]) || 0, dataContagem: c[6].trim(),
                        dias: parseInt(c[7]) || 0
                    });
                }
            });
            await batch.commit();
            alert("Estoque Atualizado!");
            location.reload();
        };
        reader.readAsText(event.target.files[0], 'ISO-8859-1');
    }

    function logout() { auth.signOut(); localStorage.removeItem('wms_session_v5'); location.reload(); }

    window.onload = () => {
        const s = localStorage.getItem('wms_session_v5');
        if(s) { usuarioLogado = JSON.parse(s); iniciarApp(); }
    };
</script>
</body>
</html>
