<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Full Dashboard</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0a1221; --card: #161e31; --primary: #00d2ff; 
            --critico: #fbbf24; --retido: #f87171; --verde: #4ade80; --text: #f8fafc; 
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }

        /* Sidebar */
        .sidebar {
            height: 100%; width: 0; position: fixed; z-index: 1001; top: 0; left: 0;
            background-color: var(--card); overflow-x: hidden; transition: 0.5s;
            padding-top: 60px; border-right: 1px solid #2d3748; box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        .sidebar-content { padding: 20px; }
        .sidebar .closebtn { position: absolute; top: 10px; right: 20px; font-size: 30px; color: var(--text); cursor: pointer; text-decoration: none; }

        /* Layout */
        .header { padding: 15px 20px; background: var(--card); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 100; }
        #main { transition: margin-left .5s; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }

        /* Gráficos Grid */
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .chart-box { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #2d3748; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .chart-header h3 { font-size: 12px; color: var(--primary); margin: 0; text-transform: uppercase; }

        /* Cards e Botões */
        .stat-box { background: var(--card); padding: 15px; border-radius: 10px; border-top: 4px solid var(--primary); text-align: center; }
        .stat-box p { font-size: 24px; font-weight: 900; margin: 5px 0; }
        
        .btn { padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px; }
        .btn-retirar { background: var(--primary); color: #000; width: auto; }
        .btn-abastecer { background: #8b5cf6; color: white; margin-bottom: 15px; } /* Cor roxa para diferenciar */
        
        /* Modal de Abastecimento */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: var(--card); margin: 10% auto; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; border: 1px solid var(--primary); }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; background: #0a0f1e; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box;}

        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #444; }
        
        /* Login */
        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); }
        .login-box { background: var(--card); padding: 30px; border-radius: 15px; width: 320px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; color: var(--primary);">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula" style="width:100%; padding:12px; margin:10px 0; background:#0a0f1e; color:white; border:1px solid #334155; border-radius:5px;">
        <input type="password" id="login-senha" placeholder="Senha" style="width:100%; padding:12px; margin-bottom:20px; background:#0a0f1e; color:white; border:1px solid #334155; border-radius:5px;">
        <button onclick="tentarLogin()" class="btn btn-retirar" style="width:100%">ENTRAR</button>
    </div>
</div>

<div id="mySidebar" class="sidebar">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <div class="sidebar-content">
        <h3 style="color: var(--primary); font-size: 14px;">ADMINISTRAÇÃO</h3>
        <button onclick="document.getElementById('csv-file').click()" class="btn" style="background:var(--verde); color:000">IMPORTAR CSV</button>
        <input type="file" id="csv-file" accept=".csv" style="display:none" onchange="importarCSV(event)">
        <button onclick="exportarHistoricoExcel()" class="btn" style="background:#107c41; color:white">HISTÓRICO EXCEL</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <div style="display: flex; align-items: center;">
            <button id="btn-admin" class="btn-retirar" style="display:none; background:none; color:white; font-size:20px; margin-right:15px;" onclick="openNav()">&#9776;</button>
            <div>
                <b id="user-name"></b><br>
                <small id="role-label" style="opacity:0.6"></small>
            </div>
        </div>
        <button onclick="logout()" style="background:none; border:1px solid #444; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;">Sair</button>
    </div>

    <div id="main">
        <div class="container">
            
            <button class="btn btn-abastecer" onclick="abrirModalAbastecer()">+ ABASTECER BLOCADO (NOVA ENTRADA)</button>

            <div id="admin-area" style="display: none;">
                <div class="charts-grid">
                    <div class="chart-box">
                        <div class="chart-header"><h3>Top 10 Movimentações</h3></div>
                        <canvas id="chartTop10"></canvas>
                    </div>
                    <div class="chart-box">
                        <div class="chart-header"><h3>Status de Validade (Aging)</h3></div>
                        <canvas id="chartAging"></canvas>
                    </div>
                    <div class="chart-box">
                        <div class="chart-header"><h3>Ocupação por Operador</h3></div>
                        <canvas id="chartOperador"></canvas>
                    </div>
                </div>
            </div>

            <input type="text" id="search-input" placeholder="Pesquisar material ou endereço..." oninput="renderizarEstoque()" style="width:100%; padding:15px; background:var(--card); border:1px solid #2d3748; color:white; border-radius:10px; margin-bottom:20px; box-sizing: border-box;">

            <div id="lista-estoque"></div>
        </div>
    </div>
</div>

<div id="modalAbastecer" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--primary); margin-top:0;">Abastecer Blocado</h3>
        <input type="text" id="in-ender" placeholder="Endereço (Ex: A-01-01)">
        <input type="text" id="in-mat" placeholder="Código Material">
        <input type="text" id="in-desc" placeholder="Descrição do Produto">
        <input type="number" id="in-qtd" placeholder="Quantidade de Pallets">
        <input type="number" id="in-dias" placeholder="Dias para Vencimento">
        <button class="btn btn-abastecer" onclick="salvarAbastecimento()">SALVAR ENTRADA</button>
        <button class="btn" style="background:#444; color:white" onclick="fecharModalAbastecer()">CANCELAR</button>
    </div>
</div>

<script>
    // Firebase Config (O mesmo do seu código anterior)
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let estoqueCompleto = [];
    let userLogado = null;
    let charts = {};

    // --- SIDEBAR ---
    function openNav() { document.getElementById("mySidebar").style.width = "280px"; }
    function closeNav() { document.getElementById("mySidebar").style.width = "0"; }

    // --- MODAL ABASTECER ---
    function abrirModalAbastecer() { document.getElementById('modalAbastecer').style.display = 'block'; }
    function fecharModalAbastecer() { document.getElementById('modalAbastecer').style.display = 'none'; }

    async function salvarAbastecimento() {
        const doc = {
            ender: document.getElementById('in-ender').value.toUpperCase(),
            mat: document.getElementById('in-mat').value,
            desc: document.getElementById('in-desc').value.toUpperCase(),
            qtd: parseInt(document.getElementById('in-qtd').value),
            dias: parseInt(document.getElementById('in-dias').value),
            valFrente: "Entrada Manual"
        };

        if(!doc.ender || !doc.mat || !doc.qtd) return alert("Preencha os campos obrigatórios!");

        try {
            const id = doc.ender + "_" + doc.mat;
            await db.collection("estoque_blocado").doc(id).set(doc);
            
            // Registra no histórico
            await db.collection("movimentacoes_wms").add({
                endereco: doc.ender, material: doc.mat,
                quantidade: "+" + doc.qtd + " PL", operador: userLogado.nome,
                data: new Date().toLocaleDateString('pt-BR'),
                timestamp: new Date()
            });

            alert("Abastecimento concluído!");
            fecharModalAbastecer();
        } catch(e) { alert("Erro ao salvar."); }
    }

    // --- LOGIN E APP ---
    async function tentarLogin() {
        const login = document.getElementById('login-mat').value;
        const senha = document.getElementById('login-senha').value;
        const email = login.includes('@') ? login : login + "@alb.com";
        
        try {
            await auth.signInWithEmailAndPassword(email, senha);
            const snap = await db.collection("usuarios_wms").doc(email).get();
            userLogado = { nome: snap.data().nome, role: snap.data().perfil.toUpperCase() };
            iniciarApp();
        } catch(e) { alert("Erro no login."); }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = userLogado.nome;
        document.getElementById('role-label').innerText = userLogado.role;

        if(userLogado.role === "ADMIN") {
            document.getElementById('admin-area').style.display = 'block';
            document.getElementById('btn-admin').style.display = 'block';
        }

        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(d => ({id: d.id, ...d.data()}));
            if(userLogado.role === "ADMIN") atualizarGraficos();
            renderizarEstoque();
        });
    }

    // --- GRÁFICOS (PESQUISA APROFUNDADA) ---
    async function atualizarGraficos() {
        // 1. Gráfico de Aging (Validade)
        const aging = { boa: 0, critica: 0, retida: 0 };
        estoqueCompleto.forEach(i => {
            if(i.dias < 30) aging.retida++;
            else if(i.dias <= 60) aging.critica++;
            else aging.boa++;
        });
        renderPieChart('chartAging', ['Data Boa', 'Crítico', 'Retido'], [aging.boa, aging.critica, aging.retida], ['#4ade80', '#fbbf24', '#f87171']);

        // 2. Gráfico de Operadores (Produtividade)
        const movSnap = await db.collection("movimentacoes_wms").orderBy("timestamp", "desc").limit(100).get();
        const ops = {};
        movSnap.forEach(d => {
            const op = d.data().operador;
            ops[op] = (ops[op] || 0) + 1;
        });
        renderBarChart('chartOperador', Object.keys(ops), Object.values(ops), '#8b5cf6');

        // 3. Top 10 Movimentados
        const mats = {};
        movSnap.forEach(d => {
            const m = d.data().material;
            mats[m] = (mats[m] || 0) + 1;
        });
        const top10 = Object.entries(mats).sort((a,b)=>b[1]-a[1]).slice(0,10);
        renderBarChart('chartTop10', top10.map(i=>i[0]), top10.map(i=>i[1]), '#00d2ff');
    }

    function renderPieChart(id, labels, data, colors) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: 'doughnut',
            data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 0 }] },
            options: { plugins: { legend: { position: 'bottom', labels: { color: '#fff', font: { size: 10 } } } } }
        });
    }

    function renderBarChart(id, labels, data, color) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: 'bar',
            data: { labels: labels, datasets: [{ data: data, backgroundColor: color, borderRadius: 5 }] },
            options: { 
                scales: { 
                    y: { ticks: { color: '#fff' }, grid: { color: '#2d3748' } },
                    x: { ticks: { color: '#fff' }, grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    // --- LISTAGEM ---
    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';
        if(!termo) return;

        estoqueCompleto.filter(i => i.mat.includes(termo) || i.ender.includes(termo) || i.desc.toLowerCase().includes(termo))
        .forEach(item => {
            const cor = item.dias < 30 ? 'var(--retido)' : (item.dias <= 60 ? 'var(--critico)' : 'var(--verde)');
            const div = document.createElement('div');
            div.className = 'item-card';
            div.style.borderLeftColor = cor;
            div.innerHTML = `
                <div>
                    <b style="color:var(--primary)">${item.ender}</b> - ${item.mat}<br>
                    <small>${item.desc}</small><br>
                    <small>Vence em: <b>${item.dias} dias</b></small>
                </div>
                <div style="text-align:right">
                    <div style="font-size:20px; font-weight:900">${item.qtd} PL</div>
                    <button class="btn-retirar" style="padding:5px 10px; border:none; border-radius:4px; cursor:pointer;" onclick="retirar('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender}')">RETIRAR</button>
                </div>
            `;
            lista.appendChild(div);
        });
    }

    async function retirar(id, qtd, mat, ender) {
        const n = prompt(`Quantos pallets retirar de ${mat}? (Máx: ${qtd})`);
        if(!n || n > qtd) return;
        const novaQtd = qtd - n;
        if(novaQtd <= 0) await db.collection("estoque_blocado").doc(id).delete();
        else await db.collection("estoque_blocado").doc(id).update({qtd: novaQtd});
        
        await db.collection("movimentacoes_wms").add({
            endereco: ender, material: mat, quantidade: "-" + n + " PL", operador: userLogado.nome,
            data: new Date().toLocaleDateString('pt-BR'), timestamp: new Date()
        });
    }

    function logout() { auth.signOut(); location.reload(); }
</script>
</body>
</html>
