<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Admin</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #0a0f1e; --card: #161e31; --primary: #00d2ff; --critico: #fbbf24; --retido: #f87171; --verde: #4ade80; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1000; padding-top: 60px; border-right: 1px solid #2d3748; box-shadow: 10px 0 20px rgba(0,0,0,0.5); }
        .sidebar.active { left: 0; }
        .sidebar button { width: 100%; padding: 15px; background: transparent; border: none; color: white; text-align: left; cursor: pointer; border-bottom: 1px solid #2d3748; font-weight: bold; font-size: 14px; }

        .header { padding: 15px 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 900; }
        .menu-btn { background: none; border: 1px solid #444; padding: 8px; border-radius: 5px; cursor: pointer; color: white; font-size: 20px; width: 40px; height: 40px; }
        .container { max-width: 1100px; margin: auto; padding: 15px; }

        /* Dashboard Grid */
        .admin-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 8px; border-top: 3px solid var(--primary); text-align: center; }
        .stat-box h5 { margin: 0; font-size: 10px; opacity: 0.6; text-transform: uppercase; }
        .stat-box p { margin: 8px 0 0; font-size: 24px; font-weight: 900; }

        /* Charts Grid */
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .chart-container { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #2d3748; min-height: 300px; }
        .chart-title { font-size: 12px; color: var(--primary); font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }

        .search-area { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; }
        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #444; }
        
        .badge-ender { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        .btn-retirar { background: var(--primary); color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: 900; cursor: pointer; }
        .btn-admin { background: var(--verde); color: #000; padding: 15px; width: 100%; border-radius: 8px; font-weight: 900; margin-top: 10px; border: none; cursor: pointer; }
        
        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); }
        .login-box { background: var(--card); padding: 30px; border-radius: 15px; width: 320px; }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <button id="btn-nav-admin" onclick="navegar('admin')" style="display: none;">📊 DASHBOARD ADMIN</button>
    <button onclick="navegar('retirar')">📦 RETIRAR / PESQUISAR</button>
    <button onclick="navegar('abastecer')">📥 ABASTECER BLOCO</button>
    <button onclick="logout()" style="color: var(--retido); margin-top: 20px;">🚪 DESLOGAR</button>
</div>

<div id="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 25px;">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula" style="margin-bottom:10px;">
        <input type="password" id="login-senha" placeholder="Senha" style="margin-bottom:20px;">
        <button onclick="tentarLogin()" class="btn-retirar" style="width: 100%;">ENTRAR</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div style="flex-grow: 1;">
            <div id="user-name" style="font-weight: 800; font-size: 16px;"></div>
            <div id="role-label" style="font-size: 10px; color: var(--primary); font-weight: bold;"></div>
        </div>
    </div>

    <div class="container">
        <div id="view-admin" style="display: none;">
            <div class="admin-dashboard">
                <div class="stat-box"><h5>TOTAL PALLETS</h5><p id="st-total">0</p></div>
                <div class="stat-box" style="border-color: var(--critico);"><h5>CRÍTICOS</h5><p id="st-critico">0</p></div>
                <div class="stat-box" style="border-color: var(--retido);"><h5>RETIDOS</h5><p id="st-retido">0</p></div>
                <div class="stat-box" style="border-color: var(--verde);"><h5>RUA MAIS ATIVA</h5><p id="st-rua">-</p></div>
            </div>

            <div class="charts-grid">
                <div class="chart-container"><div class="chart-title">TOP 10 OPERADORES</div><canvas id="chartOperadores"></canvas></div>
                <div class="chart-container"><div class="chart-title">TOP 10 MATERIAIS</div><canvas id="chartMateriais"></canvas></div>
                <div class="chart-container" style="border-color: var(--retido);"><div class="chart-title">⚠️ FURO DE FEFO (RETIRADA INCORRETA)</div><canvas id="chartFuroFefo"></canvas></div>
                <div class="chart-container"><div class="chart-title">EVOLUÇÃO SAÍDA CRÍTICOS</div><canvas id="chartEvolucaoCriticos"></canvas></div>
            </div>

            <div id="admin-tools-section" style="background: var(--card); padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #2d3748;">
                <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="importarCSV(event)">
                <button class="btn-admin" onclick="document.getElementById('csv-file').click()">ALIMENTAR NOVO ESTOQUE (CSV)</button>
                <button class="btn-admin btn-excel" style="background: #107c41; color: white;" onclick="exportarHistoricoExcel()">SOLICITAR HISTÓRICO (EXCEL)</button>
            </div>
        </div>

        <div id="view-retirar">
            <div class="search-area"><input type="text" id="search-input" placeholder="Pesquisar material ou endereço..." oninput="renderizarEstoque()"></div>
            <div id="lista-estoque"></div>
        </div>

        <div id="view-abastecer" style="display: none;">
            <div style="background: var(--card); padding: 25px; border-radius: 12px;">
                <h3 style="color: var(--primary); margin-top: 0;">ABASTECER BLOCO</h3>
                <input type="text" id="in-ender" placeholder="Endereço (Ex: 201-01-01)" style="margin-bottom:10px;">
                <input type="text" id="in-mat" placeholder="Código Material" oninput="puxarDescricao(this.value)" style="margin-bottom:10px;">
                <input type="text" id="in-desc" readonly style="opacity: 0.5; margin-bottom:10px;" placeholder="Descrição...">
                <input type="number" id="in-qtd" placeholder="Quantidade PL" style="margin-bottom:10px;">
                <input type="date" id="in-venc" onchange="calcularDias(this.value)" style="margin-bottom:10px;">
                <p id="label-dias" style="color: var(--critico); font-size: 12px; font-weight: bold;"></p>
                <button class="btn-admin" style="background: #7c3aed; color: white;" onclick="salvarAbastecimentoManual()">SALVAR ENTRADA</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIG FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let estoqueCompleto = [];
    let movimentacoes = [];
    let usuarioLogado = null;
    let charts = {};

    // --- LOGIN E NAVEGAÇÃO ---
    async function tentarLogin() {
        const mat = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        try {
            await auth.signInWithEmailAndPassword(mat + "@alb.com", senha);
            const doc = await db.collection("usuarios_wms").doc(mat + "@alb.com").get();
            if (doc.exists) {
                usuarioLogado = doc.data();
                usuarioLogado.email = mat + "@alb.com";
                localStorage.setItem('wms_session', JSON.stringify(usuarioLogado));
                iniciarApp();
            }
        } catch (e) { alert("Erro de Login."); }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        const isAdmin = usuarioLogado.perfil.toUpperCase() === "ADMIN";
        document.getElementById('role-label').innerText = isAdmin ? "PERFIL: ADMINISTRADOR" : "PERFIL: OPERADOR";
        document.getElementById('btn-nav-admin').style.display = isAdmin ? 'block' : 'none';
        
        conectarFirebase();
        navegar(isAdmin ? 'admin' : 'retirar');
    }

    function navegar(tela) {
        ['admin', 'retirar', 'abastecer'].forEach(t => document.getElementById('view-' + t).style.display = 'none');
        document.getElementById('view-' + tela).style.display = 'block';
        document.getElementById('sidebar').classList.remove('active');
        if(tela === 'admin') processarDadosGraficos();
    }

    // --- DADOS ---
    function conectarFirebase() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            atualizarEstatisticas();
        });
        db.collection("movimentacoes_wms").onSnapshot(snap => {
            movimentacoes = snap.docs.map(doc => doc.data());
            if(usuarioLogado.perfil === "ADMIN") processarDadosGraficos();
        });
    }

    function atualizarEstatisticas() {
        document.getElementById('st-total').innerText = estoqueCompleto.reduce((a, b) => a + (parseInt(b.qtd) || 0), 0);
        document.getElementById('st-critico').innerText = estoqueCompleto.filter(i => i.dias > 30 && i.dias <= 60).length;
        document.getElementById('st-retido').innerText = estoqueCompleto.filter(i => i.dias <= 30).length;
    }

    // --- LÓGICA DOS NOVOS GRÁFICOS ---
    function processarDadosGraficos() {
        const counts = { ops: {}, mats: {}, ruas: {}, furos: 0, criticosEvol: {} };
        const ruasAlvo = ["201", "203", "204", "205", "303"];

        movimentacoes.forEach(m => {
            // Operadores e Materiais
            counts.ops[m.login] = (counts.ops[m.login] || 0) + 1;
            counts.mats[m.material] = (counts.mats[m.material] || 0) + 1;

            // Ruas Específicas
            const rua = m.endereco.split('-')[0];
            if(ruasAlvo.includes(rua)) counts.ruas[rua] = (counts.ruas[rua] || 0) + 1;

            // Furo de FEFO (Lógica: Se a observação contiver 'furo' ou se a retirada foi de data maior tendo menor no estoque)
            if(m.quantidade.includes("Furo") || m.furoFefo) counts.furos++;

            // Evolução Críticos (materiais que saíram com dias <= 60)
            const dataRet = m.data; // Formato DD/MM/AAAA
            if(m.quantidade.includes("-")) {
                counts.criticosEvol[dataRet] = (counts.criticosEvol[dataRet] || 0) + 1;
            }
        });

        // Atualizar Rua mais movimentada
        const melhorRua = Object.entries(counts.ruas).sort((a,b) => b[1]-a[1])[0];
        document.getElementById('st-rua').innerText = melhorRua ? `${melhorRua[0]} (${melhorRua[1]})` : "-";

        renderChart("chartOperadores", "bar", counts.ops, 10);
        renderChart("chartMateriais", "bar", counts.mats, 10);
        renderChart("chartFuroFefo", "doughnut", { "Furos": counts.furos, "Corretos": movimentacoes.length - counts.furos });
        renderChart("chartEvolucaoCriticos", "line", counts.criticosEvol);
    }

    function renderChart(id, type, dataObj, limit = null) {
        const ctx = document.getElementById(id).getContext('2d');
        let labels = Object.keys(dataObj);
        let values = Object.values(dataObj);

        if(limit) {
            const sorted = Object.entries(dataObj).sort((a,b) => b[1]-a[1]).slice(0, limit);
            labels = sorted.map(i => i[0].split('@')[0]);
            values = sorted.map(i => i[1]);
        }

        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(ctx, {
            type: type,
            data: {
                labels: labels,
                datasets: [{
                    label: 'Movimentações',
                    data: values,
                    backgroundColor: ['#00d2ff', '#4ade80', '#fbbf24', '#f87171', '#7c3aed'],
                    borderColor: '#161e31',
                    borderWidth: 1
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                scales: type === 'bar' ? { y: { beginAtZero: true } } : {},
                plugins: { legend: { labels: { color: '#fff', font: { size: 10 } } } }
            }
        });
    }

    // --- FUNÇÕES DE ESTOQUE ---
    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase().trim();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';
        if (termo.length < 2) return;

        let filtrados = estoqueCompleto.filter(i => i.mat.toLowerCase().includes(termo) || i.ender.toLowerCase().includes(termo));
        filtrados.sort((a, b) => a.dias - b.dias).forEach(item => {
            const card = document.createElement('div');
            card.className = `item-card`;
            card.style.borderLeftColor = item.dias <= 60 ? 'var(--critico)' : 'var(--verde)';
            card.innerHTML = `
                <div>
                    <span class="badge-ender">${item.ender}</span>
                    <div style="font-weight:900; font-size:18px; margin-top:5px;">${item.mat}</div>
                    <div style="font-size:11px; opacity:0.7;">${item.desc}</div>
                    <div style="font-size:12px; margin-top:5px;">Vence em: <b>${item.dias} dias</b></div>
                </div>
                <div style="text-align:right">
                    <div style="font-size:22px; font-weight:900;">${item.qtd} PL</div>
                    <button class="btn-retirar" onclick="retirarMaterial('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender}', '${item.valFrente}', ${item.dias})">RETIRAR</button>
                </div>`;
            lista.appendChild(card);
        });
    }

    async function retirarMaterial(id, qtdAtual, mat, ender, validade, dias) {
        // Validação básica de FEFO
        const menorDataEstoque = Math.min(...estoqueCompleto.filter(i => i.mat === mat).map(i => i.dias));
        let furo = dias > menorDataEstoque;

        const n = prompt(`Retirar de ${mat}. Quantos pallets? (Saldo: ${qtdAtual}) ${furo ? '\n⚠️ ATENÇÃO: EXISTE LOTE MAIS VELHO!' : ''}`);
        if(!n || isNaN(n)) return;

        const v = parseInt(n);
        if(v > 0 && v <= qtdAtual) {
            if(v === qtdAtual) await db.collection("estoque_blocado").doc(id).delete();
            else await db.collection("estoque_blocado").doc(id).update({ qtd: qtdAtual - v });
            
            const agora = new Date();
            await db.collection("movimentacoes_wms").add({
                endereco: ender, material: mat, validade: validade,
                quantidade: `-${v} PL ${furo ? '(FURO DE FEFO)' : ''}`,
                login: usuarioLogado.email, data: agora.toLocaleDateString('pt-BR'),
                timestamp: agora, furoFefo: furo
            });
            alert(furo ? "⚠️ RETIRADA REGISTRADA COMO FURO DE FEFO!" : "Concluído!");
        }
    }

    // --- AUXILIARES ---
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    function logout() { auth.signOut(); localStorage.removeItem('wms_session'); location.reload(); }
    window.onload = () => {
        const s = localStorage.getItem('wms_session');
        if(s) { usuarioLogado = JSON.parse(s); iniciarApp(); }
    };
</script>
</body>
</html>
