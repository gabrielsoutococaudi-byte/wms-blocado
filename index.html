<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WMS FLOW PRO">
    
    <title>WMS FLOW PRO - Sistema Integrado</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0a0f1e; 
            --card: #161e31; 
            --primary: #00d2ff; 
            --critico: #fbbf24; 
            --retido: #f87171; 
            --verde: #4ade80; 
            --text: #f8fafc; 
            --purple: #7c3aed;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1000; padding-top: 60px; border-right: 1px solid #2d3748; box-shadow: 10px 0 20px rgba(0,0,0,0.5); }
        .sidebar.active { left: 0; }
        .sidebar button { width: 100%; padding: 15px; background: transparent; border: none; color: white; text-align: left; cursor: pointer; border-bottom: 1px solid #2d3748; font-weight: bold; font-size: 14px; }
        .sidebar button:hover { background: rgba(255,255,255,0.05); }

        .header { padding: 15px 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 900; }
        .menu-btn { background: none; border: 1px solid #444; padding: 8px; border-radius: 5px; cursor: pointer; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        .admin-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 8px; border-top: 3px solid var(--primary); text-align: center; }
        .stat-box h5 { margin: 0; font-size: 10px; opacity: 0.6; text-transform: uppercase; }
        .stat-box p { margin: 8px 0 0; font-size: 24px; font-weight: 900; }

        .search-area { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; outline: none; margin-bottom: 10px;}
        
        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #444; }
        .badge-ender { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        .badge-status { color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-left: 8px; text-transform: uppercase; }

        .btn-retirar { background: var(--primary); color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: 900; cursor: pointer; }
        .btn-admin { background: var(--verde); color: #000; padding: 15px; width: 100%; border-radius: 8px; font-weight: 900; margin-top: 10px; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-excel { background: #107c41; color: white; }

        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); }
        .login-box { background: var(--card); padding: 30px; border-radius: 15px; width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        #modal-retirada { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center; backdrop-filter: blur(5px); }
        .modal-content { background:var(--card); padding:25px; border-radius:15px; width:90%; max-width:400px; border:1px solid #2d3748; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <button id="btn-nav-admin" onclick="navegar('admin')" style="display: none;">📊 DASHBOARD ADMIN</button>
    <button onclick="navegar('retirar')">📦 RETIRAR / PESQUISAR</button>
    <button onclick="navegar('abastecer')">📥 ABASTECER BLOCO</button>
    <button onclick="navegar('transferir')" style="color: var(--primary);">🔄 ABERTURA DE BLOCADO</button>
    <button onclick="logout()" style="color: var(--retido); margin-top: 20px;">🚪 DESLOGAR</button>
</div>

<div id="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 25px;">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula">
        <input type="password" id="login-senha" placeholder="Senha">
        <button onclick="tentarLogin()" class="btn-retirar" style="width: 100%; font-size: 16px; margin-top: 10px;">ENTRAR</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div style="flex-grow: 1;">
            <div id="user-name" style="font-weight: 800; font-size: 16px;"></div>
            <div id="role-label" style="font-size: 10px; color: var(--primary); font-weight: bold; letter-spacing: 1px;"></div>
        </div>
    </div>

    <div class="container">
        <div id="view-admin" style="display: none;">
            <div class="admin-dashboard">
                <div class="stat-box"><h5>TOTAL PALLETS</h5><p id="st-total">0</p></div>
                <div class="stat-box" style="border-color: var(--critico);"><h5>CRÍTICOS</h5><p id="st-critico">0</p></div>
                <div class="stat-box" style="border-color: var(--retido);"><h5>RETIDOS</h5><p id="st-retido">0</p></div>
            </div>
            <div style="background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #2d3748;">
                <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="importarCSV(event)">
                <button class="btn-admin" onclick="document.getElementById('csv-file').click()">ALIMENTAR NOVO ESTOQUE (CSV)</button>
                <button class="btn-admin btn-excel" onclick="exportarHistoricoExcel()">SOLICITAR HISTÓRICO (EXCEL)</button>
            </div>
        </div>

        <div id="view-retirar">
            <div class="search-area">
                <input type="text" id="search-input" placeholder="Pesquisar material ou endereço..." oninput="renderizarEstoque()">
            </div>
            <div id="lista-estoque"></div>
        </div>

        <div id="view-abastecer" style="display: none;">
            <div style="background: var(--card); padding: 25px; border-radius: 12px;">
                <h3 style="color: var(--primary); margin-top: 0;">ABASTECER BLOCO</h3>
                <label style="font-size: 11px; color: #94a3b8;">ORIGEM</label>
                <select id="in-origem">
                    <option value="RECEBIMENTO">RECEBIMENTO</option>
                    <option value="STAGE">STAGE</option>
                </select>
                <input type="text" id="in-ender" placeholder="Endereço (Ex: 205-14)">
                <input type="text" id="in-mat" placeholder="Código Material" oninput="puxarDescricao(this.value, 'in-desc')">
                <input type="text" id="in-desc" readonly placeholder="Descrição" style="opacity: 0.5;">
                <input type="number" id="in-qtd" placeholder="Qtd Pallets">
                <input type="date" id="in-venc" onchange="calcularDias(this.value)">
                <p id="label-dias" style="color: var(--critico); font-size: 12px; font-weight: bold;"></p>
                <button class="btn-admin" style="background: var(--purple); color: white;" onclick="salvarAbastecimentoManual()">SALVAR ENTRADA</button>
            </div>
        </div>

        <div id="view-transferir" style="display: none;">
            <div style="background: var(--card); padding: 25px; border-radius: 12px;">
                <h3 style="color: var(--primary); margin-top: 0;">ABERTURA DE BLOCADO</h3>
                <input type="text" id="trans-origem" placeholder="Endereço de Origem (Ex: 205-14)" onchange="carregarInfoTransferencia(this.value)">
                <div id="info-transferencia" style="font-size: 12px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none;">
                    <span id="trans-mat-label" style="font-weight: bold; color: var(--primary);"></span><br>
                    Saldo: <span id="trans-saldo-label"></span>
                </div>
                <input type="text" id="trans-destino" placeholder="Endereço de Destino (Ex: 201-01)">
                <input type="number" id="trans-qtd" placeholder="Qtd a mover">
                <button class="btn-admin" style="background: var(--primary); color: black;" onclick="processarTransferencia()">CONFIRMAR ABERTURA</button>
            </div>
        </div>
    </div>
</div>

<div id="modal-retirada">
    <div class="modal-content">
        <h3 id="modal-titulo" style="margin-top:0; color:var(--primary);">Retirar Material</h3>
        <p id="modal-info" style="font-size:13px; opacity:0.8; margin-bottom: 15px;"></p>
        <label style="font-size: 11px; color: #94a3b8;">QUANTIDADE</label>
        <input type="number" id="modal-input-qtd" placeholder="0" style="font-size:24px; text-align:center;">
        <label style="font-size: 11px; color: #94a3b8;">DESTINO</label>
        <select id="modal-destino">
            <option value="SEPARAÇÃO">SEPARAÇÃO</option>
            <option value="TRANSFERENCIA">TRANSFERENCIA</option>
            <option value="APANHA">APANHA</option>
        </select>
        <div style="display:flex; gap:10px; margin-top: 15px;">
            <button onclick="fecharModal()" style="flex:1; padding:15px; background:#334155; color:white; border:none; border-radius:8px;">CANCELAR</button>
            <button id="btn-confirmar-modal" style="flex:1; padding:15px; background:var(--primary); color:black; border:none; border-radius:8px; font-weight:900;">CONFIRMAR</button>
        </div>
    </div>
</div>

<script>
    // Configurações e Inicialização
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let estoqueCompleto = [];
    let usuarioLogado = null;
    let itemParaRetirar = null;

    // Funções de Login e Navegação
    async function tentarLogin() {
        const mat = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        try {
            await auth.signInWithEmailAndPassword(mat + "@alb.com", senha);
            const doc = await db.collection("usuarios_wms").doc(mat + "@alb.com").get();
            if (doc.exists) {
                usuarioLogado = doc.data();
                usuarioLogado.email = mat + "@alb.com";
                localStorage.setItem('wms_session', JSON.stringify(usuarioLogado));
                iniciarApp();
            }
        } catch (e) { alert("Erro de Login: Verifique matrícula e senha."); }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        const isAdmin = usuarioLogado.perfil.toUpperCase() === "ADMIN";
        document.getElementById('role-label').innerText = isAdmin ? "PERFIL: ADMINISTRADOR" : "PERFIL: OPERADOR";
        document.getElementById('btn-nav-admin').style.display = isAdmin ? 'block' : 'none';
        conectarFirebase();
        navegar(isAdmin ? 'admin' : 'retirar');
    }

    function navegar(tela) {
        ['admin', 'retirar', 'abastecer', 'transferir'].forEach(t => {
            document.getElementById('view-' + t).style.display = 'none';
        });
        document.getElementById('view-' + tela).style.display = 'block';
        document.getElementById('sidebar').classList.remove('active');
    }

    // Gerenciamento de Dados
    function conectarFirebase() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            atualizarEstatisticas();
            renderizarEstoque();
        });
    }

    function atualizarEstatisticas() {
        if(!document.getElementById('st-total')) return;
        document.getElementById('st-total').innerText = estoqueCompleto.reduce((a, b) => a + (parseInt(b.qtd) || 0), 0);
        document.getElementById('st-critico').innerText = estoqueCompleto.filter(i => i.dias > 30 && i.dias <= 60).length;
        document.getElementById('st-retido').innerText = estoqueCompleto.filter(i => i.dias <= 30).length;
    }

    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase().trim();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';
        if (termo.length === 0) return;

        let filtrados = estoqueCompleto.filter(i => i.mat.toString().toLowerCase().includes(termo) || i.ender.toLowerCase().includes(termo));
        filtrados.sort((a,b) => a.dias - b.dias);

        filtrados.forEach(item => {
            let statusCor = item.dias <= 30 ? "var(--retido)" : (item.dias <= 60 ? "var(--critico)" : "var(--verde)");
            const card = document.createElement('div');
            card.className = 'item-card';
            card.style.borderLeftColor = statusCor;
            card.innerHTML = `
                <div>
                    <span class="badge-ender">${item.ender}</span>
                    <div style="font-weight:900; font-size:18px; margin-top:5px;">${item.mat}</div>
                    <div style="font-size:11px; opacity:0.7;">${item.desc}</div>
                    <div style="font-size:12px; margin-top:5px;">Vence em: <b>${item.dias} dias</b></div>
                </div>
                <div style="text-align:right">
                    <div style="font-size:22px; font-weight:900;">${item.qtd} PL</div>
                    <button class="btn-retirar" onclick="retirarMaterial('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender}', '${item.valFrente}')">RETIRAR</button>
                </div>`;
            lista.appendChild(card);
        });
    }

    // Operações
    function retirarMaterial(id, qtdAtual, mat, ender, validade) {
        itemParaRetirar = { id, qtdAtual, mat, ender, validade };
        document.getElementById('modal-titulo').innerText = `Retirar de: ${ender}`;
        document.getElementById('modal-info').innerHTML = `Material: <b>${mat}</b> | Saldo: <b>${qtdAtual} PL</b>`;
        document.getElementById('modal-retirada').style.display = 'flex';
        document.getElementById('btn-confirmar-modal').onclick = processarRetirada;
    }

    async function processarRetirada() {
        const v = parseInt(document.getElementById('modal-input-qtd').value);
        const dest = document.getElementById('modal-destino').value;
        if (isNaN(v) || v <= 0 || v > itemParaRetirar.qtdAtual) return alert("Quantidade inválida!");

        try {
            if (v === itemParaRetirar.qtdAtual) await db.collection("estoque_blocado").doc(itemParaRetirar.id).delete();
            else await db.collection("estoque_blocado").doc(itemParaRetirar.id).update({ qtd: itemParaRetirar.qtdAtual - v });
            
            await registrarMovimentacao(itemParaRetirar.ender, dest, itemParaRetirar.mat, itemParaRetirar.validade, `-${v} PL`);
            fecharModal();
            alert("Retirada concluída!");
        } catch (e) { alert("Erro ao processar."); }
    }

    let itemOrigemTrans = null;
    function carregarInfoTransferencia(ender) {
        const item = estoqueCompleto.find(i => i.ender.toUpperCase() === ender.toUpperCase());
        if (item) {
            itemOrigemTrans = item;
            document.getElementById('trans-mat-label').innerText = item.mat + " - " + item.desc;
            document.getElementById('trans-saldo-label').innerText = item.qtd + " PL";
            document.getElementById('info-transferencia').style.display = 'block';
        } else {
            alert("Endereço não encontrado!");
            document.getElementById('info-transferencia').style.display = 'none';
        }
    }

    async function processarTransferencia() {
        const destEnder = document.getElementById('trans-destino').value.toUpperCase().trim();
        const qtdMover = parseInt(document.getElementById('trans-qtd').value);
        if(!itemOrigemTrans || isNaN(qtdMover) || qtdMover > itemOrigemTrans.qtd) return alert("Dados inválidos!");

        try {
            if(qtdMover === itemOrigemTrans.qtd) await db.collection("estoque_blocado").doc(itemOrigemTrans.id).delete();
            else await db.collection("estoque_blocado").doc(itemOrigemTrans.id).update({ qtd: itemOrigemTrans.qtd - qtdMover });

            const destDoc = estoqueCompleto.find(i => i.ender === destEnder);
            if(destDoc) await db.collection("estoque_blocado").doc(destDoc.id).update({ qtd: destDoc.qtd + qtdMover });
            else await db.collection("estoque_blocado").add({ ...itemOrigemTrans, ender: destEnder, qtd: qtdMover });

            await registrarMovimentacao(itemOrigemTrans.ender, destEnder, itemOrigemTrans.mat, itemOrigemTrans.valFrente, `ABERTURA ${qtdMover} PL`);
            alert("Abertura de blocado realizada!");
            navegar('retirar');
        } catch (e) { alert("Erro na abertura."); }
    }

    // Histórico e CSV
    async function registrarMovimentacao(ori, dest, mat, val, qtd) {
        const agora = new Date();
        await db.collection("movimentacoes_wms").add({ 
            origem: ori, destino: dest, material: mat, validade: val, quantidade: qtd,
            operador: usuarioLogado.nome, data: agora.toLocaleDateString('pt-BR'), 
            hora: agora.toLocaleTimeString('pt-BR'), timestamp: agora 
        });
    }

    async function exportarHistoricoExcel() {
        try {
            const snap = await db.collection("movimentacoes_wms").orderBy("timestamp", "desc").limit(500).get();
            if (snap.empty) return alert("Nenhum histórico encontrado.");
            
            const dados = snap.docs.map(doc => {
                const d = doc.data();
                return { "Data": d.data, "Hora": d.hora, "Origem": d.origem, "Destino": d.destino, "Material": d.material, "Validade": d.validade, "Qtd": d.quantidade, "Operador": d.operador };
            });
            
            const ws = XLSX.utils.json_to_sheet(dados);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Movimentacoes");
            XLSX.writeFile(wb, `Historico_WMS_${new Date().getTime()}.xlsx`);
        } catch (e) { console.error(e); alert("Erro ao gerar histórico."); }
    }

    // Funções Auxiliares
    function fecharModal() { document.getElementById('modal-retirada').style.display = 'none'; }
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    function logout() { auth.signOut(); localStorage.removeItem('wms_session'); location.reload(); }
    function calcularDias(data) {
        const dias = Math.ceil((new Date(data) - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById('label-dias').innerText = `Vencimento em ${dias} dias`;
    }
    function puxarDescricao(cod, fieldId) {
        const p = estoqueCompleto.find(i => i.mat.toString() === cod);
        document.getElementById(fieldId).value = p ? p.desc : "NOVO MATERIAL";
    }

    window.onload = () => {
        const s = localStorage.getItem('wms_session');
        if(s) { usuarioLogado = JSON.parse(s); iniciarApp(); }
    };
</script>
</body>
</html>
