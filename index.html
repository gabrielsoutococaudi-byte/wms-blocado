<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Sistema Integrado</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WMS PRO">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#00d2ff">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #0a0f1e; --card: #161e31; --primary: #00d2ff; --critico: #fbbf24; --retido: #f87171; --verde: #4ade80; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1000; padding-top: 60px; border-right: 1px solid #2d3748; box-shadow: 10px 0 20px rgba(0,0,0,0.5); }
        .sidebar.active { left: 0; }
        .sidebar button { width: 100%; padding: 15px; background: transparent; border: none; color: white; text-align: left; cursor: pointer; border-bottom: 1px solid #2d3748; font-weight: bold; font-size: 14px; }

        .header { padding: 15px 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 900; }
        .menu-btn { background: none; border: 1px solid #444; padding: 8px; border-radius: 5px; cursor: pointer; color: white; font-size: 20px; }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        .stat-box { background: var(--card); padding: 15px; border-radius: 8px; border-top: 3px solid var(--primary); text-align: center; }
        .search-area { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; outline: none; }
        
        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #444; }
        .badge-ender { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        
        .btn-retirar { background: var(--primary); color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: 900; cursor: pointer; }
        .btn-admin { background: var(--verde); color: #000; padding: 15px; width: 100%; border-radius: 8px; font-weight: 900; margin-top: 10px; border: none; cursor: pointer; }

        /* Modal para Retirada Numérica */
        #modal-retirada { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 15px; width: 85%; max-width: 350px; text-align: center; }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <button id="btn-nav-admin" onclick="navegar('admin')" style="display: none;">📊 DASHBOARD ADMIN</button>
    <button onclick="navegar('retirar')">📦 RETIRAR / PESQUISAR</button>
    <button onclick="navegar('abastecer')">📥 ABASTECER BLOCO</button>
    <button onclick="logout()" style="color: var(--retido); margin-top: 20px;">🚪 DESLOGAR</button>
</div>

<div id="modal-retirada">
    <div class="modal-content">
        <h3 id="modal-titulo" style="color: var(--primary);">Retirar Material</h3>
        <p id="modal-info" style="font-size: 12px; opacity: 0.8;"></p>
        <input type="number" id="input-qtd-retirar" inputmode="numeric" placeholder="Quantidade de PL" style="font-size: 20px; text-align: center; margin-bottom: 15px;">
        <div style="display: flex; gap: 10px;">
            <button class="btn-retirar" style="background: #444; color: white; flex: 1;" onclick="fecharModal()">CANCELAR</button>
            <button class="btn-retirar" style="flex: 1;" onclick="confirmarRetirada()">CONFIRMAR</button>
        </div>
    </div>
</div>

<div id="login-screen">
    <div class="login-box" style="padding: 30px; text-align: center;">
        <h2 style="color: var(--primary);">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula" style="margin-bottom:10px;">
        <input type="password" id="login-senha" placeholder="Senha" style="margin-bottom:20px;">
        <button onclick="tentarLogin()" class="btn-retirar" style="width: 100%;">ENTRAR</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div id="user-info">
            <div id="user-name" style="font-weight: 800;"></div>
            <div id="role-label" style="font-size: 10px; color: var(--primary);"></div>
        </div>
    </div>

    <div class="container">
        <div id="view-admin" style="display: none;">
            <div id="admin-tools-section">
                <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="importarCSV(event)">
                <button class="btn-admin" onclick="document.getElementById('csv-file').click()">ALIMENTAR NOVO ESTOQUE (CSV)</button>
            </div>
        </div>

        <div id="view-retirar">
            <div class="search-area">
                <input type="text" id="search-input" placeholder="Pesquisar material ou endereço..." oninput="renderizarEstoque()">
            </div>
            <div id="lista-estoque"></div>
        </div>

        <div id="view-abastecer" style="display: none;">
            <div style="background: var(--card); padding: 25px; border-radius: 12px;">
                <h3 style="color: var(--primary); margin: 0 0 15px 0;">ABASTECER BLOCO</h3>
                <input type="text" id="in-ender" placeholder="Endereço..." oninput="salvarRascunho()" style="margin-bottom: 10px;">
                <input type="text" id="in-mat" placeholder="Código Material..." oninput="puxarDescricao(this.value); salvarRascunho();" style="margin-bottom: 10px;">
                <input type="text" id="in-desc" readonly style="opacity: 0.5; margin-bottom: 10px;">
                <input type="number" id="in-qtd" inputmode="numeric" placeholder="Qtd Pallets" oninput="salvarRascunho()" style="margin-bottom: 10px;">
                <input type="date" id="in-venc" onchange="calcularDias(this.value); salvarRascunho();" style="margin-bottom: 15px;">
                <p id="label-dias" style="color: var(--critico); font-size: 12px; font-weight: bold;"></p>
                <button class="btn-admin" style="background: #7c3aed; color: white;" onclick="salvarAbastecimentoManual()">SALVAR ENTRADA</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let estoqueCompleto = [];
    let usuarioLogado = null;
    let itemParaRetirada = null;
    let wakeLock = null;

    // --- REGRA DE MANTER TELA ACESA ---
    async function manterTelaAcesa() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log("Tela bloqueada para não apagar.");
            }
        } catch (err) { console.log("Erro WakeLock: " + err.message); }
    }

    // --- REGRA DE NÃO APAGAR DADOS (RASCUNHO) ---
    function salvarRascunho() {
        const rascunho = {
            ender: document.getElementById('in-ender').value,
            mat: document.getElementById('in-mat').value,
            qtd: document.getElementById('in-qtd').value,
            venc: document.getElementById('in-venc').value
        };
        localStorage.setItem('rascunho_abastecimento', JSON.stringify(rascunho));
    }

    function carregarRascunho() {
        const salvo = localStorage.getItem('rascunho_abastecimento');
        if (salvo) {
            const data = JSON.parse(salvo);
            document.getElementById('in-ender').value = data.ender || '';
            document.getElementById('in-mat').value = data.mat || '';
            document.getElementById('in-qtd').value = data.qtd || '';
            document.getElementById('in-venc').value = data.venc || '';
            if(data.mat) puxarDescricao(data.mat);
        }
    }

    // --- FUNÇÕES DE RETIRADA (TECLADO NUMÉRICO) ---
    function retirarMaterial(id, qtd, mat, ender, validade) {
        itemParaRetirada = { id, qtd, mat, ender, validade };
        document.getElementById('modal-titulo').innerText = `Retirar: ${mat}`;
        document.getElementById('modal-info').innerText = `Endereço: ${ender} | Saldo: ${qtd} PL`;
        document.getElementById('input-qtd-retirar').value = '';
        document.getElementById('modal-retirada').style.display = 'flex';
        document.getElementById('input-qtd-retirar').focus();
    }

    function fecharModal() { document.getElementById('modal-retirada').style.display = 'none'; }

    async function confirmarRetirada() {
        const qtdInput = document.getElementById('input-qtd-retirar').value;
        const v = parseInt(qtdInput);
        
        if (!v || v <= 0 || v > itemParaRetirada.qtd) {
            alert("Quantidade inválida ou maior que o saldo!");
            return;
        }

        if (v === itemParaRetirada.qtd) {
            await db.collection("estoque_blocado").doc(itemParaRetirada.id).delete();
        } else {
            await db.collection("estoque_blocado").doc(itemParaRetirada.id).update({ 
                qtd: itemParaRetirada.qtd - v 
            });
        }
        
        registrarMovimentacao(itemParaRetirada.ender, itemParaRetirada.mat, itemParaRetirada.validade, `-${v} PL`);
        fecharModal();
        alert("Retirada concluída!");
    }

    // --- CORREÇÃO DA IMPORTAÇÃO DE PLANILHA ---
    function importarCSV(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const texto = e.target.result;
                const linhas = texto.split(/\r?\n/).slice(1);
                const batch = db.batch();
                let cont = 0;

                linhas.forEach(linha => {
                    const c = linha.split(";"); // Separador por ponto e vírgula
                    if (c.length >= 8) {
                        const id = c[0].trim() + "_" + c[1].trim(); // Endereço + Material como ID único
                        batch.set(db.collection("estoque_blocado").doc(id), {
                            ender: c[0].trim(),
                            mat: c[1].trim(),
                            desc: c[2].trim(),
                            valFrente: c[3].trim(),
                            qtd: parseInt(c[5]) || 0,
                            dias: parseInt(c[7]) || 0
                        });
                        cont++;
                    }
                });

                await batch.commit();
                alert(`Sucesso! ${cont} itens carregados.`);
                location.reload();
            } catch (err) {
                alert("Erro ao ler planilha. Verifique se o formato está correto (CSV com ponto e vírgula).");
            }
        };
        reader.readAsText(file, 'ISO-8859-1'); // Suporta acentos da planilha Excel
    }

    // --- FUNÇÕES DE NAVEGAÇÃO E LOGIN ---
    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        
        const isAdmin = usuarioLogado.perfil.toUpperCase() === "ADMIN";
        document.getElementById('btn-nav-admin').style.display = isAdmin ? 'block' : 'none';
        
        manterTelaAcesa();
        carregarRascunho();
        conectarFirebase();
        navegar(isAdmin ? 'admin' : 'retirar');
    }

    async function tentarLogin() {
        const mat = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        try {
            await auth.signInWithEmailAndPassword(mat + "@alb.com", senha);
            const doc = await db.collection("usuarios_wms").doc(mat + "@alb.com").get();
            if (doc.exists) {
                usuarioLogado = doc.data();
                usuarioLogado.email = mat + "@alb.com";
                localStorage.setItem('wms_session', JSON.stringify(usuarioLogado));
                iniciarApp();
            }
        } catch (e) { alert("Erro de Login. Verifique matrícula e senha."); }
    }

    function navegar(tela) {
        ['admin', 'retirar', 'abastecer'].forEach(t => {
            const el = document.getElementById('view-' + t);
            if(el) el.style.display = 'none';
        });
        document.getElementById('view-' + tela).style.display = 'block';
        document.getElementById('sidebar').classList.remove('active');
    }

    function conectarFirebase() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderizarEstoque();
        });
    }

    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';
        if (!termo) return;

        estoqueCompleto.filter(i => i.mat.toLowerCase().includes(termo) || i.ender.toLowerCase().includes(termo))
        .sort((a,b) => a.dias - b.dias)
        .forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.style.borderLeftColor = item.dias <= 60 ? 'var(--critico)' : 'var(--verde)';
            card.innerHTML = `
                <div>
                    <span class="badge-ender">${item.ender}</span>
                    <div style="font-weight:900; font-size:16px; margin-top:5px;">${item.mat}</div>
                    <div style="font-size:11px; opacity:0.7;">${item.desc}</div>
                    <div style="font-size:12px;">Vence em: <b>${item.dias} dias</b></div>
                </div>
                <div style="text-align:right">
                    <div style="font-size:20px; font-weight:900;">${item.qtd} PL</div>
                    <button class="btn-retirar" onclick="retirarMaterial('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender}', '${item.valFrente}')">RETIRAR</button>
                </div>`;
            lista.appendChild(card);
        });
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    function logout() { auth.signOut(); localStorage.removeItem('wms_session'); location.reload(); }

    window.onload = () => {
        const s = localStorage.getItem('wms_session');
        if(s) { usuarioLogado = JSON.parse(s); iniciarApp(); }
    };
</script>
</body>
</html>
