<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Sistema Integrado</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #0a0f1e; --card: #161e31; --primary: #00d2ff; --critico: #fbbf24; --retido: #f87171; --verde: #4ade80; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1000; padding-top: 60px; border-right: 1px solid #2d3748; box-shadow: 10px 0 20px rgba(0,0,0,0.5); }
        .sidebar.active { left: 0; }
        .sidebar button { width: 100%; padding: 15px; background: transparent; border: none; color: white; text-align: left; cursor: pointer; border-bottom: 1px solid #2d3748; font-weight: bold; font-size: 14px; }
        .sidebar button:hover { background: rgba(255,255,255,0.05); }

        .header { padding: 15px 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 900; }
        .menu-btn { background: none; border: 1px solid #444; padding: 8px; border-radius: 5px; cursor: pointer; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        .login-box { max-width: 400px; margin: 100px auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .admin-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 8px; border-top: 3px solid var(--primary); text-align: center; }
        .stat-box h5 { margin: 0; font-size: 10px; opacity: 0.6; text-transform: uppercase; }
        .stat-box p { margin: 8px 0 0; font-size: 24px; font-weight: 900; }

        .search-area { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; outline: none; margin-bottom: 10px; }
        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #444; }
        
        .badge-ender { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        .badge-status { background: var(--critico); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-left: 8px; }

        .btn-retirar { background: var(--primary); color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: 900; cursor: pointer; }
        .btn-admin { background: var(--verde); color: #000; padding: 15px; width: 100%; border-radius: 8px; font-weight: 900; margin-top: 10px; border: none; cursor: pointer; text-transform: uppercase; }
        
        #offline-badge { display: none; background: var(--retido); color: white; text-align: center; font-size: 11px; padding: 5px; font-weight: bold; position: fixed; bottom: 0; width: 100%; z-index: 2000; }
    </style>
</head>
<body>

<div id="offline-badge">MODO OFFLINE</div>

<div id="sidebar" class="sidebar">
    <button id="btn-nav-admin" onclick="navegar('admin')" style="display: none;">📊 DASHBOARD ADMIN</button>
    <button onclick="navegar('retirar')">📦 RETIRAR / PESQUISAR</button>
    <button onclick="navegar('abastecer')">📥 ABASTECER BLOCO</button>
    <button onclick="logout()" style="color: var(--retido); margin-top: 20px;">🚪 DESLOGAR</button>
</div>

<div id="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 25px;">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula">
        <input type="password" id="login-senha" placeholder="Senha">
        <button onclick="tentarLogin()" class="btn-retirar" style="width: 100%; font-size: 16px;">ENTRAR</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div style="flex-grow: 1;">
            <div id="user-name" style="font-weight: 800; font-size: 16px;"></div>
            <div id="role-label" style="font-size: 10px; color: var(--primary); font-weight: bold; letter-spacing: 1px;"></div>
        </div>
    </div>

    <div class="container">
        <div id="view-admin" style="display: none;">
            <div id="dash-container" class="admin-dashboard">
                <div class="stat-box"><h5>TOTAL PALLETS</h5><p id="st-total">0</p></div>
                <div class="stat-box" style="border-color: var(--critico);"><h5>CRÍTICOS</h5><p id="st-critico">0</p></div>
                <div class="stat-box" style="border-color: var(--retido);"><h5>RETIDOS</h5><p id="st-retido">0</p></div>
            </div>
            <div style="background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #2d3748;">
                <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="importarCSV(event)">
                <button class="btn-admin" onclick="document.getElementById('csv-file').click()">ATUALIZAR ESTOQUE (CSV)</button>
                <button id="btn-export-excel" class="btn-admin" style="background: #107c41; color: white;" onclick="exportarHistoricoExcel()">HISTÓRICO (EXCEL)</button>
            </div>
        </div>

        <div id="view-retirar">
            <div class="search-area">
                <input type="text" id="search-input" placeholder="Pesquisar material ou endereço..." oninput="renderizarEstoque()">
            </div>
            <div id="lista-estoque"></div>
        </div>

        <div id="view-abastecer" style="display: none;">
            <div style="background: var(--card); padding: 25px; border-radius: 12px;">
                <h3 style="color: var(--primary); margin-top: 0;">ABASTECER BLOCO</h3>
                <input type="text" id="in-ender" placeholder="Endereço (Ex: A-01-01)">
                <input type="text" id="in-mat" placeholder="Código Material" oninput="puxarDescricao(this.value)">
                <input type="text" id="in-desc" readonly placeholder="Descrição..." style="opacity:0.6;">
                <input type="number" id="in-qtd" placeholder="Qtd Pallets">
                <input type="date" id="in-venc" onchange="calcularDias(this.value)">
                <p id="label-dias" style="color: var(--critico); font-size: 12px; font-weight: bold;"></p>
                <button class="btn-admin" style="background: #7c3aed; color: white;" onclick="salvarAbastecimentoManual()">SALVAR ENTRADA</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Configurações do Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    db.enablePersistence().catch(() => {});

    let estoqueCompleto = [];
    let usuarioLogado = null;
    let diasCalculados = 0;

    // Login e Inicialização
    async function tentarLogin() {
        const mat = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        try {
            await auth.signInWithEmailAndPassword(mat + "@alb.com", senha);
            const doc = await db.collection("usuarios_wms").doc(mat + "@alb.com").get();
            usuarioLogado = doc.data();
            usuarioLogado.email = mat + "@alb.com";
            // Garante que o nome exista para o histórico
            if(!usuarioLogado.nome) usuarioLogado.nome = mat; 
            
            localStorage.setItem('wms_session', JSON.stringify(usuarioLogado));
            iniciarApp();
        } catch (e) { alert("Erro de acesso: Verifique matrícula e senha."); }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        const isAdmin = usuarioLogado.perfil && usuarioLogado.perfil.toUpperCase() === "ADMIN";
        document.getElementById('btn-nav-admin').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('role-label').innerText = usuarioLogado.perfil ? usuarioLogado.perfil.toUpperCase() : "OPERADOR";
        conectarFirebase();
    }

    function conectarFirebase() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            atualizarEstatisticas();
            renderizarEstoque();
        });
    }

    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase().trim();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';
        if (termo.length === 0) return;

        let todosEncontrados = estoqueCompleto.filter(i => 
            (i.mat && i.mat.toLowerCase().includes(termo)) || (i.ender && i.ender.toLowerCase().includes(termo))
        );

        let criticos = todosEncontrados.filter(i => i.dias <= 60);
        let normais = todosEncontrados.filter(i => i.dias > 60);
        let exibir = criticos.length > 0 ? criticos : normais;

        exibir.sort((a, b) => a.dias - b.dias);

        exibir.forEach(item => {
            const isCritico = item.dias <= 60;
            const card = document.createElement('div');
            card.className = `item-card`;
            card.style.borderLeftColor = isCritico ? 'var(--critico)' : 'var(--verde)';
            
            card.innerHTML = `
                <div>
                    <span class="badge-ender">${item.ender}</span>
                    <span class="badge-status" style="background:${isCritico?'var(--critico)':'var(--verde)'}">${isCritico?'CRÍTICO':'DATA BOA'}</span>
                    <div style="font-weight:900; font-size:18px; margin-top:5px;">${item.mat}</div>
                    <div style="font-size:11px; opacity:0.7;">${item.desc || ""}</div>
                    <div style="font-size:12px; margin-top:5px;">Vence em: <b>${item.dias} dias</b></div>
                </div>
                <div style="text-align:right">
                    <div style="font-size:22px; font-weight:900;">${item.qtd} PL</div>
                    <button class="btn-retirar" onclick="retirarMaterial('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender}', '${item.valFrente}')">RETIRAR</button>
                </div>`;
            lista.appendChild(card);
        });
    }

    async function salvarAbastecimentoManual() {
        const ender = document.getElementById('in-ender').value.toUpperCase().trim();
        const mat = document.getElementById('in-mat').value.trim();
        const qtdAdd = parseInt(document.getElementById('in-qtd').value);
        const inputData = document.getElementById('in-venc').value;
        const novaData = inputData ? inputData.split('-').reverse().join('/') : "";

        if(!ender || !mat || isNaN(qtdAdd) || !inputData) return alert("Preencha todos os campos!");

        const ocupante = estoqueCompleto.find(i => i.ender === ender);
        const desc = document.getElementById('in-desc').value;

        if (ocupante) {
            if (ocupante.mat !== mat) return alert("BLOQUEIO: Este endereço já tem outro material ("+ocupante.mat+")!");

            const manter = confirm(`Material já existe! OK para manter data antiga (${ocupante.valFrente}) ou CANCELAR para atualizar para ${novaData}?`);
            const dataF = manter ? ocupante.valFrente : novaData;
            const diasF = manter ? ocupante.dias : diasCalculados;

            await db.collection("estoque_blocado").doc(ocupante.id).update({ 
                qtd: ocupante.qtd + qtdAdd, valFrente: dataF, dias: diasF 
            });
            registrarMov(ender, mat, dataF, `+${qtdAdd} PL (Abastecimento)`);
            alert("Estoque somado!");
        } else {
            await db.collection("estoque_blocado").doc(ender+"_"+mat).set({ 
                ender, mat, qtd: qtdAdd, dias: diasCalculados, valFrente: novaData, desc 
            });
            registrarMov(ender, mat, novaData, `+${qtdAdd} PL (Entrada Nova)`);
            alert("Novo endereço ocupado!");
        }
        navegar('retirar');
    }

    async function retirarMaterial(id, qtdAtual, mat, ender, val) {
        const n = prompt(`Retirar de ${mat}? (Saldo: ${qtdAtual})`);
        if(!n || isNaN(n) || n <= 0) return;
        const qtdRetirar = parseInt(n);
        if(qtdRetirar > qtdAtual) return alert("Quantidade maior que o saldo!");

        if(qtdRetirar === qtdAtual) await db.collection("estoque_blocado").doc(id).delete();
        else await db.collection("estoque_blocado").doc(id).update({ qtd: qtdAtual - qtdRetirar });
        
        registrarMov(ender, mat, val, `-${qtdRetirar} PL`); 
        alert("Retirado com sucesso!");
    }

    // REGISTRO DE MOVIMENTAÇÃO ATUALIZADO (CONFORME SOLICITADO)
    async function registrarMov(e, m, v, q) {
        const agora = new Date();
        await db.collection("movimentacoes_wms").add({
            endereco: e,
            material: m,
            validade: v,
            quantidade: q,
            usuario: usuarioLogado.nome,
            data: agora.toLocaleDateString('pt-BR'),
            hora: agora.toLocaleTimeString('pt-BR'),
            timestamp: agora
        });
    }

    // EXPORTAÇÃO EXCEL ATUALIZADA (CONFORME SOLICITADO)
    async function exportarHistoricoExcel() {
        try {
            const btn = document.getElementById('btn-export-excel');
            const originalText = btn.innerText;
            btn.innerText = "GERANDO...";
            btn.disabled = true;

            const snap = await db.collection("movimentacoes_wms").orderBy("timestamp", "desc").limit(1000).get();
            
            if (snap.empty) {
                alert("Nenhum histórico encontrado!");
                btn.innerText = originalText;
                btn.disabled = false;
                return;
            }

            const dadosExcel = snap.docs.map(doc => {
                const d = doc.data();
                return {
                    "Endereço": d.endereco || "",
                    "Material": d.material || "",
                    "Validade": d.validade || "",
                    "Qtd MOVIMENTADA": d.quantidade || "",
                    "Usuário": d.usuario || "",
                    "Data": d.data || "",
                    "Hora DA MOVIMENTAÇÃO": d.hora || ""
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(dadosExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Histórico");

            XLSX.writeFile(workbook, `Historico_WMS_${new Date().getTime()}.xlsx`);
            
            btn.innerText = originalText;
            btn.disabled = false;
        } catch (error) {
            console.error(error);
            alert("Erro ao gerar Excel: " + error.message);
            document.getElementById('btn-export-excel').disabled = false;
        }
    }

    async function importarCSV(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const linhas = e.target.result.split(/\r?\n/).filter(l => l.trim() !== "").slice(1);
            if(!confirm("Limpar estoque antigo e subir este arquivo?")) return;
            
            const snap = await db.collection("estoque_blocado").get();
            const bDel = db.batch(); 
            snap.forEach(d => bDel.delete(d.ref)); 
            await bDel.commit();
            
            const bAdd = db.batch();
            linhas.forEach(l => {
                const c = l.split(";");
                if(c.length >= 6) {
                    bAdd.set(db.collection("estoque_blocado").doc(c[0].trim()+"_"+c[1].trim()), { 
                        ender: c[0].trim(), mat: c[1].trim(), desc: c[2].trim(), valFrente: c[3].trim(), qtd: parseInt(c[5])||0, dias: parseInt(c[7])||0 
                    });
                }
            });
            await bAdd.commit(); 
            alert("Estoque Sincronizado!"); 
            location.reload();
        };
        reader.readAsText(file, 'ISO-8859-1');
    }

    function atualizarEstatisticas() {
        const isAdmin = usuarioLogado && usuarioLogado.perfil && usuarioLogado.perfil.toUpperCase() === "ADMIN";
        if(!isAdmin) return;
        document.getElementById('st-total').innerText = estoqueCompleto.reduce((a, b) => a + (parseInt(b.qtd) || 0), 0);
        document.getElementById('st-critico').innerText = estoqueCompleto.filter(i => i.dias <= 60).length;
        document.getElementById('st-retido').innerText = estoqueCompleto.filter(i => i.dias <= 30).length;
    }

    function navegar(t) { 
        ['admin','retirar','abastecer'].forEach(x => document.getElementById('view-'+x).style.display='none');
        document.getElementById('view-'+t).style.display='block';
        document.getElementById('sidebar').classList.remove('active');
    }

    function calcularDias(d) {
        diasCalculados = Math.ceil((new Date(d) - new Date()) / (1000*60*60*24));
        document.getElementById('label-dias').innerText = `Vencimento em ${diasCalculados} dias`;
    }

    function puxarDescricao(cod) {
        const p = estoqueCompleto.find(i => i.mat === cod);
        document.getElementById('in-desc').value = p ? p.desc : "NOVO MATERIAL";
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    function logout() { auth.signOut(); localStorage.removeItem('wms_session'); location.reload(); }

    window.onload = () => {
        const s = localStorage.getItem('wms_session');
        if(s) { usuarioLogado = JSON.parse(s); iniciarApp(); }
    };
</script>
</body>
</html>
