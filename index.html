<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Gestão de Blocado</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0a0f1e; 
            --card: #161e31; 
            --primary: #00d2ff; 
            --critico: #fbbf24; 
            --retido: #f87171; 
            --verde: #4ade80; 
            --text: #f8fafc; 
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding-bottom: 30px; 
            overflow-x: hidden;
        }

        /* --- Header & Main Content --- */
        .header { 
            padding: 15px 20px; 
            background: var(--card); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #2d3748; 
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #main {
            transition: margin-left .5s;
            padding: 15px;
        }

        .container { max-width: 900px; margin: auto; }

        /* --- Sidebar (Menu Administrativo) --- */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1001;
            top: 0;
            left: 0;
            background-color: var(--card);
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
            border-right: 1px solid #2d3748;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        .sidebar .closebtn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 30px;
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
        }

        .sidebar-content { padding: 20px; }

        .openbtn {
            font-size: 22px;
            cursor: pointer;
            background: transparent;
            color: var(--primary);
            border: none;
            margin-right: 15px;
            display: none; /* Só aparece para ADMIN */
        }

        /* --- Cards e Componentes --- */
        .admin-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 12px; border-radius: 8px; border-top: 3px solid var(--primary); text-align: center; }
        .stat-box h5 { margin: 0; font-size: 10px; opacity: 0.6; text-transform: uppercase; }
        .stat-box p { margin: 8px 0 0; font-size: 20px; font-weight: 900; }

        .chart-container { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2d3748; }
        .chart-controls { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }

        .search-area { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        #search-input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; font-size: 15px; outline: none; box-sizing: border-box; }

        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #444; }
        .item-critico { border-left-color: var(--critico); }
        .item-retido { border-left-color: var(--retido); }
        .item-verde { border-left-color: var(--verde); }
        
        .ender-badge { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; }
        .status-label { font-size: 10px; font-weight: 900; margin-left: 10px; text-transform: uppercase; }
        
        .btn { padding: 10px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 8px; }
        .btn-retirar { background: var(--primary); color: #000; width: auto; margin-top: 0; }
        .btn-import { background: var(--verde); color: #000; }
        .btn-excel { background: #107c41; color: white; }
        .btn-filter { background: #2d3748; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-filter.active { background: var(--primary); color: #000; }

        /* Login */
        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); }
        .login-box { background: var(--card); padding: 30px; border-radius: 15px; width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 25px;">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula ou E-mail" style="width:100%; padding:12px; margin-bottom:10px; border-radius:5px; border:1px solid #334155; background:#0a0f1e; color:white; box-sizing: border-box;">
        <input type="password" id="login-senha" placeholder="Senha" style="width:100%; padding:12px; margin-bottom:20px; border-radius:5px; border:1px solid #334155; background:#0a0f1e; color:white; box-sizing: border-box;">
        <button onclick="tentarLogin()" class="btn btn-retirar" style="width: 100%; font-size: 16px;">ENTRAR</button>
    </div>
</div>

<div id="mySidebar" class="sidebar">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <div class="sidebar-content">
        <h3 style="color: var(--primary); font-size: 14px; text-transform: uppercase;">Ações Administrativas</h3>
        <hr style="border: 0; border-top: 1px solid #2d3748; margin: 15px 0;">
        
        <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="importarCSV(event)">
        <button onclick="document.getElementById('csv-file').click()" class="btn btn-import">ALIMENTAR ESTOQUE (CSV)</button>
        <button onclick="exportarHistoricoExcel()" class="btn btn-excel">BAIXAR HISTÓRICO (EXCEL)</button>
        
        <p style="font-size: 11px; opacity: 0.5; margin-top: 30px; text-align: center;">WMS FLOW PRO v2.0</p>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <div style="display: flex; align-items: center;">
            <button id="openbtn" class="openbtn" onclick="openNav()">&#9776;</button>
            <div>
                <div id="user-name" style="font-size: 16px; font-weight: 800;"></div>
                <span id="role-label" style="font-size: 10px; opacity: 0.6;"></span>
            </div>
        </div>
        <button onclick="logout()" style="background:transparent; border:1px solid #444; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;">Sair</button>
    </div>

    <div id="main">
        <div class="container">
            <div id="dash-container" class="admin-dashboard" style="display: none;">
                <div class="stat-box"><h5>Total Pallets</h5><p id="st-total">0</p></div>
                <div class="stat-box" style="border-color: var(--critico);"><h5>Críticos</h5><p id="st-critico">0</p></div>
                <div class="stat-box" style="border-color: var(--retido);"><h5>Retidos</h5><p id="st-retido">0</p></div>
            </div>

            <div id="admin-charts" class="chart-container" style="display: none;">
                <div class="chart-controls">
                    <h3 style="margin:0; font-size:12px; color:var(--primary); flex-grow:1;">TOP 10 MOVIMENTAÇÕES (PL)</h3>
                    <button id="btn-semanal" class="btn-filter active" onclick="carregarGrafico('semanal')">Semanal</button>
                    <button id="btn-mensal" class="btn-filter" onclick="carregarGrafico('mensal')">Mensal</button>
                </div>
                <canvas id="movimentacaoChart" height="180"></canvas>
            </div>

            <div class="search-area">
                <input type="text" id="search-input" placeholder="Buscar Material ou Endereço..." oninput="renderizarEstoque()">
            </div>

            <div id="lista-estoque"></div>
        </div>
    </div>
</div>

<script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    let estoqueCompleto = [];
    let usuarioLogado = null;
    let meuGrafico = null;

    // --- CONTROLE SIDEBAR ---
    function openNav() {
        document.getElementById("mySidebar").style.width = "280px";
    }
    function closeNav() {
        document.getElementById("mySidebar").style.width = "0";
    }

    // --- AUTENTICAÇÃO ---
    async function tentarLogin() {
        const loginInput = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        const email = loginInput.includes('@') ? loginInput : `${loginInput}@alb.com`;

        try {
            await auth.signInWithEmailAndPassword(email, senha);
            const doc = await db.collection("usuarios_wms").doc(email).get();

            if (doc.exists) {
                const dados = doc.data();
                usuarioLogado = { 
                    nome: dados.nome, 
                    role: dados.perfil.toUpperCase(),
                    email: email 
                };
                localStorage.setItem('wms_session_v2', JSON.stringify(usuarioLogado));
                iniciarApp();
            }
        } catch (error) {
            alert("Falha no login. Verifique as credenciais.");
        }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        document.getElementById('role-label').innerText = usuarioLogado.role;

        if (usuarioLogado.role === "ADMIN") {
            document.getElementById('dash-container').style.display = 'grid';
            document.getElementById('admin-charts').style.display = 'block';
            document.getElementById('openbtn').style.display = 'block';
            carregarGrafico('semanal');
        }
        conectarFirebase();
    }

    function conectarFirebase() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            atualizarDashboard();
            renderizarEstoque();
        });
    }

    // --- DASHBOARD E GRÁFICOS ---
    function atualizarDashboard() {
        if(!usuarioLogado || usuarioLogado.role !== "ADMIN") return;
        document.getElementById('st-total').innerText = estoqueCompleto.reduce((a, b) => a + (parseInt(b.qtd) || 0), 0);
        document.getElementById('st-critico').innerText = estoqueCompleto.filter(i => i.dias >= 31 && i.dias <= 60).length;
        document.getElementById('st-retido').innerText = estoqueCompleto.filter(i => i.dias < 30).length;
    }

    async function carregarGrafico(periodo) {
        document.getElementById('btn-semanal').classList.toggle('active', periodo === 'semanal');
        document.getElementById('btn-mensal').classList.toggle('active', periodo === 'mensal');

        const agora = new Date();
        let dataLimite = new Date();
        if (periodo === 'semanal') dataLimite.setDate(agora.getDate() - 7);
        else dataLimite.setMonth(agora.getMonth() - 1);

        const snap = await db.collection("movimentacoes_wms").where("timestamp", ">=", dataLimite).get();
        const contagem = {};
        
        snap.forEach(doc => {
            const mov = doc.data();
            const mat = mov.material;
            const qtd = Math.abs(parseInt(mov.quantidade)) || 0;
            contagem[mat] = (contagem[mat] || 0) + qtd;
        });

        const top10 = Object.entries(contagem).sort((a, b) => b[1] - a[1]).slice(0, 10);
        renderizarGraficoCanvas(top10.map(i => i[0]), top10.map(i => i[1]));
    }

    function renderizarGraficoCanvas(labels, valores) {
        const ctx = document.getElementById('movimentacaoChart').getContext('2d');
        if (meuGrafico) meuGrafico.destroy();
        meuGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{ label: 'PL', data: valores, backgroundColor: '#00d2ff', borderRadius: 5 }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: '#2d3748' }, ticks: { color: '#fff' } },
                    y: { grid: { display: false }, ticks: { color: '#fff', font: { size: 9 } } }
                }
            }
        });
    }

    // --- OPERACIONAL ---
    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';
        if (termo.length === 0) return;

        let filtrados = estoqueCompleto.filter(i => 
            i.mat.toLowerCase().includes(termo) || i.desc.toLowerCase().includes(termo) || i.ender.toLowerCase().includes(termo)
        );

        if (usuarioLogado.role !== "ADMIN") {
            const criticos = filtrados.filter(i => i.dias >= 31 && i.dias <= 60);
            if (criticos.length > 0) filtrados = criticos;
            else filtrados = filtrados.filter(i => i.dias > 60);
        }

        filtrados.sort((a, b) => a.dias - b.dias).forEach(item => {
            let status = item.dias < 30 ? "RETIDO" : (item.dias <= 60 ? "DATA CRÍTICA" : "DATA BOA");
            let classe = item.dias < 30 ? "item-retido" : (item.dias <= 60 ? "item-critico" : "item-verde");

            const card = document.createElement('div');
            card.className = `item-card ${classe}`;
            card.innerHTML = `
                <div>
                    <span class="ender-badge">${item.ender}</span>
                    <span class="status-label" style="color:${status === 'DATA BOA' ? '#4ade80' : (status === 'DATA CRÍTICA' ? '#fbbf24' : '#f87171')}">${status}</span>
                    <div style="font-weight:bold; margin-top:5px;">${item.mat} - ${item.desc}</div>
                    <div style="font-size:11px; opacity:0.8;">Vencimento em: ${item.dias} dias</div>
                </div>
                <div style="text-align:right">
                    <div style="font-size:18px; font-weight:900;">${item.qtd} PL</div>
                    <button class="btn btn-retirar" onclick="retirar('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender}', '${item.valFrente}')">RETIRAR</button>
                </div>
            `;
            lista.appendChild(card);
        });
    }

    async function retirar(id, qtdAtual, mat, ender, validade) {
        const n = prompt(`Retirada: ${mat}\nQuantidade? (Disponível: ${qtdAtual})`);
        if(!n || isNaN(n) || n > qtdAtual || n <= 0) return;

        const novaQtd = qtdAtual - parseInt(n);
        const agora = new Date();
        
        try {
            if(novaQtd <= 0) await db.collection("estoque_blocado").doc(id).delete();
            else await db.collection("estoque_blocado").doc(id).update({ qtd: novaQtd });

            await db.collection("movimentacoes_wms").add({
                endereco: ender, material: mat, validade: validade,
                quantidade: "-" + n + " PL", operador: usuarioLogado.nome,
                data: agora.toLocaleDateString('pt-BR'), hora: agora.toLocaleTimeString('pt-BR'),
                timestamp: agora
            });
            alert("Movimentação registrada!");
        } catch(e) { alert("Erro ao salvar."); }
    }

    // --- ADMINISTRAÇÃO (CSV/EXCEL) ---
    async function exportarHistoricoExcel() {
        const snap = await db.collection("movimentacoes_wms").orderBy("timestamp", "desc").limit(500).get();
        const dados = snap.docs.map(doc => {
            const d = doc.data();
            return { "Endereço": d.endereco, "Material": d.material, "Qtd": d.quantidade, "Operador": d.operador, "Data": d.data };
        });
        const ws = XLSX.utils.json_to_sheet(dados);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Movimentacoes");
        XLSX.writeFile(wb, "Historico_WMS.xlsx");
    }

    function importarCSV(event) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const linhas = e.target.result.split("\n").slice(1);
            const batch = db.batch();
            linhas.forEach(l => {
                const c = l.split(";");
                if(c.length >= 8) {
                    const id = c[0].trim() + "_" + c[1].trim();
                    batch.set(db.collection("estoque_blocado").doc(id), {
                        ender: c[0].trim(), mat: c[1].trim(), desc: c[2].trim(),
                        valFrente: c[3].trim(), qtd: parseInt(c[5]) || 0, dias: parseInt(c[7]) || 0
                    });
                }
            });
            await batch.commit();
            alert("Estoque Atualizado!");
            location.reload();
        };
        reader.readAsText(event.target.files[0], 'ISO-8859-1');
    }

    function logout() { 
        auth.signOut();
        localStorage.removeItem('wms_session_v2'); 
        location.reload(); 
    }

    window.onload = () => {
        const s = localStorage.getItem('wms_session_v2');
        if(s) { usuarioLogado = JSON.parse(s); iniciarApp(); }
    };
</script>
</body>
</html>
