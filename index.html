<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WMS FLOW PRO">
    
    <title>WMS FLOW PRO - Sistema Integrado</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0d0d0d; 
            --card: #1a1a1a; 
            --card-hover: #242424;
            --primary: #e50914; 
            --primary-hover: #b80710;
            --critico: #f59e0b; 
            --retido: #ef4444; 
            --verde: #10b981; 
            --text: #ffffff; 
            --text-secondary: #a3a3a3;
            --border: #2d2d2d;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding-bottom: env(safe-area-inset-bottom, 40px); 
            padding-top: env(safe-area-inset-top, 0px);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        #network-status {
            display: none;
            background: var(--critico);
            color: #000;
            text-align: center;
            padding: 6px;
            font-size: 11px;
            font-weight: 800;
            position: sticky;
            top: 0;
            z-index: 1001;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .sidebar { 
            position: fixed; 
            left: -280px; 
            top: 0; 
            width: 280px; 
            height: 100dvh; 
            background: #121212; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1000; 
            padding-top: calc(60px + env(safe-area-inset-top)); 
            border-right: 1px solid var(--border); 
            box-shadow: 15px 0 30px rgba(0,0,0,0.7); 
        }
        .sidebar.active { left: 0; }
        .sidebar button { 
            width: 90%; 
            padding: 14px 20px; 
            background: transparent; 
            border: none; 
            color: var(--text-secondary); 
            text-align: left; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin: 8px auto;
            border-radius: 8px;
            transition: 0.2s;
        }
        .sidebar button:hover { 
            background: rgba(229, 9, 20, 0.1); 
            color: var(--text);
        }

        .header { 
            padding: calc(15px + env(safe-area-inset-top)) 20px 15px 20px; 
            background: rgba(26, 26, 26, 0.85); 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            border-bottom: 1px solid var(--border); 
            position: sticky; 
            top: 0; 
            z-index: 900; 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .menu-btn { 
            background: none; 
            border: 1px solid var(--border); 
            padding: 8px; 
            border-radius: 8px; 
            cursor: pointer; 
            color: white; 
            font-size: 22px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 42px; 
            height: 42px; 
        }
        
        .container { 
            width: 100%;
            max-width: 900px; 
            margin: auto; 
            padding: 16px; 
        }

        .admin-dashboard { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); 
            gap: 12px; 
            margin-bottom: 20px; 
        }
        .stat-box { 
            background: var(--card); 
            padding: 16px; 
            border-radius: 12px; 
            border: 1px solid var(--border);
            border-top: 4px solid var(--primary); 
            text-align: center; 
        }
        .stat-box h5 { margin: 0; font-size: 10px; color: var(--text-secondary); text-transform: uppercase; }
        .stat-box p { margin: 6px 0 0; font-size: 24px; font-weight: 900; color: #fff; }

        .search-area { 
            background: var(--card); 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border);
        }
        input, select { 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background: #0d0d0d; 
            color: white; 
            outline: none; 
            font-family: 'Inter', sans-serif; 
            font-size: 16px; 
            transition: all 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--primary);
        }
        select { 
            cursor: pointer; 
            appearance: none; 
            background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>"); 
            background-repeat: no-repeat; 
            background-position: right 14px center; 
        }
        
        .item-card { 
            background: var(--card); 
            border-radius: 12px; 
            padding: 16px; 
            margin-bottom: 12px; 
            display: flex; 
            flex-direction: row;
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid var(--border);
            border-left: 6px solid #444; 
            gap: 10px;
        }
        
        .badge-ender { background: #fff; color: #000; padding: 4px 6px; border-radius: 4px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .badge-status { color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; margin-left: 4px; text-transform: uppercase; }

        .btn-retirar { 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            padding: 12px 16px; 
            border-radius: 8px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 13px;
            white-space: nowrap;
        }
        
        .btn-admin { 
            background: var(--card); 
            color: #fff; 
            padding: 16px; 
            width: 100%; 
            border-radius: 8px; 
            font-weight: 800; 
            margin-top: 12px; 
            border: 1px solid var(--border); 
            cursor: pointer; 
            text-transform: uppercase; 
            font-size: 13px;
        }
        .btn-excel { background: #107c41; border: none;}

        #login-screen { 
            height: 100dvh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%); 
            padding: 20px;
        }
        .login-box { 
            background: var(--card); 
            padding: 35px 24px; 
            border-radius: 16px; 
            width: 100%;
            max-width: 340px; 
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); 
        }

        .form-container-box {
            background: var(--card); 
            padding: 20px; 
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        #modal-retirada { 
            display:none; 
            position:fixed; 
            top:0; 
            left:0; 
            width:100%; 
            height:100dvh; 
            background:rgba(0,0,0,0.85); 
            z-index:2000; 
            align-items:center; 
            justify-content:center; 
            backdrop-filter: blur(8px); 
            padding: 16px;
        }
        .modal-content { 
            background:var(--card); 
            padding: 24px; 
            border-radius:16px; 
            width:100%; 
            max-width:400px; 
            border:1px solid var(--border); 
        }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 6px; font-weight: bold; }
        
        @media (max-width: 400px) {
            .item-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .item-card > div:last-child {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 10px;
                border-top: 1px solid var(--border);
                padding-top: 10px;
            }
        }

        /* Estilo para a lista de sugestões */
        .autocomplete-items {
            position: absolute;
            border: 1px solid var(--border);
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            max-height: 200px;
            overflow-y: auto;
            border-radius: 0 0 8px 8px;
        }
        .autocomplete-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        .autocomplete-item:hover {
            background-color: var(--card-hover);
        }
        .autocomplete-active {
            background-color: var(--primary) !important;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div id="network-status">⚠️ Modo Offline Ativo. As alterações serão salvas localmente e sincronizadas ao reconectar.</div>

<div id="sidebar" class="sidebar">
    <button id="btn-nav-admin" onclick="navegar('admin')" style="display: none;">📊 DASHBOARD ADMIN</button>
    <button onclick="navegar('retirar')">📦 PESQUISAR / RETIRAR</button>
    <button onclick="navegar('entrada_bloco')">🚙 ENTRADA NO BLOCO</button>
    <button onclick="navegar('abertura_blocado')">🔄 ABERTURA DE BLOCADO</button>
    <button onclick="logout()" style="color: var(--retido); margin-top: 30px; border-top: 1px solid var(--border); border-radius: 0; width: 100%;">🚪 SAIR</button>
</div>

<div id="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; color: var(--primary); margin-top: 0; margin-bottom: 30px; font-weight: 900; letter-spacing: 1px;">WMS FLOW PRO</h2>
        <input type="text" inputmode="decimal" id="login-mat" placeholder="Matrícula" style="margin-bottom:14px;">
        <input type="password" id="login-senha" placeholder="Senha" style="margin-bottom:24px;">
        <button onclick="tentarLogin()" class="btn-retirar" style="width: 100%; font-size: 15px; padding: 14px;">ENTRAR</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div style="flex-grow: 1;">
            <div id="user-name" style="font-weight: 800; font-size: 16px; letter-spacing: -0.3px;"></div>
            <div id="role-label" style="font-size: 10px; color: var(--primary); font-weight: bold; letter-spacing: 1px; margin-top: 2px;"></div>
        </div>
    </div>

    <div class="container">
        <div id="view-admin" style="display: none;">
            <div id="dash-container" class="admin-dashboard">
                <div class="stat-box"><h5>TOTAL PALLETS</h5><p id="st-total">0</p></div>
                <div class="stat-box" style="border-color: var(--critico);"><h5>CRÍTICOS</h5><p id="st-critico">0</p></div>
                <div class="stat-box" style="border-color: var(--retido);"><h5>RETIDOS</h5><p id="st-retido">0</p></div>
            </div>

            <div id="admin-tools-section" style="background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--border);">
                <h3 style="font-size: 12px; color: var(--primary); margin-top: 0; letter-spacing: 1px; font-weight: 800;">GERENCIAMENTO ADMINISTRATIVO</h3>
                <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="importarCSV(event)">
                <button class="btn-admin" onclick="document.getElementById('csv-file').click()" style="border-color: var(--primary); color: #fff;">ALIMENTAR NOVO ESTOQUE (CSV)</button>
                <button class="btn-admin btn-excel" onclick="exportarHistoricoExcel()">SOLICITAR HISTÓRICO (EXCEL)</button>
                <button class="btn-admin" onclick="sincronizarBaseMateriais()" style="background: #2563eb; border: none;">SINCRONIZAR BASE DE MATERIAIS</button>
            </div>
        </div>

        <div id="view-retirar">
            <div class="search-area">
                <input type="text" inputmode="search" id="search-input" placeholder="Pesquisar material ou posição..." oninput="renderizarEstoque()">
            </div>
            <div id="lista-estoque"></div>
        </div>

        <div id="view-entrada_bloco" style="display: none;">
            <div class="form-container-box">
                <h3 style="color: var(--primary); margin-top: 0; text-transform: uppercase; font-weight: 900; letter-spacing: 0.5px; font-size: 18px;">Entrada no Bloco</h3>
                
                <div class="form-group">
                    <label>Origem da Carga</label>
                    <select id="eb-origem">
                        <option value="STAGE">STAGE</option>
                        <option value="RECEBIMENTO">RECEBIMENTO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Endereço Destino (Ex: 205-14)</label>
                    <input type="text" inputmode="text" id="eb-ender" placeholder="Digite o endereço de destino...">
                </div>
                <div class="form-group" style="position: relative;">
                    <label>Código Material</label>
                    <input type="text" inputmode="decimal" id="eb-mat" placeholder="Código..." oninput="puxarDescricaoAutocomplete(this.value, 'eb-desc', 'eb-mat-list')">
                    <div id="eb-mat-list" class="autocomplete-items"></div>
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="eb-desc" readonly style="opacity: 0.4; background: #000;" placeholder="Descrição do material...">
                </div>
                <div class="form-group">
                    <label>Quantidade (Pallets)</label>
                    <input type="text" inputmode="decimal" id="eb-qtd" placeholder="0">
                </div>
                <div class="form-group">
                    <label>Data de Vencimento</label>
                    <input type="date" id="eb-venc" onchange="calcularDias(this.value, 'eb-label-dias')">
                    <p id="eb-label-dias" style="color: var(--critico); font-size: 12px; margin-top: 8px; font-weight: bold;"></p>
                </div>
                <button class="btn-retirar" style="width: 100%; padding: 16px; margin-top: 10px;" onclick="salvarEntradaBloco()">SALVAR ENTRADA</button>
            </div>
        </div>

        <div id="view-abertura_blocado" style="display: none;">
            <div class="form-container-box">
                <h3 style="color: var(--primary); margin-top: 0; text-transform: uppercase; font-weight: 900; letter-spacing: 0.5px; font-size: 18px;">Abertura de Blocado</h3>
                
                <div class="form-group">
                    <label>Endereço Origem (Ex: 201-14)</label>
                    <input type="text" inputmode="text" id="ab-origem" placeholder="Digite a posição de origem..." onchange="carregarDadosOrigemAbertura(this.value)">
                </div>
                <div class="form-group">
                    <label>Código Material</label>
                    <input type="text" id="ab-mat" readonly style="opacity: 0.4; background: #000;" placeholder="Preenchido automaticamente...">
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="ab-desc" readonly style="opacity: 0.4; background: #000;" placeholder="Preenchido automaticamente...">
                </div>
                <div class="form-group">
                    <label>Endereço Destino (Ex: 205-20)</label>
                    <input type="text" inputmode="text" id="ab-destino" placeholder="Digite a nova posição...">
                </div>
                <div class="form-group">
                    <label>Quantidade a Transferir (Pallets)</label>
                    <input type="text" inputmode="decimal" id="ab-qtd" placeholder="Saldo max disponível: 0">
                </div>
                <button class="btn-retirar" style="width: 100%; padding: 16px; margin-top: 10px;" onclick="processarAberturaBlocado()">CONFIRMAR TRANSFERÊNCIA</button>
            </div>
        </div>
    </div>
</div>

<div id="modal-retirada">
    <div class="modal-content">
        <h3 id="modal-titulo" style="margin-top:0; color:var(--primary); font-weight: 900;">Retirar Material</h3>
        <p id="modal-info" style="font-size:13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;"></p>
        
        <div class="form-group">
            <label>Quantidade de Pallets:</label>
            <input type="text" id="modal-input-qtd" inputmode="decimal" placeholder="0" style="font-size:32px; text-align:center; margin:10px 0; border: 2px solid var(--primary); height: 65px; font-weight: 900; color: #fff;">
        </div>
        
        <div class="form-group">
            <label>Tipo de Movimentação (Destino):</label>
            <select id="modal-destino-mov">
                <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                <option value="APANHA">APANHA</option>
                <option value="SEPARAÇÃO">SEPARAÇÃO</option>
            </select>
        </div>

        <div style="display:flex; gap:12px; margin-top:25px;">
            <button onclick="fecharModal()" style="flex:1; padding:14px; background:#2d2d2d; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:13px;">CANCELAR</button>
            <button id="btn-confirmar-modal" style="flex:1; padding:14px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:900; cursor:pointer; font-size:13px;">CONFIRMAR</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    
    const db = firebase.firestore();
    db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });
    db.enablePersistence({ synchronizeTabs: true })
      .catch((err) => {
          if (err.code == 'failed-precondition') {
              console.log("Persistência falhou: Múltiplas abas abertas simultaneamente.");
          } else if (err.code == 'unimplemented') {
              console.log("O navegador não possui suporte para cache de dados.");
          }
      });

    const auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    let estoqueCompleto = [];
    let baseMateriais = [];
    let usuarioLogado = null;
    let diasCalculados = 0;
    let wakeLock = null;
    let itemParaRetirar = null;
    let itemOrigemAbertura = null;

    window.addEventListener('online', atualizarStatusRede);
    window.addEventListener('offline', atualizarStatusRede);

    function atualizarStatusRede() {
        const barraStatus = document.getElementById('network-status');
        if (navigator.onLine) {
            barraStatus.style.display = 'none';
        } else {
            barraStatus.style.display = 'block';
        }
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
    }

    function logout() {
        auth.signOut().then(() => {
            localStorage.removeItem('wms_session');
            location.reload();
        });
    }

    async function activarWakeLock() {
        try { 
            if ('wakeLock' in navigator) { 
                wakeLock = await navigator.wakeLock.request('screen'); 
            } 
        } catch (e) {}
    }

    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible' && usuarioLogado) {
            activarWakeLock();
        }
    });

    async function tentarLogin() {
        const mat = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        const emailMontado = mat.toLowerCase() + "@alb.com";
        
        try {
            await auth.signInWithEmailAndPassword(emailMontado, senha);
            const doc = await db.collection("usuarios_wms").doc(emailMontado).get();
            if (doc.exists) {
                usuarioLogado = doc.data();
                usuarioLogado.email = emailMontado;
                localStorage.setItem('wms_session', JSON.stringify(usuarioLogado));
                iniciarApp();
            } else {
                usuarioLogado = { nome: mat, perfil: "OPERADOR", email: emailMontado };
                localStorage.setItem('wms_session', JSON.stringify(usuarioLogado));
                iniciarApp();
            }
        } catch (e) { 
            if(!navigator.onLine) {
                const session = localStorage.getItem('wms_session');
                if(session) {
                    usuarioLogado = JSON.parse(session);
                    iniciarApp();
                    return;
                }
            }
            alert("Erro de Login. Verifique os dados inseridos ou a conexão."); 
        }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        
        const isAdmin = usuarioLogado.perfil && usuarioLogado.perfil.toUpperCase() === "ADMIN";
        document.getElementById('role-label').innerText = isAdmin ? "PERFIL: ADMINISTRADOR" : "PERFIL: OPERADOR";
        document.getElementById('btn-nav-admin').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('admin-tools-section').style.display = isAdmin ? 'block' : 'none';

        atualizarStatusRede();
        conectarFirebase();
        carregarBaseMateriais();
        activarWakeLock();
        navegar(isAdmin ? 'admin' : 'retirar');
    }

    function navegar(tela) {
        ['admin', 'retirar', 'entrada_bloco', 'abertura_blocado'].forEach(t => {
            const el = document.getElementById('view-' + t);
            if(el) el.style.display = 'none';
        });
        document.getElementById('view-' + tela).style.display = 'block';
        document.getElementById('sidebar').classList.remove('active');
    }

    function conectarFirebase() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if(usuarioLogado && usuarioLogado.perfil && usuarioLogado.perfil.toUpperCase() === "ADMIN") atualizarEstatisticas();
            renderizarEstoque();
        }, error => {
            console.log("Erro snapshot:", error);
        });
    }

    async function carregarBaseMateriais() {
        // Tenta carregar do cache local primeiro
        const cache = localStorage.getItem('base_materiais');
        if (cache) {
            baseMateriais = JSON.parse(cache);
        }
        
        // Se estiver online, tenta atualizar do Firestore
        if (navigator.onLine) {
            try {
                const snap = await db.collection("base_materiais").get();
                if (!snap.empty) {
                    baseMateriais = snap.docs.map(doc => doc.data());
                    localStorage.setItem('base_materiais', JSON.stringify(baseMateriais));
                }
            } catch (e) { console.log("Erro ao carregar base remota:", e); }
        }
    }

    function atualizarEstatisticas() {
        document.getElementById('st-total').innerText = estoqueCompleto.reduce((a, b) => a + (parseInt(b.qtd) || 0), 0);
        document.getElementById('st-critico').innerText = estoqueCompleto.filter(i => i.dias > 30 && i.dias <= 60).length;
        document.getElementById('st-retido').innerText = estoqueCompleto.filter(i => i.dias <= 30).length;
    }

    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase().trim();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';
        if (termo.length === 0) return;

        const isAdmin = usuarioLogado && usuarioLogado.perfil && usuarioLogado.perfil.toUpperCase() === "ADMIN";

        let filtrados = estoqueCompleto.filter(i => {
            const matString = i.mat ? i.mat.toString().toLowerCase() : "";
            const enderString = i.ender ? i.ender.toString().toLowerCase() : "";
            if (/^\d+$/.test(termo)) {
                return matString === termo;
            } else {
                return enderString.includes(termo);
            }
        });

        if (!isAdmin) {
            filtrados = filtrados.filter(item => item.dias > 30);
        }

        if (filtrados.length === 0) return;

        filtrados.sort((a, b) => (parseInt(a.dias) || 0) - (parseInt(b.dias) || 0));

        filtrados.forEach(item => {
            let statusTexto = "";
            let statusCor = "";
            if (item.dias <= 30) {
                statusTexto = item.dias < 0 ? "VENCIDO / RETIDO" : "RETIDO";
                statusCor = "var(--retido)";
            } else if (item.dias <= 60) {
                statusTexto = "CRÍTICO";
                statusCor = "var(--critico)";
            } else {
                statusTexto = "DATA BOA";
                statusCor = "var(--verde)";
            }

            const card = document.createElement('div');
            card.className = `item-card`;
            card.style.borderLeftColor = statusCor;
            card.innerHTML = `
                <div>
                    <span class="badge-ender">${item.ender}</span>
                    <span class="badge-status" style="background-color: ${statusCor}">${statusTexto}</span>
                    <div style="font-weight:900; font-size:20px; margin-top:8px; letter-spacing:-0.5px;">${item.mat}</div>
                    <div style="font-size:12px; color:var(--text-secondary); margin-top:2px;">${item.desc || "Sem descrição"}</div>
                    <div style="font-size:12px; margin-top:8px;">Vence em: <b style="color: ${statusCor}">${item.dias} dias</b></div>
                </div>
                <div>
                    <div style="font-size:24px; font-weight:900; margin-bottom:8px; color: #fff;">${item.qtd} <span style="font-size:14px; color:var(--text-secondary)">PL</span></div>
                    <button class="btn-retirar" onclick="retirarMaterial('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender}', '${item.valFrente}')">RETIRAR</button>
                </div>`;
            lista.appendChild(card);
        });
    }

    function puxarDescricaoAutocomplete(val, inputDescId, listId) {
        const list = document.getElementById(listId);
        list.innerHTML = '';
        if (!val) return;

        const matches = baseMateriais.filter(m => m.mat.toString().startsWith(val)).slice(0, 5);
        
        matches.forEach(m => {
            const div = document.createElement('div');
            div.className = 'autocomplete-item';
            div.innerHTML = `<strong>${m.mat}</strong> - ${m.desc}`;
            div.onclick = () => {
                document.getElementById('eb-mat').value = m.mat;
                document.getElementById(inputDescId).value = m.desc;
                list.innerHTML = '';
            };
            list.appendChild(div);
        });

        // Se houver um match exato, preenche a descrição
        const exact = baseMateriais.find(m => m.mat.toString() === val.trim());
        if (exact) {
            document.getElementById(inputDescId).value = exact.desc;
        } else {
            document.getElementById(inputDescId).value = "NOVO MATERIAL";
        }
    }

    // Fecha a lista de autocomplete quando clica fora
    document.addEventListener('click', function (e) {
        if (e.target.id !== 'eb-mat') {
            document.getElementById('eb-mat-list').innerHTML = '';
        }
    });

    function retirarMaterial(id, qtdAtual, mat, ender, validade) {
        itemParaRetirar = { id, qtdAtual, mat, ender, validade };
        document.getElementById('modal-titulo').innerText = `Retirar de: ${mat}`;
        document.getElementById('modal-info').innerHTML = `Endereço: <b>${ender}</b> | Saldo Atual: <b style="color:#fff">${qtdAtual} PL</b>`;
        document.getElementById('modal-input-qtd').value = '';
        document.getElementById('modal-retirada').style.display = 'flex';
        setTimeout(() => document.getElementById('modal-input-qtd').focus(), 150);
        document.getElementById('btn-confirmar-modal').onclick = processarRetirada;
    }

    function fecharModal() {
        document.getElementById('modal-retirada').style.display = 'none';
        itemParaRetirar = null;
    }

    async function processarRetirada() {
        const inputQtd = document.getElementById('modal-input-qtd').value;
        const destinoMov = document.getElementById('modal-destino-mov').value;
        const v = parseInt(inputQtd);
        if (isNaN(v) || v <= 0) return alert("Digite uma quantidade válida!");
        if (v > itemParaRetirar.qtdAtual) return alert("Quantidade solicitada maior que o saldo!");

        const { id, qtdAtual, mat, ender, validade } = itemParaRetirar;
        try {
            if (v === qtdAtual) { db.collection("estoque_blocado").doc(id).delete(); } 
            else { db.collection("estoque_blocado").doc(id).update({ qtd: qtdAtual - v }); }
            registrarMovimentacao(ender, mat, validade, `-${v} PL (Retirada)`, destinoMov);
            fecharModal();
            alert(navigator.onLine ? "Retirada concluída com sucesso!" : "Retirada salva localmente (Offline)!");
        } catch (e) { alert("Erro ao processar retirada."); }
    }

    async function salvarEntradaBloco() {
        const origen = document.getElementById('eb-origem').value;
        const ender = document.getElementById('eb-ender').value.toUpperCase().trim();
        const mat = document.getElementById('eb-mat').value.trim();
        const qtd = parseInt(document.getElementById('eb-qtd').value);
        const inputVenc = document.getElementById('eb-venc').value;
        
        if(!ender || !mat || isNaN(qtd) || !inputVenc) return alert("Preencha todos os campos da Entrada!");
        
        const dataV = inputVenc.split('-').reverse().join('/');
        const ocupante = estoqueCompleto.find(i => i.ender === ender);

        if (ocupante) {
            if (ocupante.mat === mat) {
                if (confirm(`Endereço ocupado pelo mesmo material. Somar +${qtd} PL?`)) {
                    db.collection("estoque_blocado").doc(ocupante.id).update({ qtd: ocupante.qtd + qtd });
                    registrarMovimentacao(ender, mat, dataV, `+${qtd} PL (Soma Manual)`, `ENTRADA VIA ${origen}`);
                    alert(navigator.onLine ? "Atualizado com sucesso!" : "Atualizado localmente!");
                    limparFormularioEntrada();
                    navegar('retirar');
                }
                return;
            } else { return alert(`BLOQUEADO! O endereço ${ender} já está ocupado por: ${ocupante.mat}`); }
        }

        const desc = document.getElementById('eb-desc').value;
        db.collection("estoque_blocado").add({ ender, mat, qtd, dias: diasCalculados, valFrente: dataV, desc });
        registrarMovimentacao(ender, mat, dataV, `+${qtd} PL (Entrada)`, `ENTRADA VIA ${origen}`);
        alert(navigator.onLine ? "Entrada registrada!" : "Entrada registrada localmente!");
        limparFormularioEntrada();
        navegar('retirar');
    }

    function limparFormularioEntrada() {
        document.getElementById('eb-ender').value = '';
        document.getElementById('eb-mat').value = '';
        document.getElementById('eb-desc').value = '';
        document.getElementById('eb-qtd').value = '';
        document.getElementById('eb-venc').value = '';
        document.getElementById('eb-label-dias').innerText = '';
    }

    function carregarDadosOrigemAbertura(enderOrigem) {
        const item = estoqueCompleto.find(i => i.ender.toLowerCase() === enderOrigem.toLowerCase().trim());
        if (item) {
            itemOrigemAbertura = item;
            document.getElementById('ab-mat').value = item.mat;
            document.getElementById('ab-desc').value = item.desc;
            document.getElementById('ab-qtd').placeholder = `Saldo max disponível: ${item.qtd}`;
        } else {
            itemOrigemAbertura = null;
            document.getElementById('ab-mat').value = '';
            document.getElementById('ab-desc').value = '';
            document.getElementById('ab-qtd').placeholder = 'Posição vazia';
            alert("Nenhum material ativo nesta posição.");
        }
    }

    async function processarAberturaBlocado() {
        const enderDestino = document.getElementById('ab-destino').value.toUpperCase().trim();
        const qtdTransferir = parseInt(document.getElementById('ab-qtd').value);

        if(!itemOrigemAbertura) return alert("Defina origem válida!");
        if(isNaN(qtdTransferir) || qtdTransferir <= 0 || qtdTransferir > itemOrigemAbertura.qtd) return alert("Quantidade inválida!");
        if(!enderDestino) return alert("Especifique destino!");

        try {
            const ocupanteDestino = estoqueCompleto.find(i => i.ender === enderDestino);
            if (ocupanteDestino && ocupanteDestino.mat !== itemOrigemAbertura.mat) return alert(`Destino ocupado por: ${ocupanteDestino.mat}`);

            if (qtdTransferir === itemOrigemAbertura.qtd) { db.collection("estoque_blocado").doc(itemOrigemAbertura.id).delete(); } 
            else { db.collection("estoque_blocado").doc(itemOrigemAbertura.id).update({ qtd: itemOrigemAbertura.qtd - qtdTransferir }); }

            if (ocupanteDestino && ocupanteDestino.mat === itemOrigemAbertura.mat) {
                db.collection("estoque_blocado").doc(ocupanteDestino.id).update({ qtd: ocupanteDestino.qtd + qtdTransferir });
            } else {
                db.collection("estoque_blocado").add({ ender: enderDestino, mat: itemOrigemAbertura.mat, desc: itemOrigemAbertura.desc, qtd: qtdTransferir, dias: itemOrigemAbertura.dias, valFrente: itemOrigemAbertura.valFrente });
            }

            registrarMovimentacao(itemOrigemAbertura.ender, itemOrigemAbertura.mat, itemOrigemAbertura.valFrente, `-${qtdTransferir} PL`, `PARA ${enderDestino}`);
            registrarMovimentacao(enderDestino, itemOrigemAbertura.mat, itemOrigemAbertura.valFrente, `+${qtdTransferir} PL`, `DE ${itemOrigemAbertura.ender}`);
            alert(navigator.onLine ? "Transferência executada!" : "Transferência salva localmente!");
            navegar('retirar');
        } catch (error) { alert("Erro ao processar transferência."); }
    }

    function calcularDias(data, labelId) {
        diasCalculados = Math.ceil((new Date(data) - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById(labelId).innerText = `Vencimento em ${diasCalculados} dias`;
    }

    async function registrarMovimentacao(ender, mat, val, qtd, fluxoInfo) {
        const agora = new Date();
        db.collection("movimentacoes_wms").add({ endereco: ender, material: mat, validade: val, quantidade: qtd, fluxo: fluxoInfo || "N/A", login: usuarioLogado.email, data: agora.toLocaleDateString('pt-BR'), hora: agora.toLocaleTimeString('pt-BR'), timestamp: agora });
    }

    async function exportarHistoricoExcel() {
        if(!navigator.onLine) return alert("Necessita internet ativa.");
        try {
            const snap = await db.collection("movimentacoes_wms").orderBy("timestamp", "desc").get();
            const dados = snap.docs.map(doc => { const d = doc.data(); return { "Endereço": d.endereco, "Material": d.material, "Validade": d.validade, "Qtd": d.quantidade, "Ação": d.fluxo, "Login": d.login, "Data": d.data, "Hora": d.hora }; });
            const ws = XLSX.utils.json_to_sheet(dados);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Histórico");
            XLSX.writeFile(wb, `Historico_WMS_${new Date().getTime()}.xlsx`);
        } catch (error) { alert("Erro na exportação."); }
    }

    async function importarCSV(event) {
        if(!navigator.onLine) return alert("Exige internet ativa.");
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const linhas = e.target.result.split(/\r?\n/).filter(l => l.trim() !== "").slice(1);
                if (!confirm(`Apagar estoque e carregar ${linhas.length} itens?`)) return;
                const snapshot = await db.collection("estoque_blocado").get();
                if (!snapshot.empty) {
                    let batch = db.batch();
                    snapshot.docs.forEach((doc, i) => { batch.delete(doc.ref); if((i+1)%400===0) { batch.commit(); batch = db.batch(); } });
                    await batch.commit();
                }
                let batch = db.batch();
                linhas.forEach((linha, i) => {
                    const c = linha.split(";");
                    if (c.length >= 6) {
                        batch.set(db.collection("estoque_blocado").doc(), { ender: c[0].trim(), mat: c[1].trim(), desc: c[2].trim(), valFrente: c[3].trim(), qtd: parseInt(c[5].replace(/\D/g, '')) || 0, dias: parseInt(c[7].replace(/\D/g, '')) || 0 });
                        if((i+1)%400===0) { batch.commit(); batch = db.batch(); }
                    }
                });
                await batch.commit();
                alert("Sucesso!");
            } catch (error) { alert("Erro na importação."); }
        };
        reader.readAsText(file);
    }

    // Função para o Administrador subir a base de materiais do Excel para o Firestore
    async function sincronizarBaseMateriais() {
        if(!navigator.onLine) return alert("Necessita internet ativa.");
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xlsx, .xls';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = new Uint8Array(ev.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    
                    if(!confirm(`Deseja atualizar a base com ${json.length} materiais?`)) return;

                    // Limpa base antiga (opcional, ou faz merge)
                    // Para simplicidade aqui, vamos apenas adicionar/atualizar
                    let batch = db.batch();
                    let count = 0;
                    for(const item of json) {
                        const mat = item['Cód. Material'];
                        if(mat) {
                            const ref = db.collection("base_materiais").doc(mat.toString());
                            batch.set(ref, {
                                mat: mat,
                                desc: item['Descrição'] || '',
                                qtd_base: item['Quantidade'] || 0,
                                categoria: item['Categoria'] || '',
                                vasilhame: item['Vasilhame'] || '',
                                lastro: item['Lastro'] || null,
                                camada: item['Camada'] || null
                            });
                            count++;
                            if(count % 400 === 0) { await batch.commit(); batch = db.batch(); }
                        }
                    }
                    await batch.commit();
                    alert("Base de materiais sincronizada com sucesso!");
                    carregarBaseMateriais();
                } catch (err) { alert("Erro ao processar Excel."); }
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    }

    window.onload = function() {
        const session = localStorage.getItem('wms_session');
        if (session) {
            usuarioLogado = JSON.parse(session);
            iniciarApp();
        }
    };
</script>
