<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Gestão de Blocado</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0f1e; --card: #161e31; --primary: #00d2ff; --critico: #fbbf24; --retido: #f87171; --verde: #4ade80; --text: #f8fafc; --accent: #7c3aed; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1000; padding-top: 60px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        .sidebar.active { left: 0; }
        .sidebar button { width: 100%; padding: 15px; background: transparent; border: none; color: white; text-align: left; font-size: 16px; cursor: pointer; border-bottom: 1px solid #2d3748; }

        .header { padding: 15px 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 900; }
        .menu-btn { background: #161e31; border: 1px solid #2d3748; padding: 10px; border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
        .menu-btn div { width: 20px; height: 2px; background: white; }

        .container { max-width: 900px; margin: auto; padding: 15px; }
        
        .search-container { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .search-container input { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #2d3748; background: #0a0f1e; color: white; font-size: 16px; box-sizing: border-box; }

        .item-card { background: #161e31; border-radius: 8px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-start; border-left: 5px solid var(--verde); }
        .item-critico { border-left-color: var(--critico); }
        .item-retido { border-left-color: var(--retido); }
        
        .badge-ender { background: #00d2ff; color: #000; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 900; text-transform: uppercase; }
        .badge-status { background: var(--critico); color: #000; padding: 3px 10px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-left: 10px; }
        
        .mat-code { font-size: 18px; font-weight: 900; margin-top: 10px; display: block; }
        .mat-desc { font-size: 12px; color: #cbd5e1; margin-top: 4px; text-transform: uppercase; font-weight: 700; }
        .mat-venc { font-size: 12px; color: #94a3b8; margin-top: 8px; }

        .qty-box { text-align: right; }
        .qty-val { font-size: 24px; font-weight: 900; color: #f8fafc; }
        .btn-retirar { background: #00d2ff; color: #000; border: none; padding: 8px 20px; border-radius: 5px; font-weight: 900; cursor: pointer; margin-top: 12px; font-size: 12px; }

        /* Estilo Formulário */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #94a3b8; }
        .form-group input { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; }
        .btn-save { width: 100%; padding: 15px; background: #7c3aed; color: white; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <button onclick="mudarTela('retirar')">📦 RETIRAR</button>
    <button onclick="mudarTela('abastecer')">📥 ABASTECER</button>
    <button onclick="logout()">🚪 SAIR</button>
</div>

<div id="app-screen">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()"><div></div><div></div><div></div></button>
        <div style="flex-grow: 1;">
            <div style="font-size: 14px; font-weight: 800;">Gabriel Ferreira Souto</div>
            <div id="page-title" style="font-size: 10px; color: var(--primary); font-weight: bold;">ESTOQUE</div>
        </div>
    </div>

    <div class="container">
        <div id="tela-retirar">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Pesquisar material ou posição..." oninput="renderizarEstoque()">
            </div>
            <div id="lista-estoque"></div>
        </div>

        <div id="tela-abastecer" style="display: none;">
            <h3 style="color: var(--primary);">Abastecer Blocado</h3>
            <div class="form-group">
                <label>Endereço (Ex: A-01-01)</label>
                <input type="text" id="in-ender">
            </div>
            <div class="form-group">
                <label>Código Material</label>
                <input type="text" id="in-mat" oninput="buscarDescricao(this.value)">
            </div>
            <div class="form-group">
                <label>Descrição do Produto</label>
                <input type="text" id="in-desc" readonly style="opacity: 0.6;">
            </div>
            <div class="form-group">
                <label>Quantidade de Pallets</label>
                <input type="number" id="in-qtd">
            </div>
            <div class="form-group">
                <label>Vencimento</label>
                <input type="date" id="in-venc" onchange="calcularDias(this.value)">
                <p id="label-dias" style="font-size: 11px; color: var(--critico);"></p>
            </div>
            <button class="btn-save" onclick="salvarAbastecimento()">SALVAR ENTRADA</button>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let estoqueCompleto = [];
    let diasCalculados = 0;

    db.collection("estoque_blocado").onSnapshot(snap => {
        estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderizarEstoque();
    });

    // --- LÓGICA DE FILTRO E MINIMIZAÇÃO ---
    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase().trim();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';

        // REQUISITO: Minimizado por padrão (só aparece se pesquisar)
        if (termo.length === 0) return;

        // 1. Filtrar o que combina com a busca
        let resultadosBusca = estoqueCompleto.filter(i => 
            i.mat.toLowerCase().includes(termo) || i.ender.toLowerCase().includes(termo)
        );

        // 2. Identificar se existe algum material CRÍTICO (<= 60 dias) no que foi filtrado
        let temCritico = resultadosBusca.some(i => i.dias <= 60);

        // 3. Regra de Bloqueio: Se tem crítico, esconde os bons. Se não tem, mostra os bons.
        let exibir;
        if (temCritico) {
            exibir = resultadosBusca.filter(i => i.dias <= 60);
        } else {
            exibir = resultadosBusca;
        }

        // Ordenar por menor data (FEFO)
        exibir.sort((a, b) => a.dias - b.dias);

        exibir.forEach(item => {
            const critico = item.dias <= 60;
            const retido = item.dias <= 30;
            const card = document.createElement('div');
            card.className = `item-card ${retido ? 'item-retido' : (critico ? 'item-critico' : '')}`;
            
            card.innerHTML = `
                <div>
                    <span class="badge-ender">${item.ender}</span>
                    ${critico ? '<span class="badge-status">DATA CRÍTICA</span>' : ''}
                    <span class="mat-code">${item.mat}</span>
                    <div class="mat-desc">${item.desc}</div>
                    <div class="mat-venc">Vence em: ${item.dias} dias (${item.valFrente})</div>
                </div>
                <div class="qty-box">
                    <div class="qty-val">${item.qtd} PL</div>
                    <button class="btn-retirar" onclick="executarRetirada('${item.id}', ${item.qtd}, '${item.mat}')">RETIRAR</button>
                </div>
            `;
            lista.appendChild(card);
        });
    }

    // --- ABASTECIMENTO ---
    async function salvarAbastecimento() {
        const ender = document.getElementById('in-ender').value.toUpperCase().trim();
        const mat = document.getElementById('in-mat').value.trim();
        const qtd = parseInt(document.getElementById('in-qtd').value);
        const dataV = document.getElementById('in-venc').value.split('-').reverse().join('/');

        if(!ender || !mat || isNaN(qtd)) return alert("Preencha os campos!");

        const existente = estoqueCompleto.find(i => i.ender === ender);
        if(existente) {
            if(existente.mat === mat) {
                if(confirm("Mesmo material. Somar saldo e atualizar data?")) {
                    await db.collection("estoque_blocado").doc(existente.id).update({
                        qtd: existente.qtd + qtd,
                        valFrente: dataV,
                        dias: diasCalculados
                    });
                    limparForm();
                }
                return;
            } else return alert("Endereço ocupado!");
        }

        await db.collection("estoque_blocado").add({
            ender, mat, qtd, dias: diasCalculados, valFrente: dataV,
            desc: document.getElementById('in-desc').value || "PRODUTO"
        });
        limparForm();
    }

    async function executarRetirada(id, qtd, mat) {
        const n = prompt(`Retirar de ${mat}. Quantos PL? (Saldo: ${qtd})`);
        if(!n) return;
        const v = parseInt(n);
        if(v > 0 && v <= qtd) {
            if(v === qtd) await db.collection("estoque_blocado").doc(id).delete();
            else await db.collection("estoque_blocado").doc(id).update({ qtd: qtd - v });
        }
    }

    // --- AUXILIARES ---
    function buscarDescricao(cod) {
        const item = estoqueCompleto.find(i => i.mat === cod);
        document.getElementById('in-desc').value = item ? item.desc : "";
    }

    function calcularDias(data) {
        const d = Math.ceil((new Date(data) - new Date()) / (1000 * 60 * 60 * 24));
        diasCalculados = d;
        document.getElementById('label-dias').innerText = `Vencimento em ${d} dias`;
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    
    function mudarTela(tela) {
        document.getElementById('tela-retirar').style.display = tela === 'retirar' ? 'block' : 'none';
        document.getElementById('tela-abastecer').style.display = tela === 'abastecer' ? 'block' : 'none';
        toggleMenu();
    }

    function limparForm() {
        alert("Salvo!");
        document.querySelectorAll('input').forEach(i => i.value = "");
        mudarTela('retirar');
    }

    function logout() { location.reload(); }
</script>
</body>
</html>
