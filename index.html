<style>
:root{
    --bg:#050505;
    --bg-secondary:#0f0f0f;

    --card:#121212;
    --card-hover:#1a1a1a;

    --primary:#ff1e3c;
    --primary-dark:#b80024;

    --critico:#ffb020;
    --retido:#ff4d4d;
    --verde:#22c55e;

    --text:#f5f5f5;
    --text-soft:#9ca3af;

    --border:rgba(255,255,255,0.08);

    --shadow:
        0 10px 30px rgba(0,0,0,0.45);

    --radius:18px;
}

*{
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:
        radial-gradient(circle at top right, rgba(255,0,43,0.12), transparent 25%),
        linear-gradient(135deg,#050505 0%,#0d0d0d 100%);
    color:var(--text);
    margin:0;
    padding-bottom:30px;
}

/* ===== SIDEBAR ===== */

.sidebar{
    position:fixed;
    left:-250px;
    top:0;
    width:250px;
    height:100%;
    background:rgba(10,10,10,0.98);
    backdrop-filter:blur(14px);
    transition:0.35s ease;
    z-index:1000;
    padding-top:70px;
    border-right:1px solid var(--border);
    box-shadow:var(--shadow);
}

.sidebar.active{
    left:0;
}

.sidebar button{
    width:100%;
    padding:16px 18px;
    background:transparent;
    border:none;
    color:white;
    text-align:left;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,0.04);
    font-weight:700;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:12px;
    transition:0.25s;
}

.sidebar button:hover{
    background:rgba(255,30,60,0.12);
    padding-left:24px;
    color:#fff;
}

/* ===== HEADER ===== */

.header{
    padding:16px 22px;
    background:rgba(10,10,10,0.92);
    backdrop-filter:blur(12px);

    display:flex;
    align-items:center;
    gap:15px;

    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;
    z-index:900;
}

.menu-btn{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);

    border-radius:14px;

    cursor:pointer;

    color:white;
    font-size:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    width:46px;
    height:46px;

    transition:0.25s;
}

.menu-btn:hover{
    background:var(--primary);
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(255,30,60,0.35);
}

.container{
    max-width:1200px;
    margin:auto;
    padding:22px;
}

/* ===== DASHBOARD ===== */

.admin-dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:16px;
    margin-bottom:22px;
}

.stat-box{
    background:
        linear-gradient(145deg,#171717,#0d0d0d);

    padding:20px;

    border-radius:var(--radius);

    border:1px solid rgba(255,255,255,0.05);

    text-align:center;

    position:relative;
    overflow:hidden;

    box-shadow:var(--shadow);

    transition:0.25s;
}

.stat-box:hover{
    transform:translateY(-4px);
}

.stat-box::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:4px;
    background:linear-gradient(90deg,var(--primary),#ff5f78);
}

.stat-box h5{
    margin:0;
    font-size:11px;
    opacity:0.7;
    text-transform:uppercase;
    letter-spacing:1px;
}

.stat-box p{
    margin:12px 0 0;
    font-size:34px;
    font-weight:900;
}

/* ===== SEARCH ===== */

.search-area{
    background:rgba(18,18,18,0.95);

    padding:18px;

    border-radius:22px;

    margin-bottom:18px;

    border:1px solid rgba(255,255,255,0.04);

    box-shadow:var(--shadow);
}

/* ===== INPUTS ===== */

input,
select{
    width:100%;
    padding:14px 16px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,0.08);

    background:#0c0c0c;
    color:white;

    box-sizing:border-box;

    outline:none;

    font-family:'Inter',sans-serif;

    transition:0.25s;
}

input:focus,
select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(255,30,60,0.12);
    background:#151515;
}

select{
    cursor:pointer;
}

/* ===== ITEM CARD ===== */

.item-card{
    background:
        linear-gradient(145deg,#171717,#101010);

    border-radius:22px;

    padding:18px;

    margin-bottom:14px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-left:6px solid var(--primary);

    border:1px solid rgba(255,255,255,0.04);

    box-shadow:var(--shadow);

    transition:0.25s;
}

.item-card:hover{
    transform:translateY(-4px);
    background:var(--card-hover);
}

.badge-ender{
    background:
        linear-gradient(90deg,var(--primary),#ff5870);

    color:#fff;

    padding:5px 10px;

    border-radius:999px;

    font-size:11px;
    font-weight:900;

    letter-spacing:0.5px;
}

.badge-status{
    color:#000;

    padding:5px 10px;

    border-radius:999px;

    font-size:10px;
    font-weight:900;

    margin-left:8px;

    text-transform:uppercase;
}

/* ===== BUTTONS ===== */

.btn-retirar{
    background:
        linear-gradient(90deg,var(--primary),#ff5870);

    color:white;

    border:none;

    padding:12px 18px;

    border-radius:14px;

    font-weight:900;

    cursor:pointer;

    transition:0.25s;

    box-shadow:
        0 10px 20px rgba(255,30,60,0.25);
}

.btn-retirar:hover{
    transform:translateY(-2px);
    box-shadow:
        0 14px 28px rgba(255,30,60,0.4);
}

.btn-admin{
    background:
        linear-gradient(90deg,#1f1f1f,#2d2d2d);

    color:white;

    padding:15px;

    width:100%;

    border-radius:16px;

    font-weight:900;

    margin-top:12px;

    border:1px solid rgba(255,255,255,0.05);

    cursor:pointer;

    text-transform:uppercase;

    transition:0.25s;
}

.btn-admin:hover{
    background:
        linear-gradient(90deg,var(--primary-dark),var(--primary));
}

.btn-excel{
    background:
        linear-gradient(90deg,#107c41,#16a34a);
}

/* ===== LOGIN ===== */

#login-screen{
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle, rgba(255,0,43,0.15) 0%, transparent 30%),
        linear-gradient(135deg,#050505,#0d0d0d);
}

.login-box{
    background:rgba(15,15,15,0.96);

    padding:35px;

    border-radius:28px;

    width:340px;

    border:1px solid rgba(255,255,255,0.05);

    box-shadow:
        0 25px 60px rgba(0,0,0,0.55);
}

.login-box h2{
    text-align:center;

    color:var(--primary);

    margin-bottom:28px;

    font-size:30px;
    font-weight:900;

    letter-spacing:1px;
}

/* ===== MODAL ===== */

#modal-retirada{
    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.85);

    z-index:2000;

    align-items:center;
    justify-content:center;

    backdrop-filter:blur(8px);
}

.modal-content{
    background:#111;

    padding:28px;

    border-radius:24px;

    width:92%;
    max-width:430px;

    border:1px solid rgba(255,255,255,0.05);

    box-shadow:
        0 25px 60px rgba(0,0,0,0.6);
}

/* ===== FORM ===== */

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;

    font-size:11px;

    color:var(--text-soft);

    text-transform:uppercase;

    margin-bottom:7px;

    font-weight:700;

    letter-spacing:1px;
}

/* ===== MOBILE ===== */

@media(max-width:768px){

    .container{
        padding:16px;
    }

    .item-card{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .item-card > div:last-child{
        width:100%;
    }

    .btn-retirar{
        width:100%;
    }

    .login-box{
        width:92%;
    }
}

input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
}

input[type=number]{
    -moz-appearance:textfield;
}
</style>
