<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Sistema Integrado</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0a0f1e; 
            --card: #161e31; 
            --primary: #00d2ff; 
            --critico: #fbbf24; 
            --retido: #f87171; 
            --verde: #4ade80; 
            --text: #f8fafc; 
            --purple: #7c3aed;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1000; padding-top: 60px; border-right: 1px solid #2d3748; }
        .sidebar.active { left: 0; }
        .sidebar button { width: 100%; padding: 15px; background: transparent; border: none; color: white; text-align: left; cursor: pointer; border-bottom: 1px solid #2d3748; font-weight: bold; }

        .header { padding: 15px 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 900; }
        .menu-btn { background: none; border: 1px solid #444; padding: 8px; border-radius: 5px; cursor: pointer; color: white; }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        .search-area { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; margin-bottom: 10px; }
        
        .btn-admin { background: var(--verde); color: #000; padding: 15px; width: 100%; border-radius: 8px; font-weight: 900; margin-top: 10px; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-excel { background: #107c41; color: white; }

        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-box { background: var(--card); padding: 30px; border-radius: 15px; width: 320px; }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <button onclick="navegar('admin')">📊 DASHBOARD ADMIN</button>
    <button onclick="navegar('retirar')">📦 PESQUISAR / RETIRAR</button>
    <button onclick="navegar('abastecer')">📥 ENTRADA NO BLOCO</button>
    <button onclick="navegar('transferir')">🔄 ABERTURA DE BLOCADO</button>
    <button onclick="logout()" style="color: var(--retido);">🚪 SAIR</button>
</div>

<div id="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; color: var(--primary);">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula">
        <input type="password" id="login-senha" placeholder="Senha">
        <button onclick="tentarLogin()" class="btn-admin" style="background: var(--primary);">ENTRAR</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div>
            <div id="user-name" style="font-weight: 800;"></div>
            <div id="role-label" style="font-size: 10px; color: var(--primary);"></div>
        </div>
    </div>

    <div class="container">
        <div id="view-abastecer" style="display: none;">
            <div style="background: var(--card); padding: 25px; border-radius: 12px;">
                <h3 style="color: var(--primary); margin-top: 0;">ENTRADA NO BLOCO</h3>
                <label style="font-size: 11px;">ORIGEM DA CARGA</label>
                <select id="in-origem">
                    <option value="RECEBIMENTO">RECEBIMENTO</option>
                    <option value="STAGE">STAGE</option>
                </select>
                <input type="text" id="in-ender" placeholder="ENDEREÇO DESTINO (Ex: 205-14)">
                <input type="text" id="in-mat" placeholder="CÓDIGO MATERIAL">
                <input type="text" id="in-desc" placeholder="DESCRIÇÃO">
                <input type="number" id="in-qtd" placeholder="QUANTIDADE (PALLETS)">
                <input type="date" id="in-venc">
                <button class="btn-admin" style="background: var(--purple); color: white;" onclick="salvarEntrada()">SALVAR ENTRADA</button>
            </div>
        </div>

        <div id="view-admin" style="display: none;">
            <div style="background: var(--card); padding: 20px; border-radius: 12px; text-align: center;">
                <h3 style="color: var(--primary);">ADMINISTRAÇÃO</h3>
                <button class="btn-admin btn-excel" onclick="exportarHistoricoExcel()">📄 BAIXAR HISTÓRICO (EXCEL)</button>
            </div>
        </div>

        <div id="view-retirar"> <p>Tela de Pesquisa/Retirada ativa.</p> </div>
        <div id="view-transferir" style="display: none;"> <p>Tela de Abertura de Blocado ativa.</p> </div>
    </div>
</div>

<script>
    // Configurações Firebase (Use as suas credenciais aqui)
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let usuarioLogado = null;

    // Login e Navegação
    async function tentarLogin() {
        const mat = document.getElementById('login-mat').value;
        const senha = document.getElementById('login-senha').value;
        try {
            await auth.signInWithEmailAndPassword(mat + "@alb.com", senha);
            usuarioLogado = { nome: mat, perfil: "ADMIN" }; // Simulação
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('user-name').innerText = mat;
            navegar('abastecer');
        } catch (e) { alert("Erro de Login"); }
    }

    function navegar(tela) {
        ['admin', 'retirar', 'abastecer', 'transferir'].forEach(t => {
            document.getElementById('view-' + t).style.display = 'none';
        });
        document.getElementById('view-' + tela).style.display = 'block';
        toggleMenu();
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }

    // Salvar Entrada e Registrar Histórico
    async function salvarEntrada() {
        const dados = {
            origem: document.getElementById('in-origem').value,
            ender: document.getElementById('in-ender').value,
            mat: document.getElementById('in-mat').value,
            desc: document.getElementById('in-desc').value,
            qtd: document.getElementById('in-qtd').value,
            validade: document.getElementById('in-venc').value,
            operador: usuarioLogado.nome,
            data: new Date().toLocaleDateString('pt-BR'),
            hora: new Date().toLocaleTimeString('pt-BR'),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            // Adiciona ao estoque
            await db.collection("estoque_blocado").add(dados);
            // Registra no histórico (movimentações)
            await db.collection("movimentacoes_wms").add({
                Data: dados.data,
                Hora: dados.hora,
                Origem: dados.origem,
                Destino: dados.ender,
                Material: dados.mat,
                Validade: dados.validade,
                Qtd: dados.qtd,
                Operador: dados.operador,
                timestamp: dados.timestamp
            });
            alert("Entrada registrada com sucesso!");
        } catch (e) { alert("Erro ao salvar"); }
    }

    // Exportação do Histórico conforme a imagem solicitada
    async function exportarHistoricoExcel() {
        try {
            const snap = await db.collection("movimentacoes_wms").orderBy("timestamp", "desc").get();
            const dadosParaExcel = snap.docs.map(doc => {
                const d = doc.data();
                return {
                    "Data": d.Data,
                    "Hora": d.Hora,
                    "Origem": d.Origem,
                    "Destino": d.Destino,
                    "Material": d.Material,
                    "Validade": d.Validade,
                    "Qtd": d.Qtd,
                    "Operador": d.Operador
                };
            });

            const ws = XLSX.utils.json_to_sheet(dadosParaExcel);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Histórico");
            XLSX.writeFile(wb, "Historico_Movimentacoes.xlsx");
        } catch (e) { alert("Erro ao gerar histórico: " + e.message); }
    }
</script>
</body>
</html>
