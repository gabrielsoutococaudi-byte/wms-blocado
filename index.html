<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS FLOW PRO - Sistema Integrado</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#161e31">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0a0f1e; 
            --card: #161e31; 
            --primary: #00d2ff; 
            --critico: #fbbf24; 
            --retido: #f87171; 
            --verde: #4ade80; 
            --text: #f8fafc; 
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        
        /* Menu Lateral */
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1000; padding-top: 60px; border-right: 1px solid #2d3748; }
        .sidebar.active { left: 0; }
        .sidebar button { width: 100%; padding: 15px; background: transparent; border: none; color: white; text-align: left; cursor: pointer; border-bottom: 1px solid #2d3748; font-weight: bold; }

        .header { padding: 15px 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 900; }
        .menu-btn { background: none; border: 1px solid #444; padding: 8px; border-radius: 5px; cursor: pointer; color: white; font-size: 20px; }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        /* Estilos de Busca e Cards */
        .search-area { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; outline: none; }
        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #444; }
        
        .badge-ender { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        .btn-retirar { background: var(--primary); color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: 900; cursor: pointer; }

        /* MODAL E REGRA PARA TECLADO */
        #modal-retirada { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center; backdrop-filter: blur(5px); overflow-y: auto; }
        .modal-content { background:var(--card); padding:25px; border-radius:15px; width:90%; max-width:400px; border:1px solid #2d3748; transition: all 0.3s ease; }

        /* QUANDO O TECLADO ABRIR (Tela menor que 450px de altura) */
        @media (max-height: 450px) {
            #modal-retirada { align-items: flex-start; padding-top: 10px; }
            .modal-content { padding: 15px; }
            .modal-content h3 { margin-bottom: 5px; font-size: 16px; }
            #modal-info { margin-bottom: 5px; font-size: 12px; }
            #modal-input-qtd { height: 45px !important; font-size: 22px !important; margin: 5px 0 !important; }
        }

        /* Botões Administrativos */
        .btn-admin { background: var(--verde); color: #000; padding: 15px; width: 100%; border-radius: 8px; font-weight: 900; margin-top: 10px; border: none; cursor: pointer; }
        
        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); }
        .login-box { background: var(--card); padding: 30px; border-radius: 15px; width: 320px; }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <button id="btn-nav-admin" onclick="navegar('admin')" style="display: none;">📊 DASHBOARD ADMIN</button>
    <button onclick="navegar('retirar')">📦 RETIRAR / PESQUISAR</button>
    <button onclick="navegar('abastecer')">📥 ABASTECER BLOCO</button>
    <button onclick="logout()" style="color: var(--retido); margin-top: 20px;">🚪 DESLOGAR</button>
</div>

<div id="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 25px;">WMS FLOW PRO</h2>
        <input type="text" id="login-mat" placeholder="Matrícula" style="margin-bottom:10px;">
        <input type="password" id="login-senha" placeholder="Senha" style="margin-bottom:20px;">
        <button onclick="tentarLogin()" class="btn-retirar" style="width: 100%; font-size: 16px;">ENTRAR</button>
    </div>
</div>

<div id="app-screen" style="display: none;">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div style="flex-grow: 1;">
            <div id="user-name" style="font-weight: 800; font-size: 16px;"></div>
            <div id="role-label" style="font-size: 10px; color: var(--primary); font-weight: bold;"></div>
        </div>
    </div>

    <div class="container">
        <div id="view-admin" style="display: none;">
             <div class="search-area">ADMINISTRAÇÃO</div>
             <button class="btn-admin" onclick="exportarHistoricoExcel()">GERAR EXCEL HISTÓRICO</button>
        </div>

        <div id="view-retirar">
            <div class="search-area">
                <input type="text" id="search-input" inputmode="numeric" placeholder="Pesquisar material ou endereço..." oninput="renderizarEstoque()">
            </div>
            <div id="lista-estoque"></div>
        </div>

        <div id="view-abastecer" style="display: none;">
            <div class="search-area">
                <h3>ABASTECER BLOCO</h3>
                <input type="text" id="in-ender" placeholder="Endereço (Ex: A-01-01)" style="margin-bottom:10px;">
                <input type="text" id="in-mat" placeholder="Material" style="margin-bottom:10px;">
                <input type="number" id="in-qtd" placeholder="Qtd Pallets" style="margin-bottom:10px;">
                <input type="date" id="in-venc" style="margin-bottom:10px;">
                <button class="btn-admin" onclick="salvarAbastecimentoManual()">SALVAR ENTRADA</button>
            </div>
        </div>
    </div>
</div>

<div id="modal-retirada">
    <div class="modal-content">
        <h3 id="modal-titulo" style="margin-top:0; color:var(--primary);">Retirar Material</h3>
        <p id="modal-info" style="line-height: 1.4;"></p>
        
        <label style="font-size:11px; color:#94a3b8;">QUANTIDADE DE PALLETS:</label>
        <input type="number" id="modal-input-qtd" inputmode="numeric" placeholder="0" 
               style="font-size:28px; text-align:center; margin:10px 0; border: 2px solid var(--primary); height: 60px;"
               onfocus="focarInput()">

        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="fecharModal()" style="flex:1; padding:15px; background:#334155; color:white; border:none; border-radius:8px; font-weight:bold;">CANCELAR</button>
            <button id="btn-confirmar-modal" style="flex:1; padding:15px; background:var(--primary); color:black; border:none; border-radius:8px; font-weight:900;">CONFIRMAR</button>
        </div>
    </div>
</div>

<script>
    // Configurações do Firebase (Mantenha as suas originais)
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let estoqueCompleto = [];
    let usuarioLogado = null;
    let itemParaRetirar = null;

    // Login e Navegação
    async function tentarLogin() {
        const mat = document.getElementById('login-mat').value.trim();
        const senha = document.getElementById('login-senha').value.trim();
        try {
            await auth.signInWithEmailAndPassword(mat + "@alb.com", senha);
            const doc = await db.collection("usuarios_wms").doc(mat + "@alb.com").get();
            if (doc.exists) {
                usuarioLogado = doc.data();
                usuarioLogado.email = mat + "@alb.com";
                iniciarApp();
            }
        } catch (e) { alert("Erro de Login."); }
    }

    function iniciarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('user-name').innerText = usuarioLogado.nome;
        const isAdmin = usuarioLogado.perfil.toUpperCase() === "ADMIN";
        document.getElementById('btn-nav-admin').style.display = isAdmin ? 'block' : 'none';
        conectarFirebase();
        navegar('retirar');
    }

    function navegar(tela) {
        ['admin', 'retirar', 'abastecer'].forEach(t => document.getElementById('view-' + t).style.display = 'none');
        document.getElementById('view-' + tela).style.display = 'block';
        document.getElementById('sidebar').classList.remove('active');
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }

    function conectarFirebase() {
        db.collection("estoque_blocado").onSnapshot(snap => {
            estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderizarEstoque();
        });
    }

    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase().trim();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';
        if (!termo) return;

        let filtrados = estoqueCompleto.filter(i => i.mat.toString().includes(termo) || i.ender.toLowerCase().includes(termo));
        
        filtrados.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div>
                    <span class="badge-ender">${item.ender}</span>
                    <div style="font-weight:900; font-size:18px; margin-top:5px;">${item.mat}</div>
                    <div style="font-size:11px; opacity:0.7;">${item.desc || ''}</div>
                </div>
                <div style="text-align:right">
                    <div style="font-size:20px; font-weight:900;">${item.qtd} PL</div>
                    <button class="btn-retirar" onclick="abrirModalRetirada('${item.id}', ${item.qtd}, '${item.mat}', '${item.ender}')">RETIRAR</button>
                </div>`;
            lista.appendChild(card);
        });
    }

    // MODAL E LÓGICA DE TECLADO
    function abrirModalRetirada(id, qtdAtual, mat, ender) {
        itemParaRetirar = { id, qtdAtual, mat, ender };
        document.getElementById('modal-titulo').innerText = `Retirar de: ${mat}`;
        document.getElementById('modal-info').innerHTML = `Endereço: <b>${ender}</b> | Saldo: <b>${qtdAtual} PL</b>`;
        document.getElementById('modal-input-qtd').value = '';
        document.getElementById('modal-retirada').style.display = 'flex';
        
        document.getElementById('btn-confirmar-modal').onclick = processarRetirada;
    }

    function focarInput() {
        // Pequeno atraso para o teclado subir e a regra de CSS agir antes do ajuste de scroll
        setTimeout(() => {
            document.getElementById('btn-confirmar-modal').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 300);
    }

    function fecharModal() {
        document.getElementById('modal-retirada').style.display = 'none';
        itemParaRetirar = null;
    }

    async function processarRetirada() {
        const v = parseInt(document.getElementById('modal-input-qtd').value);
        if (isNaN(v) || v <= 0 || v > itemParaRetirar.qtdAtual) return alert("Quantidade inválida!");

        try {
            if (v === itemParaRetirar.qtdAtual) {
                await db.collection("estoque_blocado").doc(itemParaRetirar.id).delete();
            } else {
                await db.collection("estoque_blocado").doc(itemParaRetirar.id).update({ qtd: itemParaRetirar.qtdAtual - v });
            }
            alert("Retirada realizada!");
            fecharModal();
        } catch (e) { alert("Erro ao salvar."); }
    }

    function logout() { auth.signOut(); location.reload(); }
</script>
</body>
</html>
