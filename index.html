<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS FLOW PRO - Gestão de Blocado</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0f1e; --card: #161e31; --primary: #00d2ff; --critico: #fbbf24; --retido: #f87171; --verde: #4ade80; --text: #f8fafc; --accent: #7c3aed; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1000; padding-top: 60px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        .sidebar.active { left: 0; }
        .sidebar button { width: 100%; padding: 15px; background: transparent; border: none; color: white; text-align: left; font-size: 16px; cursor: pointer; border-bottom: 1px solid #2d3748; }

        .header { padding: 15px 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 900; }
        .menu-btn { background: #eee; border: none; padding: 10px; border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
        .menu-btn div { width: 20px; height: 3px; background: #333; }

        .container { max-width: 900px; margin: auto; padding: 15px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; opacity: 0.8; }
        .form-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background: #0a0f1e; color: white; box-sizing: border-box; }
        
        .btn-save { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; }

        .item-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #4ade80; position: relative; }
        .item-critico { border-left-color: var(--critico); }
        .item-retido { border-left-color: var(--retido); }
        .badge-critico { background: var(--critico); color: #000; font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: 900; margin-left: 10px; }

        .ender-badge { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 800; }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <button onclick="mudarTela('retirar')">📦 ESTOQUE / RETIRAR</button>
    <button onclick="mudarTela('abastecer')">📥 ABASTECER POSIÇÃO</button>
    <button onclick="logout()">🚪 Sair</button>
</div>

<div id="app-screen">
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()"><div></div><div></div><div></div></button>
        <div style="flex-grow: 1;">
            <div id="user-name" style="font-size: 14px; font-weight: 800;">WMS FLOW</div>
            <div id="page-title" style="font-size: 10px; color: var(--primary); font-weight: bold;">ESTOQUE</div>
        </div>
    </div>

    <div class="container">
        <div id="tela-retirar">
            <input type="text" id="search-input" placeholder="Buscar material ou endereço..." oninput="renderizarEstoque()" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid #2d3748; background:#161e31; color:white;">
            <div id="lista-estoque"></div>
        </div>

        <div id="tela-abastecer" style="display: none;">
            <h3 style="color: var(--primary);">Abastecer Blocado</h3>
            <div class="form-group">
                <label>Endereço (Ex: A-01-01)</label>
                <input type="text" id="in-ender" placeholder="Digite a posição">
            </div>
            <div class="form-group">
                <label>Código Material</label>
                <input type="text" id="in-mat" oninput="buscarDescricao(this.value)">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="in-desc" readonly style="background: #0f172a;">
            </div>
            <div class="form-group">
                <label>Quantidade Pallets</label>
                <input type="number" id="in-qtd">
            </div>
            <div class="form-group">
                <label>Data de Vencimento</label>
                <input type="date" id="in-venc" onchange="calcularDias(this.value)">
                <p id="label-dias" style="color: var(--critico); font-size: 11px;"></p>
            </div>
            <button class="btn-save" onclick="salvarAbastecimento()">SALVAR ENTRADA</button>
        </div>
    </div>
</div>

<script>
    // CONFIGURAÇÃO FIREBASE (MANTENHA A SUA)
    const firebaseConfig = {
        apiKey: "AIzaSyBH5iSu56D2gUnSHwkweU9zVwWM_a-Yx0A",
        authDomain: "sistema-fefo.firebaseapp.com",
        projectId: "sistema-fefo",
        storageBucket: "sistema-fefo.firebasestorage.app",
        messagingSenderId: "755801777693",
        appId: "1:755801777693:web:a8a72a2fd483445a2d88f4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let estoqueCompleto = [];
    let diasCalculados = 0;

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    function mudarTela(tela) {
        toggleMenu();
        document.getElementById('tela-retirar').style.display = tela === 'retirar' ? 'block' : 'none';
        document.getElementById('tela-abastecer').style.display = tela === 'abastecer' ? 'block' : 'none';
        document.getElementById('page-title').innerText = tela === 'retirar' ? 'ESTOQUE' : 'ABASTECER';
    }

    // --- REGRAS DE BUSCA E PRIORIDADE ---
    function renderizarEstoque() {
        const termo = document.getElementById('search-input').value.toLowerCase();
        const lista = document.getElementById('lista-estoque');
        lista.innerHTML = '';

        let itens = estoqueCompleto.filter(i => 
            i.mat.toLowerCase().includes(termo) || i.ender.toLowerCase().includes(termo) || i.desc.toLowerCase().includes(termo)
        );

        // Lógica de Prioridade: 1º Críticos (<=60 dias), 2º O restante
        itens.sort((a, b) => {
            const aIsCritico = a.dias <= 60 ? 0 : 1;
            const bIsCritico = b.dias <= 60 ? 0 : 1;
            
            if (aIsCritico !== bIsCritico) return aIsCritico - bIsCritico;
            return a.dias - b.dias; // Entre os críticos, mostra o que vence antes primeiro
        });

        itens.forEach(item => {
            let cor = item.dias < 30 ? "item-retido" : (item.dias <= 60 ? "item-critico" : "");
            const card = document.createElement('div');
            card.className = `item-card ${cor}`;
            card.innerHTML = `
                <div>
                    <span class="ender-badge">${item.ender}</span>
                    ${item.dias <= 60 ? '<span class="badge-critico">DATA CRÍTICA</span>' : ''}
                    <div style="font-weight:bold; margin-top:8px;">${item.mat} - ${item.desc}</div>
                    <div style="font-size:10px; opacity:0.7;">Vence em: ${item.dias} dias</div>
                </div>
                <div style="text-align:right">
                    <div style="font-size:18px; font-weight:900;">${item.qtd} PL</div>
                </div>
            `;
            lista.appendChild(card);
        });
    }

    // --- BLOQUEIO DE DUPLICIDADE ---
    async function salvarAbastecimento() {
        const ender = document.getElementById('in-ender').value.toUpperCase().trim();
        const mat = document.getElementById('in-mat').value.trim();
        const qtd = parseInt(document.getElementById('in-qtd').value);

        if(!ender || !mat || isNaN(qtd)) return alert("Preencha todos os campos!");

        // Validação: Verificando se a posição já está ocupada no banco
        const jaExiste = estoqueCompleto.find(i => i.ender === ender);
        
        if(jaExiste) {
            alert(`ERRO: A posição ${ender} já está ocupada pelo material ${jaExiste.mat}. Não é permitido duplicar o endereço.`);
            return;
        }

        const dados = {
            ender: ender,
            mat: mat,
            desc: document.getElementById('in-desc').value || "PRODUTO",
            qtd: qtd,
            dias: diasCalculados,
            valFrente: document.getElementById('in-venc').value.split('-').reverse().join('/'),
            dataContagem: new Date().toLocaleDateString()
        };

        try {
            await db.collection("estoque_blocado").add(dados);
            alert("Posição abastecida com sucesso!");
            mudarTela('retirar');
            limparCampos();
        } catch(e) { alert("Erro ao salvar."); }
    }

    // Funções Auxiliares
    function calcularDias(data) {
        const diff = Math.ceil((new Date(data) - new Date()) / (1000 * 60 * 60 * 24));
        diasCalculados = diff;
        document.getElementById('label-dias').innerText = `Sistema calculou: ${diff} dias p/ vencer`;
    }

    function buscarDescricao(cod) {
        const item = estoqueCompleto.find(i => i.mat === cod);
        document.getElementById('in-desc').value = item ? item.desc : "";
    }

    function limparCampos() {
        document.querySelectorAll('input').forEach(i => i.value = "");
        document.getElementById('label-dias').innerText = "";
    }

    db.collection("estoque_blocado").onSnapshot(snap => {
        estoqueCompleto = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderizarEstoque();
    });
</script>
</body>
</html>
